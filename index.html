<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 粒子系统 - 手势控制</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>

    <!-- Three.js -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js">
    </script>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js">
    </script>

    <style>
        :root {
            --bg: #0a0a0f;
            --panel-bg: rgba(15, 15, 25, 0.85);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* ---- UI 面板 ---- */
        .ui-panel {
            position: fixed;
            z-index: 10;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            padding: 10px 16px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            .ui-panel {
                bottom: 28px;
                gap: 12px;
                padding: 12px 20px;
                border-radius: 24px;
            }
        }

        /* ---- 按钮 ---- */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            outline: none;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.01em;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
        .btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        @media (max-width: 480px) {
            .btn {
                padding: 8px 12px;
                font-size: 11px;
                gap: 4px;
                border-radius: 12px;
            }
            .btn svg {
                width: 15px;
                height: 15px;
            }
        }

        /* ---- 上传按钮特殊样式 ---- */
        .btn-upload {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }
        .btn-upload:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.5);
        }

        /* ---- 状态指示器 ---- */
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            transition: background 0.4s ease;
        }
        .status-dot.camera-on {
            background: var(--success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }
        .status-dot.camera-off {
            background: var(--danger);
        }
        .status-dot.breathing {
            background: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
        }

        /* ---- 提示标签 ---- */
        .hint-tag {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px 18px;
            border-radius: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.02em;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        @media (max-width: 480px) {
            .hint-tag {
                top: 16px;
                font-size: 10px;
                padding: 6px 14px;
            }
        }

        /* ---- 隐藏的文件输入 ---- */
        #image-upload {
            display: none;
        }

        /* ---- 粒子计数 ---- */
        .particle-count {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.04em;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 480px) {
            .particle-count {
                top: 16px;
                right: 16px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- 画布容器 -->
    <div id="canvas-container"></div>

    <!-- 顶部提示 -->
    <div class="hint-tag" id="hint-tag">👆 开启摄像头，用拇指与食指张合控制粒子</div>

    <!-- 粒子计数 -->
    <div class="particle-count" id="particle-count">PARTICLES: 10,000</div>

    <!-- 底部控制面板 -->
    <div class="ui-panel" id="ui-panel">
        <!-- 上传图片按钮 -->
        <button class="btn btn-upload" id="btn-upload" title="上传图片生成粒子">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
            </svg>
            <span class="btn-label">图片</span>
        </button>

        <!-- 摄像头开关 -->
        <button class="btn" id="btn-camera" title="开关手势识别">
            <span class="status-dot camera-off" id="status-dot"></span>
            <span class="btn-label">手势</span>
        </button>

        <!-- 全屏按钮 -->
        <button class="btn" id="btn-fullscreen" title="全屏模式">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="fs-icon-expand">
                <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="fs-icon-shrink" style="display:none">
                <path d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3M3 16h3a2 2 0 012 2v3m8 0v-3a2 2 0 012-2h3"/>
            </svg>
        </button>

        <!-- 重置 -->
        <button class="btn" id="btn-reset" title="恢复默认球体">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 019.95 9"/>
            </svg>
        </button>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="image-upload" accept="image/*">

    <!-- 隐藏的视频元素（用于摄像头） -->
    <video id="video-input" playsinline autoplay muted style="display:none;"></video>

    <script>
        (function() {
            // ==================== DOM 元素 ====================
            const container = document.getElementById('canvas-container');
            const hintTag = document.getElementById('hint-tag');
            const particleCountEl = document.getElementById('particle-count');
            const btnUpload = document.getElementById('btn-upload');
            const btnCamera = document.getElementById('btn-camera');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            const btnReset = document.getElementById('btn-reset');
            const statusDot = document.getElementById('status-dot');
            const fileInput = document.getElementById('image-upload');
            const videoElement = document.getElementById('video-input');
            const fsIconExpand = document.getElementById('fs-icon-expand');
            const fsIconShrink = document.getElementById('fs-icon-shrink');

            // ==================== 状态变量 ====================
            const MAX_PARTICLES = 15000;
            let cameraEnabled = false;
            let currentDispersion = 0.0; // 当前扩散值 (0=聚集, 1=完全散开)
            let targetDispersion = 0.0; // 目标扩散值
            let handDetected = false;
            let hasImage = false;
            let particleCount = 10000;

            // ==================== THREE.JS 初始化 ====================
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05050a, 0.0018);
            scene.background = new THREE.Color(0x05050a);

            const camera = new THREE.PerspectiveCamera(
                70,
                container.clientWidth / container.clientHeight,
                0.1,
                30
            );
            camera.position.set(0, 0.3, 4.8);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // ==================== 着色器 ====================
            const vertexShader = /* glsl */ `
                attribute vec3 randomPosition;
                attribute vec3 color;
                attribute float size;
                varying vec3 vColor;
                varying float vAlpha;
                uniform float uDispersion;
                uniform float uTime;
                uniform float uPointSize;
                uniform float uPixelRatio;

                void main() {
                    // ---- 核心：在目标位置和随机位置之间插值 ----
                    vec3 pos = mix(position, randomPosition, uDispersion);

                    // ---- 微小浮动效果 ----
                    float wave = sin(uTime * 1.8 + position.x * 3.5) * cos(uTime * 1.3 + position.y * 2.7) * 0.025;
                    wave += sin(uTime * 2.5 + position.z * 4.1) * 0.015;
                    pos += wave * (1.0 - uDispersion * 0.6);

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);

                    // ---- 距离衰减：远处粒子更小 ----
                    float dist = length(mvPosition.xyz);
                    float sizeAttenuation = clamp(3.5 / -mvPosition.z, 0.4, 2.0);

                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = uPointSize * uPixelRatio * size * sizeAttenuation;
                    gl_PointSize = clamp(gl_PointSize, 0.5, 40.0);

                    vColor = color;
                    // 扩散越大，粒子略微透明
                    vAlpha = 1.0 - uDispersion * 0.25;
                }
            `;

            const fragmentShader = /* glsl */ `
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    // ---- 圆形粒子 ----
                    float dist = length(gl_PointCoord - vec2(0.5, 0.5));

                    // ---- 边缘柔化 ----
                    float alpha = 1.0 - smoothstep(0.38, 0.5, dist);

                    // ---- 中心微亮 ----
                    float glow = exp(-dist * 4.5) * 0.35;
                    alpha += glow;
                    alpha = clamp(alpha, 0.0, 1.0);

                    if (alpha < 0.02) discard;

                    vec3 finalColor = vColor + glow * 0.3;
                    gl_FragColor = vec4(finalColor, alpha * vAlpha);
                }
            `;

            // ==================== 粒子几何体 ====================
            const geometry = new THREE.BufferGeometry();
            let targetPositions, randomPositions, colors, sizes;

            function generateSphereParticles(count) {
                targetPositions = new Float32Array(count * 3);
                randomPositions = new Float32Array(count * 3);
                colors = new Float32Array(count * 3);
                sizes = new Float32Array(count);

                const radius = 1.6;
                const scatterRadius = 3.5;
                const goldenRatio = (1 + Math.sqrt(5)) / 2;

                for (let i = 0; i < count; i++) {
                    // ---- Fibonacci 球体分布（均匀） ----
                    const theta = 2 * Math.PI * i / goldenRatio;
                    const phi = Math.acos(1 - 2 * (i + 0.5) / count);
                    const x = Math.sin(phi) * Math.cos(theta);
                    const y = Math.sin(phi) * Math.sin(theta);
                    const z = Math.cos(phi);

                    targetPositions[i * 3] = x * radius;
                    targetPositions[i * 3 + 1] = y * radius;
                    targetPositions[i * 3 + 2] = z * radius;

                    // ---- 随机散开位置 ----
                    const thetaR = Math.random() * Math.PI * 2;
                    const phiR = Math.acos(2 * Math.random() - 1);
                    const rR = scatterRadius * (0.6 + Math.random() * 0.4);
                    randomPositions[i * 3] = Math.sin(phiR) * Math.cos(thetaR) * rR;
                    randomPositions[i * 3 + 1] = Math.sin(phiR) * Math.sin(thetaR) * rR;
                    randomPositions[i * 3 + 2] = Math.cos(phiR) * rR;

                    // ---- 颜色：蓝紫渐变 ----
                    const hue = 0.6 + Math.random() * 0.2; // 蓝到紫
                    const sat = 0.6 + Math.random() * 0.4;
                    const light = 0.45 + Math.random() * 0.35;
                    const col = new THREE.Color().setHSL(hue, sat, light);
                    colors[i * 3] = col.r;
                    colors[i * 3 + 1] = col.g;
                    colors[i * 3 + 2] = col.b;

                    // ---- 大小 ----
                    sizes[i] = 0.6 + Math.random() * 1.6;
                }
            }

            function updateGeometryAttributes() {
                geometry.setAttribute('position', new THREE.BufferAttribute(targetPositions, 3));
                geometry.setAttribute('randomPosition', new THREE.BufferAttribute(randomPositions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            }

            // 初始生成
            generateSphereParticles(MAX_PARTICLES);
            updateGeometryAttributes();
            particleCount = MAX_PARTICLES;

            // ==================== ShaderMaterial ====================
            const material = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms: {
                    uDispersion: { value: 0.0 },
                    uTime: { value: 0.0 },
                    uPointSize: { value: 28.0 },
                    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
                },
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            // ==================== 背景星场 ====================
            const starsGeo = new THREE.BufferGeometry();
            const starsCount = 600;
            const starsPos = new Float32Array(starsCount * 3);
            for (let i = 0; i < starsCount; i++) {
                starsPos[i * 3] = (Math.random() - 0.5) * 12;
                starsPos[i * 3 + 1] = (Math.random() - 0.5) * 12;
                starsPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
            const starsMat = new THREE.PointsMaterial({
                color: 0x444466,
                size: 0.015,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                opacity: 0.6,
            });
            const stars = new THREE.Points(starsGeo, starsMat);
            scene.add(stars);

            // ==================== 图片上传处理 ====================
            function processImage(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        convertImageToParticles(img);
                        hasImage = true;
                        hintTag.textContent = '🖼️ 图片已加载，手势控制粒子聚散';
                        hintTag.style.opacity = '1';
                        setTimeout(() => { hintTag.style.opacity = '0.7'; }, 2000);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function convertImageToParticles(img) {
                // 限制最大尺寸
                const maxDim = 180;
                let w = img.width;
                let h = img.height;
                if (w > maxDim || h > maxDim) {
                    const ratio = Math.min(maxDim / w, maxDim / h);
                    w = Math.floor(w * ratio);
                    h = Math.floor(h * ratio);
                }

                // 绘制到 canvas
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);
                const imageData = ctx.getImageData(0, 0, w, h);
                const pixels = imageData.data;

                // 收集有效像素（alpha > 20）
                const validPixels = [];
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = (y * w + x) * 4;
                        const r = pixels[idx];
                        const g = pixels[idx + 1];
                        const b = pixels[idx + 2];
                        const a = pixels[idx + 3];
                        if (a > 20) {
                            validPixels.push({ x, y, r, g, b, a });
                        }
                    }
                }

                if (validPixels.length === 0) {
                    alert('未检测到有效像素，请上传包含不透明内容的图片（建议透明底PNG）。');
                    return;
                }

                // 限制最大粒子数
                let sampledPixels = validPixels;
                if (validPixels.length > MAX_PARTICLES) {
                    // 随机采样
                    sampledPixels = [];
                    const step = validPixels.length / MAX_PARTICLES;
                    for (let i = 0; i < MAX_PARTICLES; i++) {
                        sampledPixels.push(validPixels[Math.floor(i * step)]);
                    }
                } else if (validPixels.length < MAX_PARTICLES) {
                    // 用重复填充到 MAX_PARTICLES
                    const repeats = Math.ceil(MAX_PARTICLES / validPixels.length);
                    sampledPixels = [];
                    for (let r = 0; r < repeats; r++) {
                        for (const p of validPixels) {
                            sampledPixels.push(p);
                            if (sampledPixels.length >= MAX_PARTICLES) break;
                        }
                        if (sampledPixels.length >= MAX_PARTICLES) break;
                    }
                }

                const count = sampledPixels.length;
                particleCount = count;
                targetPositions = new Float32Array(count * 3);
                randomPositions = new Float32Array(count * 3);
                colors = new Float32Array(count * 3);
                sizes = new Float32Array(count);

                const scale = 2.8 / Math.max(w, h);
                const offsetX = -w * scale / 2;
                const offsetY = h * scale / 2;
                const scatterRadius = 3.5;

                for (let i = 0; i < count; i++) {
                    const p = sampledPixels[i];
                    // 目标位置：图片像素映射到 3D 平面，居中
                    targetPositions[i * 3] = p.x * scale + offsetX;
                    targetPositions[i * 3 + 1] = -(p.y * scale - offsetY);
                    targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 0.15;

                    // 随机散开位置
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = scatterRadius * (0.6 + Math.random() * 0.4);
                    randomPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
                    randomPositions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
                    randomPositions[i * 3 + 2] = Math.cos(phi) * r;

                    // 颜色：使用像素 RGB
                    colors[i * 3] = p.r / 255;
                    colors[i * 3 + 1] = p.g / 255;
                    colors[i * 3 + 2] = p.b / 255;

                    // 大小：基于 alpha 通道
                    sizes[i] = 0.5 + (p.a / 255) * 2.0;
                }

                updateGeometryAttributes();
                particleCountEl.textContent = `PARTICLES: ${count.toLocaleString()}`;

                // 短暂展示聚集状态
                targetDispersion = 0.0;
            }

            // ==================== 重置为球体 ====================
            function resetToSphere() {
                hasImage = false;
                generateSphereParticles(MAX_PARTICLES);
                updateGeometryAttributes();
                particleCount = MAX_PARTICLES;
                particleCountEl.textContent = `PARTICLES: ${MAX_PARTICLES.toLocaleString()}`;
                hintTag.textContent = '👆 开启摄像头，用拇指与食指张合控制粒子';
                hintTag.style.opacity = '1';
                setTimeout(() => { hintTag.style.opacity = '0.7'; }, 2500);
            }

            // ==================== 手势识别 (MediaPipe) ====================
            let handsInstance = null;
            let cameraStream = null;

            async function initMediaPipe() {
                if (handsInstance) return handsInstance;

                const Hands = window.Hands;
                handsInstance = new Hands({
                    locateFile: (file) =>
                        `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`,
                });

                handsInstance.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.5,
                });

                handsInstance.onResults(onHandResults);
                return handsInstance;
            }

            function onHandResults(results) {
                if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                    handDetected = false;
                    return;
                }

                handDetected = true;
                const landmarks = results.multiHandLandmarks;

                if (landmarks.length === 1) {
                    // ---- 单手：拇指和食指距离 → 扩散值 ----
                    const thumb = landmarks[0][4]; // 拇指尖
                    const index = landmarks[0][8]; // 食指尖
                    const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y, thumb.z - index.z);

                    // 归一化：捏合(~0.03) → 0，张开(~0.25) → 1
                    const minDist = 0.025;
                    const maxDist = 0.22;
                    const raw = (dist - minDist) / (maxDist - minDist);
                    targetDispersion = Math.max(0, Math.min(1, raw));
                } else if (landmarks.length === 2) {
                    // ---- 双手：两手中心距离 → 扩散值 ----
                    const center1 = getHandCenter(landmarks[0]);
                    const center2 = getHandCenter(landmarks[1]);
                    const dist = Math.hypot(
                        center1.x - center2.x,
                        center1.y - center2.y,
                        center1.z - center2.z
                    );
                    const minDist = 0.08;
                    const maxDist = 0.55;
                    const raw = (dist - minDist) / (maxDist - minDist);
                    targetDispersion = Math.max(0, Math.min(1, raw));
                }
            }

            function getHandCenter(landmarks) {
                let cx = 0,
                    cy = 0,
                    cz = 0;
                const count = landmarks.length;
                for (const lm of landmarks) {
                    cx += lm.x;
                    cy += lm.y;
                    cz += lm.z;
                }
                return { x: cx / count, y: cy / count, z: cz / count };
            }

            async function startCamera() {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: 640, height: 480 },
                    });
                    videoElement.srcObject = cameraStream;
                    await videoElement.play();

                    const hands = await initMediaPipe();
                    const CameraUtils = window.CameraUtils;
                    const cameraUtils = new CameraUtils.Camera(videoElement, {
                        onFrame: async () => {
                            await hands.send({ image: videoElement });
                        },
                        width: 640,
                        height: 480,
                    });
                    await cameraUtils.start();

                    cameraEnabled = true;
                    statusDot.className = 'status-dot camera-on';
                    btnCamera.classList.add('active');
                    hintTag.textContent = '👌 手势已激活：捏合聚集 · 张开扩散';
                    hintTag.style.opacity = '1';
                    setTimeout(() => { hintTag.style.opacity = '0.7'; }, 3000);

                    console.log('✅ 摄像头已启动，手势识别运行中');
                } catch (err) {
                    console.error('摄像头启动失败:', err);
                    cameraEnabled = false;
                    statusDot.className = 'status-dot camera-off';
                    btnCamera.classList.remove('active');
                    hintTag.textContent = '⚠️ 摄像头不可用，使用自动呼吸模式';
                    hintTag.style.opacity = '1';
                    setTimeout(() => { hintTag.style.opacity = '0.7'; }, 3000);
                }
            }

            function stopCamera() {
                if (cameraStream) {
                    cameraStream.getTracks().forEach((track) => track.stop());
                    cameraStream = null;
                }
                videoElement.srcObject = null;
                cameraEnabled = false;
                handDetected = false;
                statusDot.className = 'status-dot camera-off';
                btnCamera.classList.remove('active');
                hintTag.textContent = '👆 摄像头已关闭，自动呼吸模式';
                hintTag.style.opacity = '1';
                setTimeout(() => { hintTag.style.opacity = '0.7'; }, 2000);
            }

            async function toggleCamera() {
                if (cameraEnabled) {
                    stopCamera();
                } else {
                    await startCamera();
                }
            }

            // ==================== 全屏 ====================
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.body.requestFullscreen().catch(() => {});
                    fsIconExpand.style.display = 'none';
                    fsIconShrink.style.display = 'block';
                } else {
                    document.exitFullscreen();
                    fsIconExpand.style.display = 'block';
                    fsIconShrink.style.display = 'none';
                }
            }

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    fsIconExpand.style.display = 'none';
                    fsIconShrink.style.display = 'block';
                } else {
                    fsIconExpand.style.display = 'block';
                    fsIconShrink.style.display = 'none';
                }
            });

            // ==================== 动画循环 ====================
            const clock = new THREE.Clock();
            let autoBreathTime = 0;

            function animate() {
                requestAnimationFrame(animate);

                const delta = Math.min(clock.getDelta(), 0.1);
                const elapsed = performance.now() * 0.001;

                // ---- 扩散因子平滑插值 ----
                if (!handDetected && !cameraEnabled) {
                    // 自动呼吸模式
                    autoBreathTime += delta * 0.7;
                    targetDispersion = Math.sin(autoBreathTime) * 0.5 + 0.5;
                    statusDot.className = 'status-dot breathing';
                } else if (!handDetected && cameraEnabled) {
                    // 摄像头开着但没检测到手，缓慢回到中等扩散
                    targetDispersion = Math.max(0, targetDispersion - delta * 0.8);
                    statusDot.className = 'status-dot camera-on';
                }

                // Lerp 平滑
                const lerpSpeed = 4.5;
                currentDispersion += (targetDispersion - currentDispersion) * lerpSpeed * delta;

                // ---- 更新 uniform ----
                material.uniforms.uDispersion.value = currentDispersion;
                material.uniforms.uTime.value = elapsed;

                // ---- 缓慢旋转 ----
                const rotSpeed = 0.15 + currentDispersion * 0.3;
                points.rotation.y += rotSpeed * delta;
                points.rotation.x += rotSpeed * 0.35 * delta;

                // 星星反方向旋转
                stars.rotation.y -= rotSpeed * 0.4 * delta;
                stars.rotation.x -= rotSpeed * 0.15 * delta;

                // 相机微微浮动
                const camFloat = Math.sin(elapsed * 0.4) * 0.15;
                camera.position.y = 0.3 + camFloat;
                camera.lookAt(0, 0, 0);

                // ---- 渲染 ----
                renderer.render(scene, camera);
            }

            // ==================== 事件绑定 ====================
            btnUpload.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    processImage(file);
                }
                fileInput.value = '';
            });

            btnCamera.addEventListener('click', toggleCamera);
            btnFullscreen.addEventListener('click', toggleFullscreen);
            btnReset.addEventListener('click', resetToSphere);

            // 响应式处理
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
                material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
            });

            // 键盘快捷键
            window.addEventListener('keydown', (e) => {
                switch (e.key.toLowerCase()) {
                    case 'f':
                        toggleFullscreen();
                        break;
                    case 'c':
                        toggleCamera();
                        break;
                    case 'r':
                        resetToSphere();
                        break;
                    case 'u':
                        fileInput.click();
                        break;
                }
            });

            // 触摸设备双击全屏
            renderer.domElement.addEventListener('dblclick', toggleFullscreen);

            // ==================== 启动 ====================
            updateGeometryAttributes();
            particleCountEl.textContent = `PARTICLES: ${MAX_PARTICLES.toLocaleString()}`;
            animate();

            console.log('🚀 3D 粒子系统已就绪');
            console.log('   📷 按 C 或点击「手势」按钮开启摄像头');
            console.log('   🖼️ 点击「图片」上传透明底 PNG');
            console.log('   🔲 按 F 或点击全屏按钮');
            console.log('   🔄 按 R 重置为球体');
        })();
    </script>
</body>
</html>
