<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手势骨骼调试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            font-family: monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 摄像头画面 */
        #video-el {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }
        /* 骨骼画布 */
        #sk-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* 诊断面板 */
        #diag {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-size: 11px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #333;
            line-height: 1.6;
            max-width: 300px;
            pointer-events: none;
        }
        #diag .err { color: #f44; }
        #diag .warn { color: #fa0; }
        #diag .ok { color: #0f0; }
    </style>
</head>
<body>

    <video id="video-el" playsinline autoplay muted></video>
    <canvas id="sk-canvas"></canvas>
    <div id="diag">
        <div>状态: <span id="d-status">等待启动...</span></div>
        <div>视频: <span id="d-video">--</span></div>
        <div>模型: <span id="d-model">--</span></div>
        <div>send: <span id="d-send">--</span></div>
        <div>回调: <span id="d-cb">--</span></div>
        <div>手数: <span id="d-hands">0</span></div>
        <div>距离: <span id="d-dist">--</span></div>
    </div>

    <!-- 注意：不指定版本号，让 jsdelivr 给最新 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        (function() {
            const videoEl = document.getElementById('video-el');
            const skCanvas = document.getElementById('sk-canvas');
            const skCtx = skCanvas.getContext('2d');

            // 诊断 DOM
            const dStatus = document.getElementById('d-status');
            const dVideo = document.getElementById('d-video');
            const dModel = document.getElementById('d-model');
            const dSend = document.getElementById('d-send');
            const dCb = document.getElementById('d-cb');
            const dHands = document.getElementById('d-hands');
            const dDist = document.getElementById('d-dist');

            let handsInstance = null;
            let frameLoopId = null;
            let latestLandmarks = null;
            let sendCount = 0;
            let cbCount = 0;

            // 画布尺寸
            function resize() {
                skCanvas.width = window.innerWidth;
                skCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // 连线
            const CONNS = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],
                [0,17],[17,18],[18,19],[19,20],
                [5,9],[9,13],[13,17]
            ];
            const TIPS = new Set([4,8,12,16,20]);

            function drawSkeleton(landmarksList) {
                skCtx.clearRect(0, 0, skCanvas.width, skCanvas.height);
                if (!landmarksList || landmarksList.length === 0) return;

                const w = skCanvas.width;
                const h = skCanvas.height;

                for (const lm of landmarksList) {
                    // 连线
                    skCtx.strokeStyle = 'rgba(100,210,255,0.9)';
                    skCtx.lineWidth = 2;
                    skCtx.beginPath();
                    for (const [a,b] of CONNS) {
                        skCtx.moveTo(lm[a].x * w, lm[a].y * h);
                        skCtx.lineTo(lm[b].x * w, lm[b].y * h);
                    }
                    skCtx.stroke();

                    // 关节点
                    for (let i = 0; i < lm.length; i++) {
                        const p = lm[i];
                        const sx = p.x * w, sy = p.y * h;
                        const r = (i===4||i===8) ? 6 : TIPS.has(i) ? 4 : 2.5;
                        skCtx.beginPath();
                        skCtx.arc(sx, sy, r, 0, Math.PI*2);
                        skCtx.fillStyle = (i===4||i===8) ? '#ffd000' : TIPS.has(i) ? '#ff6b9d' : '#fff';
                        skCtx.fill();
                    }
                }
            }

            // ============ 核心：初始化 MediaPipe ============
            async function initHands() {
                if (handsInstance) return handsInstance;

                dStatus.textContent = '初始化 MediaPipe...';
                dStatus.className = 'warn';

                const Hands = window.Hands;
                if (!Hands) {
                    dModel.textContent = 'window.Hands 不存在!';
                    dModel.className = 'err';
                    throw new Error('MediaPipe 脚本未加载。请检查网络。');
                }

                handsInstance = new Hands({
                    locateFile: (file) => {
                        const url = `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                        console.log('locateFile:', file, '->', url);
                        return url;
                    },
                });

                handsInstance.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.4,
                });

                handsInstance.onResults((results) => {
                    cbCount++;
                    dCb.textContent = cbCount;
                    dCb.className = 'ok';

                    const lm = results.multiHandLandmarks;
                    if (lm && lm.length > 0) {
                        latestLandmarks = lm;
                        dHands.textContent = lm.length;
                        dHands.className = 'ok';

                        // 算出拇指-食指距离
                        const t = lm[0][4], i = lm[0][8];
                        const dist = Math.hypot(t.x-i.x, t.y-i.y, t.z-i.z);
                        dDist.textContent = dist.toFixed(4);

                        drawSkeleton(lm);
                    } else {
                        latestLandmarks = null;
                        dHands.textContent = '0';
                        dHands.className = '';
                        dDist.textContent = '--';
                        skCtx.clearRect(0,0,skCanvas.width,skCanvas.height);
                    }
                });

                dModel.textContent = '加载 WASM...';
                dModel.className = 'warn';
                await handsInstance.initialize();
                dModel.textContent = '就绪';
                dModel.className = 'ok';
                dStatus.textContent = '模型就绪，开始识别...';
                dStatus.className = 'ok';

                return handsInstance;
            }

            // ============ 摄像头 ============
            async function start() {
                try {
                    dStatus.textContent = '请求摄像头...';
                    dStatus.className = 'warn';

                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: 640, height: 480 }
                    });

                    videoEl.srcObject = stream;
                    await videoEl.play();

                    // 等视频帧就绪
                    dVideo.textContent = `等待帧... readyState=${videoEl.readyState}`;
                    dVideo.className = 'warn';
                    if (videoEl.readyState < 2) {
                        await new Promise((resolve, reject) => {
                            const t = setTimeout(() => reject(new Error('视频超时')), 8000);
                            videoEl.onloadeddata = () => { clearTimeout(t); resolve(); };
                        });
                    }
                    dVideo.textContent = `OK ${videoEl.videoWidth}x${videoEl.videoHeight}`;
                    dVideo.className = 'ok';

                    await initHands();

                    // 帧循环
                    dStatus.textContent = '帧循环运行中...';
                    dStatus.className = 'ok';
                    dSend.textContent = '0';
                    dSend.className = '';

                    const process = async () => {
                        try {
                            if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
                                await handsInstance.send({ image: videoEl });
                                sendCount++;
                                dSend.textContent = sendCount;
                                dSend.className = 'ok';
                            }
                        } catch(e) {
                            dSend.textContent = `err:${e.message}`;
                            dSend.className = 'err';
                            console.error('send error:', e);
                        }
                        frameLoopId = requestAnimationFrame(process);
                    };
                    process();

                } catch(err) {
                    dStatus.textContent = `失败: ${err.name}`;
                    dStatus.className = 'err';
                    dVideo.textContent = err.message;
                    dVideo.className = 'err';
                    console.error(err);
                }
            }

            // 自动启动
            start();

            console.log('🦴 调试版已启动 - 观察左上角面板');
        })();
    </script>
</body>
</html>
