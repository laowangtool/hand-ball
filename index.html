<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 粒子系统 - 手势控制</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <!-- MediaPipe Hands (仅需要 hands 包，不需要 camera_utils) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous">
    </script>

    <style>
        :root {
            --bg: #0a0a0f;
            --panel-bg: rgba(15, 15, 25, 0.85);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            inset: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* ---- 加载遮罩 ---- */
        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.5s ease;
            pointer-events: all;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-ring {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loader-text {
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 0.04em;
        }

        /* ---- 通知 Toast ---- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 10px 20px;
            border-radius: 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            letter-spacing: 0.02em;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        /* ---- 底部控制面板 ---- */
        .ui-panel {
            position: fixed;
            z-index: 10;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            transition: all 0.3s ease;
        }
        @media (min-width: 640px) {
            .ui-panel {
                bottom: 24px;
                gap: 10px;
                padding: 10px 18px;
                border-radius: 22px;
            }
        }

        /* ---- 按钮 ---- */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px 13px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.22s ease;
            white-space: nowrap;
            outline: none;
            letter-spacing: 0.01em;
            -webkit-tap-highlight-color: transparent;
            min-height: 40px;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }
        .btn:active {
            transform: scale(0.95);
            transition: transform 0.1s ease;
        }
        .btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 18px var(--accent-glow);
        }
        .btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .btn-upload {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }
        .btn-upload:hover {
            background: rgba(99, 102, 241, 0.25);
        }
        @media (min-width: 640px) {
            .btn {
                padding: 10px 16px;
                font-size: 13px;
                gap: 6px;
                border-radius: 14px;
            }
            .btn svg {
                width: 18px;
                height: 18px;
            }
        }

        /* ---- 状态点 ---- */
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #64748b;
            flex-shrink: 0;
            transition: all 0.35s ease;
        }
        .status-dot.on {
            background: var(--success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }
        .status-dot.off {
            background: var(--danger);
        }
        .status-dot.auto {
            background: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
        }

        /* ---- 粒子计数 ---- */
        .particle-count {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 0.05em;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
            opacity: 0.7;
        }
        @media (min-width: 640px) {
            .particle-count {
                top: 20px;
                right: 20px;
                font-size: 11px;
            }
        }

        #image-upload {
            display: none;
        }
        #video-input {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 加载遮罩 -->
    <div id="loading-overlay">
        <div class="loader-ring"></div>
        <div class="loader-text">INITIALIZING</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 画布 -->
    <div id="canvas-container"></div>

    <!-- 粒子计数 -->
    <div class="particle-count" id="particle-count">PARTICLES: 10,000</div>

    <!-- 底部面板 -->
    <div class="ui-panel">
        <button class="btn btn-upload" id="btn-upload" title="上传图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
            </svg>
            <span>图片</span>
        </button>

        <button class="btn" id="btn-camera" title="开关摄像头手势识别">
            <span class="status-dot off" id="status-dot"></span>
            <span>手势</span>
        </button>

        <button class="btn" id="btn-fullscreen" title="全屏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="fs-expand">
                <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="fs-shrink" style="display:none">
                <path d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3M3 16h3a2 2 0 012 2v3m8 0v-3a2 2 0 012-2h3"/>
            </svg>
        </button>

        <button class="btn" id="btn-reset" title="恢复默认球体">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 019.95 9"/>
            </svg>
        </button>
    </div>

    <input type="file" id="image-upload" accept="image/*">
    <video id="video-input" playsinline autoplay muted></video>

    <script type="module">
        import * as THREE from 'three';

        // ==================== DOM 引用 ====================
        const container = document.getElementById('canvas-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const toast = document.getElementById('toast');
        const particleCountEl = document.getElementById('particle-count');
        const btnUpload = document.getElementById('btn-upload');
        const btnCamera = document.getElementById('btn-camera');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const btnReset = document.getElementById('btn-reset');
        const statusDot = document.getElementById('status-dot');
        const fileInput = document.getElementById('image-upload');
        const videoElement = document.getElementById('video-input');
        const fsExpand = document.getElementById('fs-expand');
        const fsShrink = document.getElementById('fs-shrink');

        // ==================== Toast ====================
        let toastTimer;

        function showToast(msg, duration = 2200) {
            clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ==================== 状态 ====================
        const MAX_PARTICLES = 15000;
        let cameraEnabled = false;
        let currentDispersion = 0.0;
        let targetDispersion = 0.0;
        let handDetected = false;
        let handsInstance = null;
        let cameraStream = null;
        let frameRequestId = null;
        let particleCount = MAX_PARTICLES;

        // ==================== Three.js 初始化 ====================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050a, 0.0018);
        scene.background = new THREE.Color(0x05050a);

        const camera = new THREE.PerspectiveCamera(
            70,
            container.clientWidth / container.clientHeight,
            0.1,
            30
        );
        camera.position.set(0, 0.35, 4.8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // ==================== 着色器 ====================
        const vertexShader = /* glsl */ `
            attribute vec3 randomPosition;
            attribute vec3 color;
            attribute float size;
            varying vec3 vColor;
            varying float vAlpha;
            varying float vDist;
            uniform float uDispersion;
            uniform float uTime;
            uniform float uPointSize;
            uniform float uPixelRatio;

            void main() {
                // GPU 端位置插值（核心）
                vec3 pos = mix(position, randomPosition, uDispersion);

                // 微小浮动
                float wave = sin(uTime * 1.8 + position.x * 3.5) * cos(uTime * 1.3 + position.y * 2.7) * 0.025;
                wave += sin(uTime * 2.5 + position.z * 4.1) * 0.015;
                pos += wave * (1.0 - uDispersion * 0.6);

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                float dist = length(mvPosition.xyz);

                // 距离衰减
                float sizeAttenuation = clamp(3.5 / -mvPosition.z, 0.4, 2.0);

                gl_Position = projectionMatrix * mvPosition;
                gl_PointSize = uPointSize * uPixelRatio * size * sizeAttenuation;
                gl_PointSize = clamp(gl_PointSize, 0.5, 40.0);

                vColor = color;
                vAlpha = 1.0 - uDispersion * 0.25;
                vDist = dist;
            }
        `;

        const fragmentShader = /* glsl */ `
            varying vec3 vColor;
            varying float vAlpha;
            varying float vDist;

            void main() {
                float dist = length(gl_PointCoord - vec2(0.5, 0.5));
                float alpha = 1.0 - smoothstep(0.38, 0.5, dist);
                float glow = exp(-dist * 4.5) * 0.35;
                alpha += glow;
                alpha = clamp(alpha, 0.0, 1.0);

                if (alpha < 0.02) discard;

                vec3 finalColor = vColor + glow * 0.3;
                gl_FragColor = vec4(finalColor, alpha * vAlpha);
            }
        `;

        // ==================== 粒子几何体 ====================
        const geometry = new THREE.BufferGeometry();
        let targetPositions, randomPositions, colors, sizes;

        function generateSphereParticles(count) {
            targetPositions = new Float32Array(count * 3);
            randomPositions = new Float32Array(count * 3);
            colors = new Float32Array(count * 3);
            sizes = new Float32Array(count);

            const radius = 1.6;
            const scatterRadius = 3.5;
            const goldenRatio = (1 + Math.sqrt(5)) / 2;

            for (let i = 0; i < count; i++) {
                // Fibonacci 球体
                const theta = 2 * Math.PI * i / goldenRatio;
                const phi = Math.acos(1 - 2 * (i + 0.5) / count);
                targetPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * radius;
                targetPositions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * radius;
                targetPositions[i * 3 + 2] = Math.cos(phi) * radius;

                // 随机散开
                const tR = Math.random() * Math.PI * 2;
                const pR = Math.acos(2 * Math.random() - 1);
                const rR = scatterRadius * (0.6 + Math.random() * 0.4);
                randomPositions[i * 3] = Math.sin(pR) * Math.cos(tR) * rR;
                randomPositions[i * 3 + 1] = Math.sin(pR) * Math.sin(tR) * rR;
                randomPositions[i * 3 + 2] = Math.cos(pR) * rR;

                // 蓝紫渐变
                const col = new THREE.Color().setHSL(
                    0.58 + Math.random() * 0.22,
                    0.6 + Math.random() * 0.4,
                    0.45 + Math.random() * 0.35
                );
                colors[i * 3] = col.r;
                colors[i * 3 + 1] = col.g;
                colors[i * 3 + 2] = col.b;

                sizes[i] = 0.6 + Math.random() * 1.6;
            }
        }

        function updateGeometry() {
            // 清空旧属性
            const toRemove = [];
            for (const key in geometry.attributes) toRemove.push(key);
            toRemove.forEach(k => geometry.deleteAttribute(k));

            geometry.setAttribute('position', new THREE.BufferAttribute(targetPositions, 3));
            geometry.setAttribute('randomPosition', new THREE.BufferAttribute(randomPositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setDrawRange(0, targetPositions.length / 3);
        }

        generateSphereParticles(MAX_PARTICLES);
        updateGeometry();

        // ==================== ShaderMaterial ====================
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uDispersion: { value: 0.0 },
                uTime: { value: 0.0 },
                uPointSize: { value: 28.0 },
                uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
            },
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // ==================== 背景星场 ====================
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 600;
        const starsPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            starsPos[i * 3] = (Math.random() - 0.5) * 12;
            starsPos[i * 3 + 1] = (Math.random() - 0.5) * 12;
            starsPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x444466,
            size: 0.015,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            opacity: 0.6,
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // ==================== 图片转粒子 ====================
        function processImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    convertImageToParticles(img);
                    showToast('✅ 图片已加载');
                };
                img.onerror = () => showToast('❌ 图片加载失败');
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function convertImageToParticles(img) {
            const maxDim = 180;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
                const ratio = Math.min(maxDim / w, maxDim / h);
                w = Math.floor(w * ratio);
                h = Math.floor(h * ratio);
            }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            const imageData = ctx.getImageData(0, 0, w, h);
            const pixels = imageData.data;

            // 收集有效像素
            const validPixels = [];
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    if (pixels[idx + 3] > 20) {
                        validPixels.push({
                            x,
                            y,
                            r: pixels[idx],
                            g: pixels[idx + 1],
                            b: pixels[idx + 2],
                            a: pixels[idx + 3],
                        });
                    }
                }
            }

            if (validPixels.length === 0) {
                showToast('⚠️ 未检测到有效像素，请用透明底 PNG');
                return;
            }

            // 采样到目标数量
            let sampled = validPixels;
            if (validPixels.length > MAX_PARTICLES) {
                sampled = [];
                const step = validPixels.length / MAX_PARTICLES;
                for (let i = 0; i < MAX_PARTICLES; i++) {
                    sampled.push(validPixels[Math.floor(i * step)]);
                }
            } else if (validPixels.length < MAX_PARTICLES) {
                sampled = [];
                const reps = Math.ceil(MAX_PARTICLES / validPixels.length);
                for (let r = 0; r < reps; r++) {
                    for (const p of validPixels) {
                        sampled.push(p);
                        if (sampled.length >= MAX_PARTICLES) break;
                    }
                    if (sampled.length >= MAX_PARTICLES) break;
                }
            }

            const count = sampled.length;
            particleCount = count;

            targetPositions = new Float32Array(count * 3);
            randomPositions = new Float32Array(count * 3);
            colors = new Float32Array(count * 3);
            sizes = new Float32Array(count);

            const scale = 2.8 / Math.max(w, h);
            const offsetX = -w * scale / 2;
            const offsetY = h * scale / 2;
            const scatterRadius = 3.5;

            for (let i = 0; i < count; i++) {
                const p = sampled[i];
                targetPositions[i * 3] = p.x * scale + offsetX;
                targetPositions[i * 3 + 1] = -(p.y * scale - offsetY);
                targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 0.15;

                const tR = Math.random() * Math.PI * 2;
                const pR = Math.acos(2 * Math.random() - 1);
                const rR = scatterRadius * (0.6 + Math.random() * 0.4);
                randomPositions[i * 3] = Math.sin(pR) * Math.cos(tR) * rR;
                randomPositions[i * 3 + 1] = Math.sin(pR) * Math.sin(tR) * rR;
                randomPositions[i * 3 + 2] = Math.cos(pR) * rR;

                colors[i * 3] = p.r / 255;
                colors[i * 3 + 1] = p.g / 255;
                colors[i * 3 + 2] = p.b / 255;

                sizes[i] = 0.5 + (p.a / 255) * 2.0;
            }

            updateGeometry();
            targetDispersion = 0.0;
            currentDispersion = 0.0;
            particleCountEl.textContent = `PARTICLES: ${count.toLocaleString()}`;
        }

        function resetToSphere() {
            generateSphereParticles(MAX_PARTICLES);
            updateGeometry();
            particleCount = MAX_PARTICLES;
            targetDispersion = 0.5;
            particleCountEl.textContent = `PARTICLES: ${MAX_PARTICLES.toLocaleString()}`;
            showToast('🔄 已恢复球体');
        }

        // ==================== 手势识别（修复版：手动 RAF 驱动） ====================
        async function initHands() {
            if (handsInstance) return handsInstance;

            const Hands = window.Hands;
            handsInstance = new Hands({
                locateFile: (file) =>
                    `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`,
            });

            handsInstance.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5,
            });

            handsInstance.onResults((results) => {
                if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                    handDetected = false;
                    return;
                }

                handDetected = true;
                const lm = results.multiHandLandmarks;

                if (lm.length === 1) {
                    // 单手：拇指(4) 与食指(8) 距离
                    const dist = Math.hypot(
                        lm[0][4].x - lm[0][8].x,
                        lm[0][4].y - lm[0][8].y,
                        lm[0][4].z - lm[0][8].z
                    );
                    targetDispersion = Math.max(0, Math.min(1, (dist - 0.025) / (0.22 - 0.025)));
                } else {
                    // 双手：掌心距离
                    const c1 = handCenter(lm[0]);
                    const c2 = handCenter(lm[1]);
                    const dist = Math.hypot(c1.x - c2.x, c1.y - c2.y, c1.z - c2.z);
                    targetDispersion = Math.max(0, Math.min(1, (dist - 0.08) / (0.55 - 0.08)));
                }
            });

            // 等待模型就绪
            await handsInstance.initialize();
            console.log('✅ MediaPipe Hands 初始化完成');
            return handsInstance;
        }

        function handCenter(landmarks) {
            let cx = 0,
                cy = 0,
                cz = 0;
            for (const lm of landmarks) { cx += lm.x;
                cy += lm.y;
                cz += lm.z; }
            const n = landmarks.length;
            return { x: cx / n, y: cy / n, z: cz / n };
        }

        async function startCamera() {
            // 如果已经在运行，先停止
            if (cameraEnabled) {
                stopCamera();
                // 短暂等待后再启动
                await sleep(300);
            }

            try {
                // 1. 获取摄像头流
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                    },
                });

                videoElement.srcObject = cameraStream;
                await videoElement.play();

                // 等待视频就绪
                await new Promise((resolve, reject) => {
                    if (videoElement.readyState >= 2) resolve();
                    else {
                        videoElement.onloadeddata = resolve;
                        setTimeout(() => reject(new Error('视频加载超时')), 5000);
                    }
                });

                // 2. 初始化 MediaPipe
                const hands = await initHands();

                // 3. 手动逐帧处理（替代 camera_utils，更可靠）
                const processFrame = async () => {
                    if (!cameraEnabled) return;
                    try {
                        if (videoElement.readyState >= 2) {
                            await hands.send({ image: videoElement });
                        }
                    } catch (e) {
                        console.warn('MediaPipe 帧处理异常:', e);
                    }
                    frameRequestId = requestAnimationFrame(processFrame);
                };
                processFrame();

                // 4. 更新状态
                cameraEnabled = true;
                statusDot.className = 'status-dot on';
                btnCamera.classList.add('active');
                showToast('👌 手势识别已激活');

                console.log('✅ 摄像头 + 手势识别已启动');
            } catch (err) {
                console.error('摄像头启动失败:', err);
                cameraEnabled = false;
                cameraStream = null;
                statusDot.className = 'status-dot off';
                btnCamera.classList.remove('active');

                const msg = err.name === 'NotAllowedError' ?
                    '❌ 摄像头权限被拒绝，请在浏览器设置中允许' :
                    `❌ 摄像头不可用: ${err.message}`;
                showToast(msg, 3500);
            }
        }

        function stopCamera() {
            cameraEnabled = false;

            if (frameRequestId) {
                cancelAnimationFrame(frameRequestId);
                frameRequestId = null;
            }
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            videoElement.srcObject = null;
            handDetected = false;

            statusDot.className = 'status-dot off';
            btnCamera.classList.remove('active');
            showToast('📷 摄像头已关闭');
        }

        async function toggleCamera() {
            if (cameraEnabled) {
                stopCamera();
            } else {
                btnCamera.disabled = true;
                btnCamera.style.opacity = '0.6';
                statusDot.className = 'status-dot auto';
                showToast('⏳ 正在启动摄像头...');
                try {
                    await startCamera();
                } finally {
                    btnCamera.disabled = false;
                    btnCamera.style.opacity = '1';
                }
            }
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        // ==================== 全屏 ====================
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.body.requestFullscreen().catch(() => {
                    // 某些移动端可能需要用元素级别的全屏
                    document.documentElement.requestFullscreen().catch(() => {});
                });
            } else {
                document.exitFullscreen();
            }
        }

        function updateFullscreenUI() {
            const isFS = !!document.fullscreenElement;
            fsExpand.style.display = isFS ? 'none' : 'block';
            fsShrink.style.display = isFS ? 'block' : 'none';
        }
        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let autoBreathTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = performance.now() * 0.001;

            // 自动呼吸模式
            if (!handDetected && !cameraEnabled) {
                autoBreathTime += delta * 0.7;
                targetDispersion = Math.sin(autoBreathTime) * 0.5 + 0.5;
                statusDot.className = 'status-dot auto';
            } else if (!handDetected && cameraEnabled) {
                targetDispersion = Math.max(0, targetDispersion - delta * 0.8);
                statusDot.className = 'status-dot on';
            }

            // Lerp 平滑
            currentDispersion += (targetDispersion - currentDispersion) * 4.5 * delta;

            material.uniforms.uDispersion.value = currentDispersion;
            material.uniforms.uTime.value = elapsed;

            // 缓慢旋转
            const rotSpeed = 0.15 + currentDispersion * 0.3;
            points.rotation.y += rotSpeed * delta;
            points.rotation.x += rotSpeed * 0.35 * delta;
            stars.rotation.y -= rotSpeed * 0.4 * delta;

            // 相机微浮动
            camera.position.y = 0.35 + Math.sin(elapsed * 0.4) * 0.12;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ==================== 事件绑定 ====================
        btnUpload.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) processImage(e.target.files[0]);
            fileInput.value = '';
        });
        btnCamera.addEventListener('click', toggleCamera);
        btnFullscreen.addEventListener('click', toggleFullscreen);
        btnReset.addEventListener('click', resetToSphere);
        renderer.domElement.addEventListener('dblclick', toggleFullscreen);

        // 拖拽上传
        document.addEventListener('dragover', (e) => { e.preventDefault();
            e.stopPropagation(); });
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const file = e.dataTransfer?.files?.[0];
            if (file && file.type.startsWith('image/')) processImage(file);
        });

        // 键盘
        window.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case 'f':
                    toggleFullscreen();
                    break;
                case 'c':
                    toggleCamera();
                    break;
                case 'r':
                    resetToSphere();
                    break;
                case 'u':
                    fileInput.click();
                    break;
            }
        });

        // 响应式
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
        });

        // ==================== 启动 ====================
        particleCountEl.textContent = `PARTICLES: ${MAX_PARTICLES.toLocaleString()}`;
        animate();

        // 隐藏加载遮罩
        setTimeout(() => {
            loadingOverlay.classList.add('hidden');
            setTimeout(() => loadingOverlay.remove(), 500);
        }, 600);

        console.log('🚀 3D 粒子系统就绪');
        console.log('   📷 C / 手势按钮 → 摄像头手势识别');
        console.log('   🖼️ U / 图片按钮 → 上传图片');
        console.log('   🔲 F / 全屏按钮 / 双击 → 全屏');
        console.log('   🔄 R → 重置球体');
    </script>
</body>
</html>
