<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手指捏住拖动图标</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#000;overflow:hidden;
            height:100dvh;width:100vw;
            font-family:'PingFang SC','Microsoft YaHei',sans-serif;
            user-select:none;-webkit-user-select:none;
            -webkit-tap-highlight-color:transparent;
            touch-action:manipulation;
        }

        /* 第1层：摄像头 */
        #cam-video{
            position:fixed;inset:0;width:100%;height:100%;
            object-fit:cover;z-index:1;
        }

        /* 第2层：图标 */
        #icons-layer{
            position:fixed;inset:0;z-index:2;
            pointer-events:none;
        }
        .icon-item{
            position:absolute;
            font-size:44px;
            transition:none;
            will-change:transform;
            line-height:1;
            filter:drop-shadow(0 0 10px rgba(255,255,255,0.6))
                   drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            transform-origin:center center;
        }
        .icon-item.grabbed{
            filter:drop-shadow(0 0 20px rgba(255,255,100,1))
                   drop-shadow(0 0 40px rgba(255,200,0,0.7))
                   drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            z-index:999;
        }
        @media(min-width:640px){
            .icon-item{font-size:56px;}
        }

        /* 第3层：骨骼标注 */
        #sk-canvas{
            position:fixed;inset:0;z-index:10;
            pointer-events:none;
        }

        /* 提示标签 */
        #hint{
            position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
            z-index:20;padding:10px 20px;border-radius:20px;
            background:rgba(0,0,0,0.75);color:#ffd000;
            font-size:14px;pointer-events:none;
            opacity:0;transition:opacity 0.3s;
            letter-spacing:0.03em;
        }
        #hint.show{opacity:1;}

        /* 按钮栏 */
        .btn-bar{
            position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
            z-index:30;display:flex;gap:10px;
        }
        .btn{
            padding:10px 18px;border-radius:22px;
            border:1px solid rgba(255,255,255,0.25);
            background:rgba(0,0,0,0.65);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            color:#fff;font-size:13px;cursor:pointer;
            font-weight:500;letter-spacing:0.02em;
            transition:all 0.2s;
        }
        .btn:active{transform:scale(0.93);}
        .btn.on{
            border-color:#22c55e;
            box-shadow:0 0 14px rgba(34,197,94,0.35);
        }
    </style>
</head>
<body>

    <video id="cam-video" playsinline autoplay muted></video>
    <div id="icons-layer"></div>
    <canvas id="sk-canvas"></canvas>

    <div id="hint">👆 手指靠近图标即可捏住拖动</div>

    <div class="btn-bar">
        <button class="btn on" id="btn-front">📱 前置</button>
        <button class="btn" id="btn-back">📷 后置</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

    <script>
    (function(){
        const videoEl   = document.getElementById('cam-video');
        const iconsLayer= document.getElementById('icons-layer');
        const skCanvas  = document.getElementById('sk-canvas');
        const skCtx     = skCanvas.getContext('2d');
        const hintEl    = document.getElementById('hint');
        const btnFront  = document.getElementById('btn-front');
        const btnBack   = document.getElementById('btn-back');

        // ===== 状态 =====
        let hands=null, rafId=null, stream=null;
        let sendCount=0, sending=false;
        let latestLM=null;
        let facingMode='user';
        // 手指信息
        let fingerPos=null;        // 当前帧食指尖屏幕坐标 {x,y}
        let fingerPrev=null;       // 上一帧食指尖坐标
        let fingerVel={x:0,y:0};  // 手指速度（px/s）
        let handSeen=false;        // 当前帧是否检测到手
        let grabbedIcon=null;      // 当前被捏住的图标引用

        const offC=document.createElement('canvas');
        offC.width=640;offC.height=480;
        const offCtx=offC.getContext('2d',{willReadFrequently:true});

        // ===== 图标系统 =====
        const emojis=['⭐','🟢','🔵','🟣','💎','🔥','🌟','✨','🦋','🌸','🍀','💫','🎯','🔮','🫧'];
        const icons=[];
        const ICON_COUNT=8;
        const GRAB_RADIUS=65;       // 抓取半径（px）
        const RELEASE_RADIUS=100;   // 释放半径（手指移开超过此距离才释放，防止抖动）

        class IconObj{
            constructor(emoji){
                this.el=document.createElement('div');
                this.el.className='icon-item';
                this.el.textContent=emoji;
                iconsLayer.appendChild(this.el);

                this.x=Math.random()*(window.innerWidth-80)+40;
                this.y=Math.random()*(window.innerHeight-120)+60;
                this.homeX=this.x;
                this.homeY=this.y;
                this.vx=0; this.vy=0;
                this.baseSize=32+Math.random()*22;
                this.el.style.fontSize=this.baseSize+'px';
                this.grabbed=false;
                this.updateDOM();
            }

            updateDOM(){
                const s=this.grabbed?this.baseSize*1.3:this.baseSize;
                this.el.style.fontSize=s+'px';
                this.el.style.transform=`translate(${this.x}px,${this.y}px)`;
                this.el.classList.toggle('grabbed',this.grabbed);
            }

            resetHome(){
                this.homeX=Math.random()*(window.innerWidth-80)+40;
                this.homeY=Math.random()*(window.innerHeight-120)+60;
            }
        }

        function spawnIcons(){
            iconsLayer.innerHTML='';
            icons.length=0;
            grabbedIcon=null;
            const shuffled=[...emojis].sort(()=>Math.random()-0.5);
            for(let i=0;i<ICON_COUNT;i++){
                icons.push(new IconObj(shuffled[i%shuffled.length]));
            }
        }

        // ===== 骨骼绘制 =====
        const CONNS=[
            [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
        ];

        function drawBones(lmList){
            skCanvas.width=window.innerWidth;
            skCanvas.height=window.innerHeight;
            skCtx.clearRect(0,0,skCanvas.width,skCanvas.height);
            if(!lmList||lmList.length===0)return;

            const W=skCanvas.width,H=skCanvas.height;
            const mirror=facingMode==='user';

            for(const lm of lmList){
                // 连线
                skCtx.strokeStyle='#0ff';skCtx.lineWidth=4;
                skCtx.lineCap='round';skCtx.lineJoin='round';
                skCtx.shadowColor='rgba(0,255,255,0.6)';skCtx.shadowBlur=6;
                skCtx.beginPath();
                for(const[a,b] of CONNS){
                    const ax=mirror?(1-lm[a].x)*W:lm[a].x*W;
                    const ay=lm[a].y*H;
                    const bx=mirror?(1-lm[b].x)*W:lm[b].x*W;
                    const by=lm[b].y*H;
                    skCtx.moveTo(ax,ay);skCtx.lineTo(bx,by);
                }
                skCtx.stroke();skCtx.shadowBlur=0;

                // 关节点
                for(let i=0;i<lm.length;i++){
                    const p=lm[i];
                    const sx=mirror?(1-p.x)*W:p.x*W;
                    const sy=p.y*H;
                    const r=(i===4||i===8)?8:(i===12||i===16||i===20)?5:3;
                    skCtx.beginPath();skCtx.arc(sx,sy,r+4,0,Math.PI*2);
                    skCtx.fillStyle='rgba(255,255,0,0.25)';skCtx.fill();
                    skCtx.beginPath();skCtx.arc(sx,sy,r,0,Math.PI*2);
                    skCtx.fillStyle=(i===4||i===8)?'#ff0':(i===12||i===16||i===20)?'#f6a':'#fff';
                    skCtx.fill();
                }
            }
        }

        // ===== MediaPipe =====
        async function initHands(){
            if(hands)return hands;
            const H=window.Hands;
            if(!H){console.error('window.Hands 不存在');return null;}
            hands=new H({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
            hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.5,minTrackingConfidence:0.3});
            hands.onResults(r=>{
                const lm=r.multiHandLandmarks;
                if(lm&&lm.length>0){
                    latestLM=lm;
                    handSeen=true;
                    drawBones(lm);
                    const mirror=facingMode==='user';
                    const idx=lm[0][8];
                    const fx=mirror?(1-idx.x)*window.innerWidth:idx.x*window.innerWidth;
                    const fy=idx.y*window.innerHeight;
                    fingerPrev=fingerPos;
                    fingerPos={x:fx,y:fy};
                }else{
                    latestLM=null;
                    handSeen=false;
                    fingerPrev=fingerPos;
                    fingerPos=null;
                    skCtx.clearRect(0,0,skCanvas.width,skCanvas.height);
                }
            });
            await hands.initialize();
            return hands;
        }

        // ===== 摄像头 =====
        async function startCam(){
            if(stream){stopCam();await sleep(300);}
            try{
                stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:640,height:480}});
                videoEl.srcObject=stream;
                videoEl.style.transform=facingMode==='user'?'scaleX(-1)':'none';
                await videoEl.play();
                if(videoEl.readyState<2){
                    await new Promise((res,rej)=>{
                        const t=setTimeout(()=>rej(new Error('视频超时')),8000);
                        videoEl.onloadeddata=()=>{clearTimeout(t);res();};
                    });
                }
                const h=await initHands();
                if(!h){console.error('模型加载失败');return;}
                async function frame(){
                    rafId=requestAnimationFrame(frame);
                    if(sending)return;sending=true;
                    try{if(videoEl.readyState>=2&&videoEl.videoWidth>0){offCtx.drawImage(videoEl,0,0,640,480);await h.send({image:offC});sendCount++;}}catch(e){}
                    sending=false;
                }
                frame();
                btnFront.className='btn'+(facingMode==='user'?' on':'');
                btnBack.className='btn'+(facingMode==='environment'?' on':'');
            }catch(e){console.error(e);}
        }

        function stopCam(){
            if(rafId){cancelAnimationFrame(rafId);rafId=null;}
            if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
            videoEl.srcObject=null;
            latestLM=null;fingerPos=null;fingerPrev=null;handSeen=false;
            // 释放所有被抓住的图标
            if(grabbedIcon){
                grabbedIcon.grabbed=false;
                grabbedIcon.updateDOM();
                grabbedIcon=null;
            }
            skCtx.clearRect(0,0,skCanvas.width,skCanvas.height);
        }

        async function switchCam(mode){
            if(facingMode===mode)return;
            facingMode=mode;
            stopCam();
            await sleep(300);
            await startCam();
        }

        function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
        btnFront.addEventListener('click',()=>switchCam('user'));
        btnBack.addEventListener('click',()=>switchCam('environment'));

        // ===== 图标物理引擎 =====
        function updateIcons(dt){
            const dtC=Math.min(dt,0.05);

            // 计算手指速度
            if(fingerPos&&fingerPrev){
                fingerVel={
                    x:(fingerPos.x-fingerPrev.x)/Math.max(dt,0.001),
                    y:(fingerPos.y-fingerPrev.y)/Math.max(dt,0.001)
                };
            }else{
                fingerVel={x:0,y:0};
            }

            const fp=fingerPos;
            const hasFinger=!!fp&&handSeen;

            // ── 抓取逻辑 ──
            if(hasFinger){
                if(grabbedIcon){
                    // 已有抓取的图标：检查是否该释放
                    const dx=grabbedIcon.x-fp.x;
                    const dy=grabbedIcon.y-fp.y;
                    const dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist>RELEASE_RADIUS){
                        // 释放！图标继承手指速度甩出
                        grabbedIcon.vx=fingerVel.x;
                        grabbedIcon.vy=fingerVel.y;
                        grabbedIcon.grabbed=false;
                        grabbedIcon.updateDOM();
                        grabbedIcon=null;
                    }
                }else{
                    // 没有抓取：找最近的图标尝试抓取
                    let best=null,bestDist=GRAB_RADIUS;
                    for(const icon of icons){
                        if(icon.grabbed)continue;
                        const dx=icon.x-fp.x;
                        const dy=icon.y-fp.y;
                        const dist=Math.sqrt(dx*dx+dy*dy);
                        if(dist<bestDist){
                            bestDist=dist;
                            best=icon;
                        }
                    }
                    if(best){
                        // 抓住！
                        best.grabbed=true;
                        best.vx=0;best.vy=0;
                        best.updateDOM();
                        grabbedIcon=best;
                        // 短暂提示
                        hintEl.classList.add('show');
                        clearTimeout(hintEl._t);
                        hintEl._t=setTimeout(()=>hintEl.classList.remove('show'),1500);
                    }
                }
            }else{
                // 手指丢失：释放
                if(grabbedIcon){
                    grabbedIcon.vx=fingerVel.x;
                    grabbedIcon.vy=fingerVel.y;
                    grabbedIcon.grabbed=false;
                    grabbedIcon.updateDOM();
                    grabbedIcon=null;
                }
            }

            // ── 被抓住的图标：跟随手指 ──
            if(grabbedIcon&&hasFinger){
                grabbedIcon.x=fp.x;
                grabbedIcon.y=fp.y;
                grabbedIcon.vx=fingerVel.x;
                grabbedIcon.vy=fingerVel.y;
                grabbedIcon.updateDOM();
            }

            // ── 自由图标物理 ──
            for(const icon of icons){
                if(icon.grabbed)continue;

                // 弹簧回归原位
                const springK=2.5;
                icon.vx+=(icon.homeX-icon.x)*springK*dtC;
                icon.vy+=(icon.homeY-icon.y)*springK*dtC;

                // 多级阻尼：速度快时阻尼小（惯性），速度慢时阻尼大（快速停下）
                const speed=Math.sqrt(icon.vx*icon.vx+icon.vy*icon.vy);
                let damp;
                if(speed>800) damp=0.96;       // 高速：几乎不减
                else if(speed>200) damp=0.92;  // 中速：缓慢减速
                else if(speed>30) damp=0.85;   // 低速：快速停下
                else damp=0.75;                 // 极低速：快速归位

                icon.vx*=damp;
                icon.vy*=damp;

                // 更新位置
                icon.x+=icon.vx*dtC;
                icon.y+=icon.vy*dtC;

                // 边界弹性碰撞
                const m=20;
                const bounce=0.5;
                if(icon.x<m){icon.x=m;icon.vx=Math.abs(icon.vx)*bounce;}
                if(icon.x>window.innerWidth-m){icon.x=window.innerWidth-m;icon.vx=-Math.abs(icon.vx)*bounce;}
                if(icon.y<m){icon.y=m;icon.vy=Math.abs(icon.vy)*bounce;}
                if(icon.y>window.innerHeight-m){icon.y=window.innerHeight-m;icon.vy=-Math.abs(icon.vy)*bounce;}

                icon.updateDOM();
            }
        }

        // ===== 动画循环 =====
        let lastTime=performance.now();
        function animate(now){
            requestAnimationFrame(animate);
            const dt=(now-lastTime)/1000;
            lastTime=now;
            updateIcons(dt);
        }

        // ===== 启动 =====
        spawnIcons();
        startCam();
        requestAnimationFrame(animate);

        // 3秒后显示提示
        setTimeout(()=>{
            hintEl.classList.add('show');
            setTimeout(()=>hintEl.classList.remove('show'),2000);
        },2000);

        window.addEventListener('resize',()=>{
            for(const icon of icons) icon.resetHome();
        });
    })();
    </script>
</body>
</html>
