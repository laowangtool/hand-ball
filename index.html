<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>弹珠游戏</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#1a0c04;overflow:hidden;height:100dvh;width:100vw;font-family:'PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
        #cam-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0.18;}
        #game-canvas{position:fixed;inset:0;z-index:2;pointer-events:none;}
        #sk-canvas{position:fixed;inset:0;z-index:50;pointer-events:none;}
        #score{position:fixed;top:12px;right:16px;z-index:40;color:#ffd700;font-size:20px;font-weight:700;background:rgba(0,0,0,0.55);padding:8px 16px;border-radius:10px;pointer-events:none;}
        #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;padding:14px 28px;border-radius:22px;background:rgba(0,0,0,0.8);color:#ffd000;font-size:15px;pointer-events:none;opacity:0;transition:opacity 0.3s;text-align:center;}
        #msg.show{opacity:1;}
        #diag{position:fixed;top:8px;left:8px;z-index:40;background:rgba(0,0,0,0.75);color:#0f0;font-size:9px;padding:5px 8px;border-radius:5px;border:1px solid #333;line-height:1.5;pointer-events:none;font-family:monospace;white-space:pre-wrap;}
        .btn-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:10px;}
        .btn{padding:10px 18px;border-radius:22px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:13px;cursor:pointer;font-weight:500;transition:all 0.2s;}
        .btn:active{transform:scale(0.93);}.btn.on{border-color:#22c55e;box-shadow:0 0 14px rgba(34,197,94,0.35);}
    </style>
</head>
<body>
    <video id="cam-video" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>
    <canvas id="sk-canvas"></canvas>
    <div id="score">⭐ 0</div><div id="msg"></div><div id="diag">启动中...</div>
    <div class="btn-bar"><button class="btn on" id="btn-front">📱 前置</button><button class="btn" id="btn-back">📷 后置</button></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script>
    (function(){
        const videoEl=document.getElementById('cam-video');
        const gameCvs=document.getElementById('game-canvas');
        const gameCtx=gameCvs.getContext('2d');
        const skCanvas=document.getElementById('sk-canvas');
        const skCtx=skCanvas.getContext('2d');
        const scoreEl=document.getElementById('score');
        const msgEl=document.getElementById('msg');
        const diagEl=document.getElementById('diag');
        const btnFront=document.getElementById('btn-front');
        const btnBack=document.getElementById('btn-back');

        // ============ 平滑器 ============
        const SA=0.7;
        function mkSm(a){let v=null;return{up(r){v=v===null?r:v*a+r*(1-a);return v;},rst(){v=null;}};}
        const sX=Array.from({length:21},()=>mkSm(SA));
        const sY=Array.from({length:21},()=>mkSm(SA));
        function rstSm(){for(let i=0;i<21;i++){sX[i].rst();sY[i].rst();}}

        // ============ 全局状态 ============
        const G={
            facing:'user',mirror:true,
            pinchDist:1,fistDist:1,indexMidDist:1,
            isPinching:false,wasPinching:false,
            isFist:false,wasFist:false,isAiming:false,isRingOut:false,
            thumbPos:null,indexPos:null,middlePos:null,
            pinchMid:null,palmPos:null,
            aimDir:null,lockedAimDir:null,
            phase:'idle',aimLocked:false,
            ejectDir:{x:0,y:0},ejectSpeed:0,
        };
        function diag(m){diagEl.textContent=m;}
        function showMsg(t,d=1800){msgEl.textContent=t;msgEl.classList.add('show');clearTimeout(msgEl._t);msgEl._t=setTimeout(()=>msgEl.classList.remove('show'),d);}
        function W(){return window.innerWidth;}function H(){return window.innerHeight;}
        function resizeGame(){const w=W(),h=H();if(gameCvs.width!==w||gameCvs.height!==h){gameCvs.width=w;gameCvs.height=h;}}
        function resizeSk(){const w=W(),h=H();if(skCanvas.width!==w||skCanvas.height!==h){skCanvas.width=w;skCanvas.height=h;}}

        // ============ 常量 ============
        const HOLE_R=17,MARBLE_R=12,BAG_R=46;
        const MC=['#e04040','#4090e0','#e0a030','#a040d0','#40c070'];
        const GC=['#ff6666','#66aaff','#ffbb44','#bb66ff','#66dd88'];
        const PINCH_TH=0.07,AIM_THRESH=0.065,FIST_CLOSE=0.10,RING_OUT_TH=0.15;
        const BAG={r:BAG_R};
        function BAG_X(){return W()*0.13;}function BAG_Y(){return H()*0.58;}
        function getHoles(){const w=W(),h=H();return[{x:w*0.30,y:h*0.22},{x:w*0.75,y:h*0.25},{x:w*0.55,y:h*0.68}];}

        // ============ 弹珠类 ============
        class Marble{
            constructor(i){
                this.id=i;this.x=0;this.y=0;this.vx=0;this.vy=0;
                this.state='in_bag';this.bc=MC[i%5];this.gc=GC[i%5];this.trail=null;
            }
        }
        let marbles=[],grabbedMarble=null,aimingMarble=null,score=0;

        function initMarbles(){
            marbles=[];grabbedMarble=null;aimingMarble=null;score=0;scoreEl.textContent='⭐ 0';
            const bx=BAG_X(),by=BAG_Y();
            for(let i=0;i<6;i++){const m=new Marble(i);m.x=bx+(Math.random()-0.5)*30;m.y=by+(Math.random()-0.5)*18;marbles.push(m);}
        }

        // ============ 缓存系统 ============
        let woodCache=null,holeCache=null,cacheKey='';
        function seedRandom(s){let x=s;return function(){x=(x*16807+0)%2147483647;return x/2147483647;};}

        function buildAllCaches(){
            const w=W(),h=H(),key=w+','+h;
            if(woodCache&&cacheKey===key)return;
            cacheKey=key;

            // ---- 木纹 ----
            const off=document.createElement('canvas');off.width=w;off.height=h;
            const ctx=off.getContext('2d');const rng=seedRandom(42);
            ctx.fillStyle='#c4a07c';ctx.fillRect(0,0,w,h);
            const phs=[];let py=0;
            while(py<h){const ph=28+rng()*40;phs.push({y:py,h:ph});py+=ph;}
            for(const p of phs){
                const hs=(rng()-0.5)*0.08,ss=(rng()-0.5)*0.15,li=0.72+rng()*0.18;
                const rr=Math.floor(210*(li+hs)),gg=Math.floor(148*(li+ss*0.5)),bb=Math.floor(100*li);
                ctx.fillStyle=`rgb(${rr},${gg},${bb})`;ctx.fillRect(0,p.y,w,p.h);
                const vG=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
                vG.addColorStop(0,'rgba(255,255,255,0.04)');vG.addColorStop(0.5,'rgba(0,0,0,0.03)');vG.addColorStop(1,'rgba(255,255,255,0.02)');
                ctx.fillStyle=vG;ctx.fillRect(0,p.y,w,p.h);
                if(p.y>0){ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(0,p.y-1,w,3);}
            }
            for(let i=0;i<800;i++){
                const y=rng()*h;
                ctx.strokeStyle=`rgba(80,38,15,${0.03+rng()*0.06})`;ctx.lineWidth=0.8+rng()*1.2;
                ctx.beginPath();ctx.moveTo(0,y);
                const pts=4+Math.floor(rng()*10);let px=0;
                for(let j=0;j<pts;j++){const nx=px+w/pts,ny=y+(rng()-0.5)*10;ctx.lineTo(nx,ny);px=nx;}
                ctx.stroke();
            }
            for(let i=0;i<300;i++){
                const x=rng()*w;
                ctx.strokeStyle=`rgba(60,30,10,${0.02+rng()*0.04})`;ctx.lineWidth=0.5+rng()*0.8;
                ctx.beginPath();ctx.moveTo(x,0);
                const segs=3+Math.floor(rng()*5);let cy=0;
                for(let j=0;j<segs;j++){const ny=cy+h/segs;ctx.lineTo(x+(rng()-0.5)*3,ny);cy=ny;}
                ctx.stroke();
            }
            for(let i=0;i<15;i++){
                const kx=rng()*w,ky=rng()*h,kr=10+rng()*25;
                ctx.fillStyle='rgba(50,18,5,0.4)';ctx.beginPath();ctx.ellipse(kx,ky,kr*0.35,kr*0.30,rng()*Math.PI,0,Math.PI*2);ctx.fill();
                for(let j=1;j<=4;j++){ctx.strokeStyle=`rgba(70,28,10,${0.05+0.04*j})`;ctx.lineWidth=0.8+j*0.3;ctx.beginPath();ctx.ellipse(kx,ky,kr*j*0.55,kr*j*0.50,rng()*0.4,0,Math.PI*2);ctx.stroke();}
            }
            for(let i=0;i<200;i++){ctx.fillStyle=`rgba(0,0,0,${0.008+rng()*0.02})`;ctx.fillRect(rng()*w,rng()*h,1+rng()*1.5,0.5+rng()*0.8);}
            woodCache=off;

            // ---- 洞口 ----
            const holes=getHoles();
            holeCache=holes.map((hh,idx)=>{
                const r2=seedRandom(200+idx*41);
                const oP=[],oR=HOLE_R+12;
                for(let i=0;i<24;i++){const a=(i/24)*Math.PI*2,j=oR*(0.80+r2()*0.20);oP.push({x:hh.x+Math.cos(a)*j,y:hh.y+Math.sin(a)*j});}
                const iP=[],iR=HOLE_R+3;
                for(let i=0;i<16;i++){const a=(i/16)*Math.PI*2,j=iR*(0.68+r2()*0.32);iP.push({x:hh.x+Math.cos(a)*j,y:hh.y+Math.sin(a)*j});}
                const cr=[];
                for(let j=0;j<5;j++){const an=r2()*Math.PI*2,sR=HOLE_R*0.7,eR=HOLE_R+16+r2()*18;cr.push({angle:an,sR,eR,cx:hh.x+Math.cos(an+0.15)*eR*0.7,cy:hh.y+Math.sin(an+0.15)*eR*0.7,endAngle:an+0.08});}
                const sp=[];
                for(let j=0;j<8;j++){const a=r2()*Math.PI*2,d=HOLE_R*0.5+r2()*HOLE_R*0.7;sp.push({a,d,a2:a+0.1,d2:d*1.25});}
                return {x:hh.x,y:hh.y,outerPts:oP,innerPts:iP,cracks:cr,splinters:sp};
            });
        }

        // ============ 绘制函数 ============
        function drawRottenHole(hd){
            const hx=hd.x,hy=hd.y;
            gameCtx.fillStyle='rgba(32,12,4,0.55)';gameCtx.beginPath();
            for(let i=0;i<hd.outerPts.length;i++){const p=hd.outerPts[i];if(i===0)gameCtx.moveTo(p.x,p.y);else gameCtx.lineTo(p.x,p.y);}
            gameCtx.closePath();gameCtx.fill();
            gameCtx.fillStyle='rgba(22,7,2,0.75)';gameCtx.beginPath();
            for(let i=0;i<hd.innerPts.length;i++){const p=hd.innerPts[i];if(i===0)gameCtx.moveTo(p.x,p.y);else gameCtx.lineTo(p.x,p.y);}
            gameCtx.closePath();gameCtx.fill();
            const hg=gameCtx.createRadialGradient(hx-1,hy-1,HOLE_R*0.10,hx,hy,HOLE_R*0.75);
            hg.addColorStop(0,'#020100');hg.addColorStop(0.6,'#060201');hg.addColorStop(1,'#140803');
            gameCtx.fillStyle=hg;gameCtx.beginPath();gameCtx.arc(hx,hy,HOLE_R*0.75,0,Math.PI*2);gameCtx.fill();
            gameCtx.strokeStyle='rgba(18,5,1,0.65)';gameCtx.lineWidth=1.5;
            for(const c of hd.cracks){gameCtx.beginPath();gameCtx.moveTo(hx+Math.cos(c.angle)*c.sR,hy+Math.sin(c.angle)*c.sR);gameCtx.quadraticCurveTo(c.cx,c.cy,hx+Math.cos(c.endAngle)*c.eR,hy+Math.sin(c.endAngle)*c.eR);gameCtx.stroke();}
            gameCtx.strokeStyle='rgba(90,45,25,0.45)';gameCtx.lineWidth=1;
            for(const s of hd.splinters){gameCtx.beginPath();gameCtx.moveTo(hx+Math.cos(s.a)*s.d,hy+Math.sin(s.a)*s.d);gameCtx.lineTo(hx+Math.cos(s.a2)*s.d2,hy+Math.sin(s.a2)*s.d2);gameCtx.stroke();}
        }

        function drawMarble(x,y,bc,gc,r,glow){
            if(glow){gameCtx.fillStyle='rgba(255,255,200,0.22)';gameCtx.beginPath();gameCtx.arc(x,y,r+6,0,Math.PI*2);gameCtx.fill();}
            gameCtx.fillStyle='rgba(0,0,0,0.16)';gameCtx.beginPath();gameCtx.arc(x+1,y+1.5,r,0,Math.PI*2);gameCtx.fill();
            const g=gameCtx.createRadialGradient(x-r*0.5,y-r*0.4,r*0.03,x,y,r);
            g.addColorStop(0,bc);g.addColorStop(0.42,gc);g.addColorStop(1,'rgba(0,0,0,0.55)');
            gameCtx.beginPath();gameCtx.arc(x,y,r,0,Math.PI*2);gameCtx.fillStyle=g;gameCtx.fill();
            gameCtx.fillStyle='rgba(255,255,255,0.5)';gameCtx.beginPath();gameCtx.arc(x-r*0.3,y-r*0.35,r*0.24,0,Math.PI*2);gameCtx.fill();
            gameCtx.fillStyle='rgba(255,255,255,0.7)';gameCtx.beginPath();gameCtx.arc(x-r*0.18,y-r*0.28,r*0.09,0,Math.PI*2);gameCtx.fill();
            gameCtx.fillStyle='rgba(255,255,255,0.10)';gameCtx.beginPath();gameCtx.arc(x+r*0.26,y+r*0.30,r*0.13,0,Math.PI*2);gameCtx.fill();
            gameCtx.strokeStyle='rgba(255,255,255,0.18)';gameCtx.lineWidth=0.8;gameCtx.stroke();
        }

        function drawBag(bx,by){
            const r=BAG.r,rx=r,ry=r*0.92;
            // 阴影
            gameCtx.fillStyle='rgba(0,0,0,0.35)';gameCtx.beginPath();gameCtx.ellipse(bx+3,by+6,rx+2,ry+2,0,0,Math.PI*2);gameCtx.fill();
            // 主体
            const bg=gameCtx.createRadialGradient(bx-4,by-6,rx*0.1,bx,by,rx);
            bg.addColorStop(0,'#3d3d3d');bg.addColorStop(0.35,'#2c2c2c');bg.addColorStop(0.7,'#181818');bg.addColorStop(1,'#0a0a0a');
            gameCtx.fillStyle=bg;gameCtx.beginPath();gameCtx.ellipse(bx,by,rx,ry,0,0,Math.PI*2);gameCtx.fill();
            // 褶皱
            gameCtx.lineCap='round';
            for(let i=0;i<9;i++){
                const ba=-Math.PI*0.45+(i/8)*Math.PI*0.9;
                const aj=(i%3===0?0.08:-0.05)*(i%2===0?1:-1);
                const fa=ba+aj;
                const sx=bx+Math.cos(fa)*rx*0.38,sy=by+Math.sin(fa)*ry*0.35;
                const ex=bx+Math.cos(fa)*rx*0.88,ey=by+Math.sin(fa)*ry*0.82;
                gameCtx.strokeStyle='rgba(0,0,0,0.35)';gameCtx.lineWidth=2.2;
                gameCtx.beginPath();gameCtx.moveTo(sx,sy);
                gameCtx.quadraticCurveTo(bx+Math.cos(fa+0.06)*rx*0.62,by+Math.sin(fa+0.06)*ry*0.58,ex,ey);gameCtx.stroke();
                gameCtx.strokeStyle='rgba(255,255,255,0.10)';gameCtx.lineWidth=1.6;
                gameCtx.beginPath();gameCtx.moveTo(sx+1,sy+1);
                gameCtx.quadraticCurveTo(bx+Math.cos(fa+0.03)*rx*0.62+1,by+Math.sin(fa+0.03)*ry*0.58+1,ex+1,ey+1);gameCtx.stroke();
                gameCtx.fillStyle='rgba(0,0,0,0.2)';gameCtx.beginPath();
                const tx=bx+Math.cos(fa)*rx*0.55,ty=by+Math.sin(fa)*ry*0.50;
                gameCtx.moveTo(tx,ty);gameCtx.lineTo(tx+Math.cos(fa-0.12)*rx*0.06,ty+Math.sin(fa-0.12)*ry*0.06);
                gameCtx.lineTo(tx+Math.cos(fa+0.12)*rx*0.06,ty+Math.sin(fa+0.12)*ry*0.06);gameCtx.closePath();gameCtx.fill();
            }
            // 布纹
            gameCtx.globalAlpha=0.5;
            for(let i=0;i<80;i++){
                const an=Math.random()*Math.PI*2,di=Math.random()*rx*0.8;
                const tx=bx+Math.cos(an)*di,ty=by+Math.sin(an)*di*0.92;
                gameCtx.strokeStyle=`rgba(255,255,255,${0.01+Math.random()*0.03})`;gameCtx.lineWidth=0.6+Math.random()*0.6;
                gameCtx.beginPath();gameCtx.moveTo(tx,ty);gameCtx.lineTo(tx+(Math.random()-0.5)*7,ty+(Math.random()-0.5)*3);
                gameCtx.stroke();
            }
            gameCtx.globalAlpha=1;
            // 袋口束边
            gameCtx.strokeStyle='#0a0a0a';gameCtx.lineWidth=5;
            gameCtx.beginPath();gameCtx.ellipse(bx,by-rx*0.05,rx-3,ry-3,0,0,Math.PI*2);gameCtx.stroke();
            gameCtx.strokeStyle='#2a2a2a';gameCtx.lineWidth=2;
            gameCtx.beginPath();gameCtx.ellipse(bx,by-rx*0.05,rx-3,ry-3,0,0,Math.PI*2);gameCtx.stroke();
            // 束口绳
            const ropeY=by-ry+9;
            gameCtx.strokeStyle='#444';gameCtx.lineWidth=2.5;
            gameCtx.beginPath();gameCtx.arc(bx,ropeY,rx-9,Math.PI*1.08,Math.PI*1.92);gameCtx.stroke();
            gameCtx.strokeStyle='#666';gameCtx.lineWidth=1;
            gameCtx.beginPath();gameCtx.arc(bx,ropeY,rx-9,Math.PI*1.08,Math.PI*1.92);gameCtx.stroke();
            // 袋内
            const iR=rx*0.58;
            const iG=gameCtx.createRadialGradient(bx,by+2,iR*0.15,bx,by+2,iR);
            iG.addColorStop(0,'#080808');iG.addColorStop(0.6,'#0f0f0f');iG.addColorStop(1,'#181818');
            gameCtx.fillStyle=iG;gameCtx.beginPath();gameCtx.ellipse(bx,by+3,iR,iR*0.88,0,0,Math.PI*2);gameCtx.fill();
            // 袋内弹珠
            const bM=marbles.filter(m=>m.state==='in_bag');
            for(let i=0;i<Math.min(bM.length,6);i++){
                const an=(i/Math.max(bM.length,1))*Math.PI*2+0.4,di=iR*0.35;
                const mx=bx+Math.cos(an)*di,my=by+3+Math.sin(an)*di*0.8;
                drawMarble(mx,my,bM[i].bc,bM[i].gc,MARBLE_R-1,false);
            }
            // 标签
            gameCtx.fillStyle='#e8d0a0';gameCtx.font='bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
            gameCtx.textAlign='center';gameCtx.fillText('🎒 弹珠袋',bx,by-ry-6);
            gameCtx.fillStyle='#eee';gameCtx.font='bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
            gameCtx.fillText('×'+bM.length,bx,by+ry+14);
        }

        function drawTrail(mx,my,nx,ny,alpha,color){
            gameCtx.strokeStyle=color||`rgba(255,255,200,${alpha})`;gameCtx.lineWidth=2;gameCtx.setLineDash([6,5]);
            gameCtx.beginPath();gameCtx.moveTo(mx,my);gameCtx.lineTo(mx+nx*200,my+ny*200);gameCtx.stroke();gameCtx.setLineDash([]);
            gameCtx.fillStyle=color||`rgba(255,255,200,${alpha})`;gameCtx.beginPath();gameCtx.arc(mx+nx*200,my+ny*200,4,0,Math.PI*2);gameCtx.fill();
        }

        function drawGame(){
            resizeGame();const w=W(),h=H();buildAllCaches();
            // 木纹
            if(woodCache){gameCtx.drawImage(woodCache,0,0,w,h);}else{gameCtx.fillStyle='#c4a07c';gameCtx.fillRect(0,0,w,h);}
            // 边框
            gameCtx.fillStyle='#2a1508';gameCtx.fillRect(0,0,w,8);gameCtx.fillRect(0,0,8,h);gameCtx.fillRect(0,h-8,w,8);gameCtx.fillRect(w-8,0,8,h);
            gameCtx.fillStyle='rgba(0,0,0,0.2)';gameCtx.fillRect(8,0,w-16,3);gameCtx.fillRect(0,8,3,h-16);
            // 弹珠袋
            const bx=BAG_X(),by=BAG_Y();drawBag(bx,by);
            // 洞口
            if(holeCache)for(const hd of holeCache){drawRottenHole(hd);}
            // 持久轨迹
            for(const m of marbles){if(!m.trail)continue;drawTrail(m.trail.mx,m.trail.my,m.trail.nx,m.trail.ny,0.35);}
            // 瞄准轨迹
            const displayDir=G.phase==='aiming'?G.lockedAimDir:null;
            if(displayDir&&aimingMarble){
                const mx=aimingMarble.x,my=aimingMarble.y;
                const dx=displayDir.x,dy=displayDir.y,len=Math.sqrt(dx*dx+dy*dy);
                if(len>0.001){
                    const ux=dx/len,uy=dy/len;
                    const trailColor=G.aimLocked?'rgba(0,255,200,0.9)':'rgba(255,255,100,0.9)';
                    drawTrail(mx,my,ux,uy,0.9,trailColor);
                    if(G.aimLocked){gameCtx.fillStyle='#0ff';gameCtx.font='bold 14px sans-serif';gameCtx.textAlign='center';gameCtx.fillText('🔒',mx+ux*40,my+uy*40-10);}
                }
            }
            // 弹珠
            for(const m of marbles){if(m.state==='grabbed'||m.state==='in_bag')continue;drawMarble(m.x,m.y,m.bc,m.gc,MARBLE_R,m===aimingMarble&&G.phase==='aiming');}
            // 被抓弹珠
            if(grabbedMarble&&G.isPinching&&G.pinchMid){drawMarble(G.pinchMid.x,G.pinchMid.y,grabbedMarble.bc,grabbedMarble.gc,MARBLE_R+2,true);}
        }

        // ============ ★ 骨骼绘制 — 完整五指 ============
        const CONNS=[
            [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
        ];
        function fingerOf(i){if(i<=4)return'thumb';if(i<=8)return'index';if(i<=12)return'middle';if(i<=16)return'ring';return'pinky';}
        const FC={thumb:'#ffd000',index:'#00e5ff',middle:'#ff44aa',ring:'#ff8800',pinky:'#ee55cc',palm:'#aaa'};

        function drawBones(smLM){
            resizeSk();const w=skCanvas.width,h=skCanvas.height;skCtx.clearRect(0,0,w,h);
            if(!smLM||smLM.length===0)return;const lm=smLM;if(!lm||lm.length<21)return;
            const mirror=G.mirror;

            // 手掌底衬
            const hull=[0,5,6,7,8,12,16,20,19,18,17,13,9,4,3,2,1,0];
            skCtx.fillStyle='rgba(0,0,0,0.22)';skCtx.beginPath();
            for(let i=0;i<hull.length;i++){const p=lm[hull[i]],sx=mirror?(1-p.x)*w:p.x*w,sy=p.y*h;if(i===0)skCtx.moveTo(sx,sy);else skCtx.lineTo(sx,sy);}
            skCtx.closePath();skCtx.fill();

            // 连线分组
            const groups={};
            for(const[a,b] of CONNS){const f=fingerOf(a)===fingerOf(b)?fingerOf(a):'palm';if(!groups[f])groups[f]=[];groups[f].push([a,b]);}
            skCtx.lineCap='round';skCtx.lineJoin='round';
            for(const[finger,pairs] of Object.entries(groups)){
                const col=FC[finger]||'#fff';
                const isKey=finger==='thumb'||finger==='index'||finger==='middle'||(finger==='ring'&&G.isRingOut);
                skCtx.strokeStyle=col;skCtx.globalAlpha=0.25;skCtx.lineWidth=isKey?12:7;skCtx.beginPath();
                for(const[a,b] of pairs){skCtx.moveTo(mirror?(1-lm[a].x)*w:lm[a].x*w,lm[a].y*h);skCtx.lineTo(mirror?(1-lm[b].x)*w:lm[b].x*w,lm[b].y*h);}skCtx.stroke();
                skCtx.globalAlpha=1;skCtx.strokeStyle=col;skCtx.lineWidth=isKey?4.5:3;skCtx.beginPath();
                for(const[a,b] of pairs){skCtx.moveTo(mirror?(1-lm[a].x)*w:lm[a].x*w,lm[a].y*h);skCtx.lineTo(mirror?(1-lm[b].x)*w:lm[b].x*w,lm[b].y*h);}skCtx.stroke();
            }

            // 关节点 0~20 完整五指
            for(let i=0;i<=20;i++){
                const p=lm[i],sx=mirror?(1-p.x)*w:p.x*w,sy=p.y*h,f=fingerOf(i),col=FC[f]||'#fff';
                const isTip=(i===4||i===8||i===12||i===16||i===20),r=isTip?11:5;
                skCtx.globalAlpha=0.2;skCtx.beginPath();skCtx.arc(sx,sy,r+8,0,Math.PI*2);skCtx.fillStyle=col;skCtx.fill();
                skCtx.globalAlpha=0.35;skCtx.beginPath();skCtx.arc(sx,sy,r+3,0,Math.PI*2);skCtx.fillStyle=col;skCtx.fill();
                skCtx.globalAlpha=1;skCtx.beginPath();skCtx.arc(sx,sy,r,0,Math.PI*2);skCtx.fillStyle=col;skCtx.fill();
                skCtx.beginPath();skCtx.arc(sx,sy,r,0,Math.PI*2);skCtx.strokeStyle='rgba(255,255,255,0.55)';skCtx.lineWidth=1.5;skCtx.stroke();
            }

            // 拇指-食指虚线（捏合指示）
            if(lm.length>8){
                const t=lm[4],idx=lm[8],tx=mirror?(1-t.x)*w:t.x*w,ty=t.y*h,ix=mirror?(1-idx.x)*w:idx.x*w,iy=idx.y*h,isP=G.isPinching;
                skCtx.strokeStyle=isP?'rgba(255,208,0,0.95)':'rgba(255,255,255,0.3)';skCtx.lineWidth=isP?5:2;skCtx.setLineDash([6,5]);
                skCtx.beginPath();skCtx.moveTo(tx,ty);skCtx.lineTo(ix,iy);skCtx.stroke();skCtx.setLineDash([]);
                if(isP){const mx=(tx+ix)/2,my=(ty+iy)/2;skCtx.globalAlpha=0.6;skCtx.beginPath();skCtx.arc(mx,my,14,0,Math.PI*2);skCtx.fillStyle='#ffd000';skCtx.fill();skCtx.globalAlpha=1;}
            }

            // 食指+中指并拢瞄准 + 无名指锁定
            if(lm.length>16&&G.isAiming){
                const iTip=lm[8],mTip=lm[12],rTip=lm[16];
                const ix=mirror?(1-iTip.x)*w:iTip.x*w,iy=iTip.y*h;
                const mx=mirror?(1-mTip.x)*w:mTip.x*w,my=mTip.y*h;
                const rx=mirror?(1-rTip.x)*w:rTip.x*w,ry=rTip.y*h;
                skCtx.strokeStyle='rgba(0,255,150,0.85)';skCtx.lineWidth=3;skCtx.setLineDash([5,4]);
                skCtx.beginPath();skCtx.moveTo(ix,iy);skCtx.lineTo(mx,my);skCtx.stroke();skCtx.setLineDash([]);
                const cmx=(ix+mx)/2,cmy=(iy+my)/2;
                if(G.aimLocked){
                    skCtx.strokeStyle='rgba(0,200,255,0.7)';skCtx.lineWidth=2.5;skCtx.setLineDash([3,3]);
                    skCtx.beginPath();skCtx.moveTo(rx,ry);skCtx.lineTo(cmx,cmy);skCtx.stroke();skCtx.setLineDash([]);
                    skCtx.globalAlpha=0.7;skCtx.beginPath();skCtx.arc(cmx,cmy,14,0,Math.PI*2);skCtx.fillStyle='rgba(0,200,255,0.5)';skCtx.fill();skCtx.globalAlpha=1;
                    skCtx.fillStyle='#0ff';skCtx.font='bold 13px sans-serif';skCtx.textAlign='center';skCtx.fillText('🔒',cmx,cmy-18);
                }else{
                    skCtx.globalAlpha=0.6;skCtx.beginPath();skCtx.arc(cmx,cmy,10,0,Math.PI*2);skCtx.fillStyle='#0f8';skCtx.fill();skCtx.globalAlpha=1;
                    if(G.lockedAimDir){const dx=G.lockedAimDir.x,dy=G.lockedAimDir.y,len=Math.sqrt(dx*dx+dy*dy);if(len>0.001){const nx=dx/len,ny=dy/len;skCtx.fillStyle='#0f8';skCtx.globalAlpha=0.8;skCtx.beginPath();skCtx.arc(cmx+nx*35,cmy+ny*35,8,0,Math.PI*2);skCtx.fill();skCtx.globalAlpha=1;}}
                }
            }

            // 握拳指示
            if(G.isFist&&lm.length>12){
                const palm=lm[9],px=mirror?(1-palm.x)*w:palm.x*w,py=palm.y*h;
                skCtx.strokeStyle='rgba(255,100,100,0.6)';skCtx.lineWidth=3;skCtx.setLineDash([3,4]);
                for(const ti of[8,12,16,20]){const tp=lm[ti];skCtx.beginPath();skCtx.moveTo(px,py);skCtx.lineTo(mirror?(1-tp.x)*w:tp.x*w,tp.y*h);skCtx.stroke();}
                skCtx.setLineDash([]);skCtx.globalAlpha=0.45;skCtx.beginPath();skCtx.arc(px,py,16,0,Math.PI*2);skCtx.fillStyle='#f44';skCtx.fill();skCtx.globalAlpha=1;
            }
        }

        // ============ MediaPipe ============
        let hands=null,stream=null,rafId=null,sendCount=0,cbCount=0;
        const offC=document.createElement('canvas');offC.width=640;offC.height=480;
        const offCtx=offC.getContext('2d',{willReadFrequently:true});

        async function initHands(){
            if(hands)return hands;
            if(!window.Hands){diag('❌ Hands 未加载');return null;}
            hands=new window.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
            hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.5,minTrackingConfidence:0.3});
            hands.onResults(r=>{
                cbCount++;
                const raw=r.multiHandLandmarks;
                if(raw&&raw.length>0){
                    const smLM=[];
                    for(let i=0;i<21;i++){const rp=raw[0][i];smLM.push({x:sX[i].up(rp.x),y:sY[i].up(rp.y),z:rp.z});}
                    const w=W(),h=H(),mirror=G.mirror;
                    const thumb=smLM[4],index=smLM[8],middle=smLM[12],iBase=smLM[5],mBase=smLM[9],palm=smLM[9],ringTip=smLM[16];
                    G.thumbPos={x:mirror?(1-thumb.x)*w:thumb.x*w,y:thumb.y*h};
                    G.indexPos={x:mirror?(1-index.x)*w:index.x*w,y:index.y*h};
                    G.middlePos={x:mirror?(1-middle.x)*w:middle.x*w,y:middle.y*h};
                    G.palmPos={x:mirror?(1-palm.x)*w:palm.x*w,y:palm.y*h};
                    G.pinchDist=Math.hypot(thumb.x-index.x,thumb.y-index.y,thumb.z-index.z);
                    G.pinchMid={x:(G.thumbPos.x+G.indexPos.x)/2,y:(G.thumbPos.y+G.indexPos.y)/2};
                    G.indexMidDist=Math.hypot(index.x-middle.x,index.y-middle.y,index.z-middle.z);
                    G.isAiming=(G.indexMidDist<AIM_THRESH);
                    G.isRingOut=(Math.hypot(ringTip.x-palm.x,ringTip.y-palm.y,ringTip.z-palm.z)>RING_OUT_TH);

                    if(G.isAiming){
                        const ix=index.x-iBase.x,iy=index.y-iBase.y;
                        const mx=middle.x-mBase.x,my=middle.y-mBase.y;
                        const cx=ix+mx,cy=iy+my;const clen=Math.sqrt(cx*cx+cy*cy);
                        G.aimDir=clen>0.001?{x:cx/clen,y:cy/clen}:null;
                        if(G.isRingOut){if(!G.aimLocked&&G.lockedAimDir){G.aimLocked=true;showMsg('🔒 方向已锁定');}}else{G.aimLocked=false;G.lockedAimDir=G.aimDir;}
                    }else{G.aimDir=null;G.aimLocked=false;}

                    let fs=0;for(const ti of[8,12,16,20]){const tp=smLM[ti];fs+=Math.hypot(tp.x-palm.x,tp.y-palm.y,tp.z-palm.z);}
                    G.fistDist=fs/4;
                    G.wasPinching=G.isPinching;G.isPinching=(G.pinchDist<PINCH_TH);
                    G.wasFist=G.isFist;G.isFist=(G.fistDist<FIST_CLOSE);

                    // 状态机
                    if(G.phase==='idle'&&G.isAiming){
                        G.phase='aiming';
                        if(!aimingMarble&&G.indexPos){
                            let best=null,bd=100;
                            for(const m of marbles){if(m.state!=='free')continue;const d=Math.hypot(m.x-G.indexPos.x,m.y-G.indexPos.y);if(d<bd){bd=d;best=m;}}
                            if(best){aimingMarble=best;G.lockedAimDir=G.aimDir;showMsg('🎯 瞄准 · 无名指🔒锁定 · ✊握拳弹射');}
                        }
                    }else if(G.phase==='aiming'&&!G.isAiming&&!G.isFist){
                        G.phase='idle';G.lockedAimDir=null;G.aimLocked=false;
                        if(aimingMarble){aimingMarble=null;}
                    }else if(G.phase==='aiming'&&G.isFist&&!G.wasFist){
                        if(aimingMarble&&G.lockedAimDir){
                            G.ejectDir={x:G.lockedAimDir.x,y:G.lockedAimDir.y};
                            G.ejectSpeed=500+Math.random()*300;
                            aimingMarble.trail={mx:aimingMarble.x,my:aimingMarble.y,nx:G.ejectDir.x,ny:G.ejectDir.y};
                            aimingMarble.vx=G.ejectDir.x*G.ejectSpeed;
                            aimingMarble.vy=G.ejectDir.y*G.ejectSpeed;
                            aimingMarble.state='moving';
                            showMsg('💨 弹射！');
                            aimingMarble=null;
                        }
                        G.phase='idle';G.lockedAimDir=null;G.aimLocked=false;
                    }
                    drawBones(smLM);
                }else{
                    rstSm();
                    G.thumbPos=G.indexPos=G.middlePos=G.palmPos=null;G.pinchMid=null;
                    G.aimDir=null;G.lockedAimDir=null;G.isAiming=false;G.aimLocked=false;G.isRingOut=false;
                    G.wasPinching=G.isPinching;G.isPinching=false;
                    G.wasFist=G.isFist;G.isFist=false;
                    G.phase='idle';if(aimingMarble){aimingMarble=null;}
                    drawBones(null);
                }
            });
            await hands.initialize();return hands;
        }

        // ============ 摄像头 ============
        async function startCam(){
            if(stream){stopCam();await new Promise(r=>setTimeout(r,300));}
            try{
                stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:G.facing,width:640,height:480}});
                videoEl.srcObject=stream;videoEl.style.transform=G.mirror?'scaleX(-1)':'none';
                await videoEl.play();
                if(videoEl.readyState<2)await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('超时')),10000);videoEl.onloadeddata=()=>{clearTimeout(t);res();};});
                const h=await initHands();if(!h)return;
                async function frame(){rafId=requestAnimationFrame(frame);try{if(videoEl.readyState>=2&&videoEl.videoWidth>0){offCtx.drawImage(videoEl,0,0,640,480);await h.send({image:offC});sendCount++;}}catch(e){}}
                frame();
                btnFront.className='btn'+(G.facing==='user'?' on':'');btnBack.className='btn'+(G.facing==='environment'?' on':'');
            }catch(e){diag('❌ '+e.message);}
        }

        function stopCam(){
            if(rafId){cancelAnimationFrame(rafId);rafId=null;}
            if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
            videoEl.srcObject=null;
            G.thumbPos=G.indexPos=G.middlePos=null;G.isPinching=G.isFist=false;G.phase='idle';G.lockedAimDir=null;G.aimLocked=false;
            if(grabbedMarble){grabbedMarble.state='in_bag';grabbedMarble=null;}
            if(aimingMarble){aimingMarble=null;}
            rstSm();drawBones(null);
        }

        async function switchCam(mode){
            if(G.facing===mode)return;G.facing=mode;G.mirror=(mode==='user');
            stopCam();await new Promise(r=>setTimeout(r,300));await startCam();
        }
        btnFront.addEventListener('click',()=>switchCam('user'));
        btnBack.addEventListener('click',()=>switchCam('environment'));

        // ============ 游戏逻辑 ============
        function updateGame(dt){
            const dtC=Math.min(dt,0.05),bx=BAG_X(),by=BAG_Y();

            // 取球
            if(G.isPinching&&!G.wasPinching&&G.pinchMid){
                if(Math.hypot(G.pinchMid.x-bx,G.pinchMid.y-by)<BAG.r+25){
                    let best=null,bd=44;
                    for(const m of marbles){if(m.state!=='in_bag')continue;const d=Math.hypot(m.x-G.pinchMid.x,m.y-G.pinchMid.y);if(d<bd){bd=d;best=m;}}
                    if(best){best.state='grabbed';best.vx=0;best.vy=0;best.trail=null;grabbedMarble=best;showMsg('👌 取出弹珠');}
                }
            }
            // 移动/放置
            if(grabbedMarble&&G.isPinching&&G.pinchMid){grabbedMarble.x=G.pinchMid.x;grabbedMarble.y=G.pinchMid.y;}
            if(grabbedMarble&&!G.isPinching&&G.wasPinching){
                if(Math.hypot(grabbedMarble.x-bx,grabbedMarble.y-by)<BAG.r+6){grabbedMarble.state='in_bag';showMsg('回袋');}
                else{grabbedMarble.state='free';showMsg('已放置 · 🤞并指瞄准 · 🖐️无名指锁定 · ✊握拳弹射');}
                grabbedMarble.vx=0;grabbedMarble.vy=0;grabbedMarble=null;
            }

            // 弹珠物理
            const holes=getHoles();
            for(const m of marbles){
                if(m.state==='grabbed'||m.state==='in_bag')continue;
                const sp=Math.sqrt(m.vx*m.vx+m.vy*m.vy);
                if(sp>1){const f=160,inv=1/sp;if(Math.abs(m.vx)>f*inv*dtC)m.vx-=m.vx*inv*f*dtC;else m.vx=0;if(Math.abs(m.vy)>f*inv*dtC)m.vy-=m.vy*inv*f*dtC;else m.vy=0;}
                else{m.vx=0;m.vy=0;if(m.state==='moving')m.state='free';}
                m.x+=m.vx*dtC;m.y+=m.vy*dtC;
                const mg=MARBLE_R+8;
                if(m.x<mg){m.x=mg;m.vx=Math.abs(m.vx)*0.45;}if(m.x>W()-mg){m.x=W()-mg;m.vx=-Math.abs(m.vx)*0.45;}
                if(m.y<mg){m.y=mg;m.vy=Math.abs(m.vy)*0.45;}if(m.y>H()-mg){m.y=H()-mg;m.vy=-Math.abs(m.vy)*0.45;}
                for(const m2 of marbles){
                    if(m2===m||m2.state==='in_bag'||m2.state==='grabbed')continue;
                    const dx=m.x-m2.x,dy=m.y-m2.y,dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<MARBLE_R*2&&dist>0.01){
                        const nx=dx/dist,ny=dy/dist,ol=MARBLE_R*2-dist;m.x+=nx*ol/2;m.y+=ny*ol/2;m2.x-=nx*ol/2;m2.y-=ny*ol/2;
                        const rv=(m.vx-m2.vx)*nx+(m.vy-m2.vy)*ny;if(rv>0){m.vx-=rv*nx;m.vy-=rv*ny;m2.vx+=rv*nx;m2.vy+=rv*ny;}
                        if(m.state!=='moving')m.state='moving';if(m2.state!=='moving')m2.state='moving';
                    }
                }
                for(const hh of holes){
                    if(Math.hypot(m.x-hh.x,m.y-hh.y)<HOLE_R-2){
                        m.state='in_bag';m.vx=0;m.vy=0;m.x=bx+(Math.random()-0.5)*24;m.y=by+(Math.random()-0.5)*12;
                        m.trail=null;score++;scoreEl.textContent='⭐ '+score;showMsg('🎉 进洞！+1',2000);
                        if(aimingMarble===m)aimingMarble=null;break;
                    }
                }
                if(m.state==='free'&&Math.abs(m.vx)<0.5&&Math.abs(m.vy)<0.5){
                    if(Math.hypot(m.x-bx,m.y-by)<BAG.r+MARBLE_R){m.state='in_bag';m.x=bx+(Math.random()-0.5)*12;m.y=by+(Math.random()-0.5)*6;m.trail=null;}
                }
            }
            drawGame();
        }

        // ============ 主循环 ============
        window.addEventListener('resize',()=>{woodCache=null;holeCache=null;cacheKey='';resizeGame();resizeSk();buildAllCaches();drawGame();});

        let lastT=performance.now(),tick=0;
        function loop(now){requestAnimationFrame(loop);updateGame((now-lastT)/1000);lastT=now;tick++;if(tick%25===0){diag(`✋:${G.thumbPos?1:0} 态:${G.phase} 瞄:${G.isAiming?'🎯':'❌'} 🔒:${G.aimLocked?'✅':'❌'} 拳:${G.isFist?'✊':'🖐'} ⭐:${score}`);}}

        // ============ 启动 ============
        resizeGame();resizeSk();buildAllCaches();initMarbles();drawGame();startCam();requestAnimationFrame(loop);
        showMsg('👌捏合取球 · 🤞并指瞄准 · 🖐️无名指锁定 · ✊握拳弹射',3500);
    })();
    </script>
</body>
