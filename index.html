<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手势弹珠游戏</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#1a5c2a;overflow:hidden;height:100dvh;width:100vw;font-family:'PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
        #cam-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0.3;}
        #game-canvas{position:fixed;inset:0;z-index:2;pointer-events:none;}
        #sk-canvas{position:fixed;inset:0;z-index:50;pointer-events:none;}
        #score{position:fixed;top:12px;right:16px;z-index:40;color:#fff;font-size:20px;font-weight:700;background:rgba(0,0,0,0.65);padding:8px 16px;border-radius:10px;pointer-events:none;}
        #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;padding:14px 28px;border-radius:22px;background:rgba(0,0,0,0.82);color:#ffd000;font-size:15px;pointer-events:none;opacity:0;transition:opacity 0.3s;text-align:center;}
        #msg.show{opacity:1;}
        #diag{position:fixed;top:8px;left:8px;z-index:40;background:rgba(0,0,0,0.8);color:#0f0;font-size:10px;padding:5px 8px;border-radius:5px;border:1px solid #333;line-height:1.5;pointer-events:none;font-family:monospace;white-space:pre-wrap;}
        .btn-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:10px;}
        .btn{padding:10px 18px;border-radius:22px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:13px;cursor:pointer;font-weight:500;transition:all 0.2s;}
        .btn:active{transform:scale(0.93);}.btn.on{border-color:#22c55e;box-shadow:0 0 14px rgba(34,197,94,0.35);}
    </style>
</head>
<body>
    <video id="cam-video" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>
    <canvas id="sk-canvas"></canvas>
    <div id="score">🎯 0</div>
    <div id="msg"></div>
    <div id="diag">启动中...</div>
    <div class="btn-bar">
        <button class="btn on" id="btn-front">📱 前置</button>
        <button class="btn" id="btn-back">📷 后置</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script>
    (function(){
        const videoEl=document.getElementById('cam-video');
        const gameCvs=document.getElementById('game-canvas');
        const gameCtx=gameCvs.getContext('2d');
        const skCanvas=document.getElementById('sk-canvas');
        const skCtx=skCanvas.getContext('2d');
        const scoreEl=document.getElementById('score');
        const msgEl=document.getElementById('msg');
        const diagEl=document.getElementById('diag');
        const btnFront=document.getElementById('btn-front');
        const btnBack=document.getElementById('btn-back');

        // ============ 全局状态 ============
        const G={
            facing:'user',mirror:true,
            pinchDist:1, flickDist:1,           // 拇指-食指距离, 拇指-中指距离
            isPinching:false, wasPinching:false,
            isCharging:false, wasCharging:false,
            thumbPos:null, indexPos:null, middlePos:null,
            pinchMid:null,                       // 捏合中点
            chargeMid:null,                      // 蓄力中点（拇指+中指）
            flickArmed:false,                    // 蓄力已就绪
            flickTrigger:false,                  // 触发弹射
            flickDir:{x:0,y:0}, flickSpeed:0,    // 弹射方向与速度
        };

        function diag(m){diagEl.textContent=m;console.log(m);}
        function showMsg(t,d=1600){msgEl.textContent=t;msgEl.classList.add('show');clearTimeout(msgEl._t);msgEl._t=setTimeout(()=>msgEl.classList.remove('show'),d);}
        function W(){return window.innerWidth;}function H(){return window.innerHeight;}

        function resizeGame(){const w=W(),h=H();if(gameCvs.width!==w||gameCvs.height!==h){gameCvs.width=w;gameCvs.height=h;}}
        function resizeSk(){const w=W(),h=H();if(skCanvas.width!==w||skCanvas.height!==h){skCanvas.width=w;skCanvas.height=h;}}
        window.addEventListener('resize',()=>{resizeGame();resizeSk();drawGame();});

        // ============ 游戏常量 ============
        const HOLE_R=20, MARBLE_R=13, BAG_R=52;
        const COLORS=['#ff4444','#44aaff','#ffaa00','#aa44ff','#44dd88'];
        const PINCH_THRESH=0.07;      // 捏合阈值（放宽）
        const CHARGE_THRESH=0.07;     // 蓄力阈值（放宽）
        const FLICK_MIN=0.13;         // 弹射触发最小距离
        const BAG={x:70,r:BAG_R};
        function BAG_Y(){return H()-BAG_R-8;}
        function getHoles(){const w=W(),h=H(),m=30;return[{x:m,y:m},{x:w-m,y:m},{x:m,y:h-m},{x:w-m,y:h-m},{x:m,y:h/2},{x:w-m,y:h/2}];}

        class Marble{constructor(i){this.id=i;this.x=0;this.y=0;this.vx=0;this.vy=0;this.state='in_bag';this.color=COLORS[i];}}
        let marbles=[],grabbedMarble=null,chargingMarble=null,score=0;

        function initMarbles(){
            marbles=[];grabbedMarble=null;chargingMarble=null;score=0;scoreEl.textContent='🎯 0';
            const by=BAG_Y();for(let i=0;i<5;i++){const m=new Marble(i);m.x=BAG.x+(Math.random()-0.5)*35;m.y=by+(Math.random()-0.5)*25;marbles.push(m);}
        }

        function drawMarble(x,y,c,r,glow){
            if(glow){gameCtx.fillStyle='rgba(255,255,200,0.25)';gameCtx.beginPath();gameCtx.arc(x,y,r+6,0,Math.PI*2);gameCtx.fill();}
            const g=gameCtx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
            g.addColorStop(0,'rgba(255,255,255,0.75)');g.addColorStop(0.4,c);g.addColorStop(1,'rgba(0,0,0,0.45)');
            gameCtx.beginPath();gameCtx.arc(x,y,r,0,Math.PI*2);gameCtx.fillStyle=g;gameCtx.fill();
            gameCtx.strokeStyle='rgba(255,255,255,0.3)';gameCtx.lineWidth=1;gameCtx.stroke();
        }

        function drawGame(){
            resizeGame();const w=W(),h=H();gameCtx.clearRect(0,0,w,h);
            const g=gameCtx.createRadialGradient(w/2,h/2,50,w/2,h/2,w);
            g.addColorStop(0,'#1e8a32');g.addColorStop(0.5,'#166b24');g.addColorStop(1,'#0c4a16');
            gameCtx.fillStyle=g;gameCtx.fillRect(0,0,w,h);
            // 边框
            gameCtx.strokeStyle='#4a2a10';gameCtx.lineWidth=16;gameCtx.strokeRect(8,8,w-16,h-16);
            gameCtx.strokeStyle='#7a4a2a';gameCtx.lineWidth=4;gameCtx.strokeRect(2,2,w-4,h-4);

            const by=BAG_Y();BAG.y=by;
            // 弹珠袋
            gameCtx.beginPath();gameCtx.arc(BAG.x,by,BAG_R,0,Math.PI*2);gameCtx.fillStyle='rgba(0,0,0,0.55)';gameCtx.fill();
            gameCtx.strokeStyle='#ffd000';gameCtx.lineWidth=3;gameCtx.setLineDash([5,3]);gameCtx.stroke();gameCtx.setLineDash([]);
            gameCtx.fillStyle='#ffd000';gameCtx.font='bold 10px "PingFang SC"';gameCtx.textAlign='center';gameCtx.fillText('弹珠袋',BAG.x,by-BAG_R-6);

            // 袋中弹珠数量
            const inBag=marbles.filter(m=>m.state==='in_bag').length;
            gameCtx.fillStyle='#fff';gameCtx.font='bold 12px "PingFang SC"';gameCtx.fillText('×'+inBag,BAG.x,by+4);

            // 洞口
            for(const hh of getHoles()){
                gameCtx.beginPath();gameCtx.arc(hh.x,hh.y,HOLE_R+5,0,Math.PI*2);gameCtx.fillStyle='rgba(0,0,0,0.75)';gameCtx.fill();
                gameCtx.beginPath();gameCtx.arc(hh.x,hh.y,HOLE_R,0,Math.PI*2);
                const hg=gameCtx.createRadialGradient(hh.x-2,hh.y-2,2,hh.x,hh.y,HOLE_R);hg.addColorStop(0,'#0a0a0a');hg.addColorStop(1,'#000');gameCtx.fillStyle=hg;gameCtx.fill();
            }

            // 弹珠
            for(const m of marbles){
                if(m.state==='grabbed')continue;
                const isCharging=(m===chargingMarble&&G.flickArmed);
                drawMarble(m.x,m.y,m.color,MARBLE_R,isCharging);
            }

            // 被抓的弹珠
            if(grabbedMarble&&G.isPinching&&G.thumbPos&&G.indexPos){
                const mx=G.pinchMid?G.pinchMid.x:(G.thumbPos.x+G.indexPos.x)/2;
                const my=G.pinchMid?G.pinchMid.y:(G.thumbPos.y+G.indexPos.y)/2;
                drawMarble(mx,my,grabbedMarble.color,MARBLE_R+3,true);
            }

            // 蓄力轨迹线
            if(G.flickArmed&&chargingMarble&&G.thumbPos&&G.middlePos){
                const mx=chargingMarble.x,my=chargingMarble.y;
                const dx=G.middlePos.x-G.thumbPos.x,dy=G.middlePos.y-G.thumbPos.y,len=Math.sqrt(dx*dx+dy*dy);
                if(len>0.001){
                    const nx=dx/len,ny=dy/len;
                    // 粗虚线轨迹
                    gameCtx.strokeStyle='rgba(255,255,255,0.9)';gameCtx.lineWidth=3;gameCtx.setLineDash([10,6]);
                    gameCtx.beginPath();gameCtx.moveTo(mx,my);gameCtx.lineTo(mx+nx*280,my+ny*280);gameCtx.stroke();gameCtx.setLineDash([]);
                    // 箭头
                    const ax=mx+nx*280,ay=my+ny*280;
                    gameCtx.fillStyle='#fff';gameCtx.beginPath();gameCtx.arc(ax,ay,7,0,Math.PI*2);gameCtx.fill();
                    gameCtx.fillStyle='#ff0';gameCtx.beginPath();gameCtx.arc(ax,ay,4,0,Math.PI*2);gameCtx.fill();
                    // 力度环
                    const power=Math.min((0.18-G.flickDist)/0.11,1);
                    gameCtx.strokeStyle=`rgba(255,255,100,${0.3+power*0.5})`;gameCtx.lineWidth=2+power*4;
                    gameCtx.beginPath();gameCtx.arc(mx,my,MARBLE_R+8+power*12,0,Math.PI*2);gameCtx.stroke();
                }
            }

            // 捏合取球提示
            if(G.isPinching&&!grabbedMarble&&G.pinchMid){
                const dx=G.pinchMid.x-BAG.x,dy=G.pinchMid.y-by;
                if(Math.sqrt(dx*dx+dy*dy)<BAG_R+25){
                    gameCtx.strokeStyle='rgba(255,208,0,0.5)';gameCtx.lineWidth=2;gameCtx.setLineDash([4,4]);
                    gameCtx.beginPath();gameCtx.arc(BAG.x,by,BAG_R+8,0,Math.PI*2);gameCtx.stroke();gameCtx.setLineDash([]);
                }
            }
        }

        // ============ 骨骼绘制 ============
        const CONNS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
        function drawBones(lmList){
            resizeSk();const w=skCanvas.width,h=skCanvas.height;skCtx.clearRect(0,0,w,h);
            if(!lmList||lmList.length===0)return;
            for(const lm of lmList){
                skCtx.lineCap='round';skCtx.lineJoin='round';
                for(const[a,b] of CONNS){
                    let c='#fff';if(a<=4&&b<=4)c='#ffd000';else if(a>=5&&a<=8&&b>=5&&b<=8)c='#00e5ff';else if(a>=9&&a<=12&&b>=9&&b<=12)c='#ff44aa';
                    const ax=G.mirror?(1-lm[a].x)*w:lm[a].x*w,ay=lm[a].y*h,bx=G.mirror?(1-lm[b].x)*w:lm[b].x*w,by=lm[b].y*h;
                    skCtx.globalAlpha=0.3;skCtx.strokeStyle=c;skCtx.lineWidth=10;skCtx.beginPath();skCtx.moveTo(ax,ay);skCtx.lineTo(bx,by);skCtx.stroke();
                    skCtx.globalAlpha=1;skCtx.lineWidth=4;skCtx.beginPath();skCtx.moveTo(ax,ay);skCtx.lineTo(bx,by);skCtx.stroke();
                }
                for(let i=0;i<lm.length;i++){const p=lm[i];const sx=G.mirror?(1-p.x)*w:p.x*w,sy=p.y*h;let c='#fff',r=5;if(i<=4){c='#ffd000';r=8;}else if(i<=8){c='#00e5ff';r=8;}else if(i<=12){c='#ff44aa';r=8;}if(i===4||i===8||i===12)r=10;skCtx.globalAlpha=0.35;skCtx.beginPath();skCtx.arc(sx,sy,r+5,0,Math.PI*2);skCtx.fillStyle=c;skCtx.fill();skCtx.globalAlpha=1;skCtx.beginPath();skCtx.arc(sx,sy,r,0,Math.PI*2);skCtx.fillStyle=c;skCtx.fill();skCtx.beginPath();skCtx.arc(sx,sy,r,0,Math.PI*2);skCtx.strokeStyle='#fff';skCtx.lineWidth=2;skCtx.stroke();}
                // 拇指-食指虚线
                if(lm.length>8){const t=lm[4],idx=lm[8];const tx=G.mirror?(1-t.x)*w:t.x*w,ty=t.y*h,ix=G.mirror?(1-idx.x)*w:idx.x*w,iy=idx.y*h;const isP=G.isPinching;skCtx.strokeStyle=isP?'rgba(255,208,0,0.95)':'rgba(255,255,255,0.4)';skCtx.lineWidth=isP?5:2;skCtx.setLineDash([6,5]);skCtx.beginPath();skCtx.moveTo(tx,ty);skCtx.lineTo(ix,iy);skCtx.stroke();skCtx.setLineDash([]);if(isP){const mx=(tx+ix)/2,my=(ty+iy)/2;skCtx.beginPath();skCtx.arc(mx,my,12,0,Math.PI*2);skCtx.fillStyle='rgba(255,208,0,0.7)';skCtx.fill();}}
                // 拇指-中指虚线
                if(lm.length>12){const t=lm[4],mid=lm[12];const tx=G.mirror?(1-t.x)*w:t.x*w,ty=t.y*h,mx=G.mirror?(1-mid.x)*w:mid.x*w,my=mid.y*h;const isC=G.flickArmed;skCtx.strokeStyle=isC?'rgba(255,68,170,0.95)':'rgba(255,255,255,0.3)';skCtx.lineWidth=isC?5:1.5;skCtx.setLineDash([4,6]);skCtx.beginPath();skCtx.moveTo(tx,ty);skCtx.lineTo(mx,my);skCtx.stroke();skCtx.setLineDash([]);if(isC){const cmx=(tx+mx)/2,cmy=(ty+my)/2;skCtx.beginPath();skCtx.arc(cmx,cmy,9,0,Math.PI*2);skCtx.fillStyle='rgba(255,68,170,0.7)';skCtx.fill();}}
            }
        }

        // ============ MediaPipe ============
        let hands=null,stream=null,rafId=null,sendCount=0,cbCount=0;
        const offC=document.createElement('canvas');offC.width=640;offC.height=480;
        const offCtx=offC.getContext('2d',{willReadFrequently:true});

        async function initHands(){
            if(hands)return hands;
            if(!window.Hands){diag('❌ window.Hands 不存在');return null;}
            hands=new window.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
            hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.5,minTrackingConfidence:0.3});
            hands.onResults(r=>{
                cbCount++;
                const lm=r.multiHandLandmarks;
                if(lm&&lm.length>0){
                    const w=W(),h=H();
                    const thumb=lm[0][4],index=lm[0][8],middle=lm[0][12];
                    // 屏幕坐标
                    G.thumbPos={x:G.mirror?(1-thumb.x)*w:thumb.x*w,y:thumb.y*h};
                    G.indexPos={x:G.mirror?(1-index.x)*w:index.x*w,y:index.y*h};
                    G.middlePos={x:G.mirror?(1-middle.x)*w:middle.x*w,y:middle.y*h};
                    // 距离
                    G.pinchDist=Math.hypot(thumb.x-index.x,thumb.y-index.y,thumb.z-index.z);
                    G.flickDist=Math.hypot(thumb.x-middle.x,thumb.y-middle.y,thumb.z-middle.z);
                    // 中点
                    G.pinchMid={x:(G.thumbPos.x+G.indexPos.x)/2,y:(G.thumbPos.y+G.indexPos.y)/2};
                    G.chargeMid={x:(G.thumbPos.x+G.middlePos.x)/2,y:(G.thumbPos.y+G.middlePos.y)/2};
                    // 捏合检测
                    G.wasPinching=G.isPinching;G.isPinching=(G.pinchDist<PINCH_THRESH);
                    // ★ 蓄力检测（改进版）
                    G.wasCharging=G.isCharging;
                    G.isCharging=(G.flickDist<CHARGE_THRESH);
                    // 蓄力就绪（持续捏合超过阈值才算）
                    if(G.isCharging&&G.flickDist<CHARGE_THRESH*0.85){
                        G.flickArmed=true;
                    }else if(G.flickDist>FLICK_MIN){
                        G.flickArmed=false;
                    }
                    // ★ 弹射检测：蓄力就绪 + 突然弹开
                    if(G.flickArmed&&G.wasCharging&&G.flickDist>FLICK_MIN){
                        G.flickTrigger=true;
                        const dx=G.middlePos.x-G.thumbPos.x,dy=G.middlePos.y-G.thumbPos.y;
                        const len=Math.sqrt(dx*dx+dy*dy);
                        if(len>0.001){G.flickDir={x:dx/len,y:dy/len};}
                        // ★ 力度：基于距离 + 固定基数，确保至少 500+
                        G.flickSpeed=500+(G.flickDist-FLICK_MIN)*4000;
                        G.flickSpeed=Math.min(G.flickSpeed,1400);
                        G.flickArmed=false;
                    }
                    drawBones(lm);
                }else{
                    G.thumbPos=G.indexPos=G.middlePos=null;G.pinchMid=null;G.chargeMid=null;
                    G.wasPinching=G.isPinching;G.isPinching=false;
                    G.wasCharging=G.isCharging;G.isCharging=false;
                    G.flickArmed=false;
                    drawBones(null);
                }
            });
            await hands.initialize();return hands;
        }

        // ============ 摄像头 ============
        async function startCam(){
            if(stream){stopCam();await new Promise(r=>setTimeout(r,300));}
            try{
                stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:G.facing,width:640,height:480}});
                videoEl.srcObject=stream;videoEl.style.transform=G.mirror?'scaleX(-1)':'none';
                await videoEl.play();
                if(videoEl.readyState<2)await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('视频数据超时')),10000);videoEl.onloadeddata=()=>{clearTimeout(t);res();};});
                const h=await initHands();if(!h)return;
                async function frame(){rafId=requestAnimationFrame(frame);try{if(videoEl.readyState>=2&&videoEl.videoWidth>0){offCtx.drawImage(videoEl,0,0,640,480);await h.send({image:offC});sendCount++;}}catch(e){}}
                frame();
                btnFront.className='btn'+(G.facing==='user'?' on':'');btnBack.className='btn'+(G.facing==='environment'?' on':'');
            }catch(e){diag('❌ '+e.message);}
        }
        function stopCam(){
            if(rafId){cancelAnimationFrame(rafId);rafId=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
            videoEl.srcObject=null;G.thumbPos=G.indexPos=G.middlePos=null;G.isPinching=G.isCharging=false;G.flickArmed=false;
            if(grabbedMarble){grabbedMarble.state='in_bag';grabbedMarble=null;}
            if(chargingMarble){chargingMarble.state='free';chargingMarble=null;}
            drawBones(null);
        }
        async function switchCam(mode){if(G.facing===mode)return;G.facing=mode;G.mirror=(mode==='user');stopCam();await new Promise(r=>setTimeout(r,300));await startCam();}
        btnFront.addEventListener('click',()=>switchCam('user'));btnBack.addEventListener('click',()=>switchCam('environment'));

        // ============ 游戏逻辑 ============
        function updateGame(dt){
            const dtC=Math.min(dt,0.05),by=BAG_Y();BAG.y=by;

            // ── 取球：捏合靠近袋子 ──
            if(G.isPinching&&!G.wasPinching&&G.pinchMid){
                const d=Math.hypot(G.pinchMid.x-BAG.x,G.pinchMid.y-by);
                if(d<BAG_R+30){
                    let best=null,bd=50;
                    for(const m of marbles){if(m.state!=='in_bag')continue;const md=Math.hypot(m.x-G.pinchMid.x,m.y-G.pinchMid.y);if(md<bd){bd=md;best=m;}}
                    if(best){best.state='grabbed';best.vx=0;best.vy=0;grabbedMarble=best;showMsg('👌 取出弹珠！移到桌面后松手');}
                }
            }
            // 移动被抓弹珠
            if(grabbedMarble&&G.isPinching&&G.pinchMid){
                grabbedMarble.x=G.pinchMid.x;grabbedMarble.y=G.pinchMid.y;
            }
            // 松手放置
            if(grabbedMarble&&!G.isPinching&&G.wasPinching){
                const d=Math.hypot(grabbedMarble.x-BAG.x,grabbedMarble.y-by);
                if(d<BAG_R+10){grabbedMarble.state='in_bag';showMsg('弹珠回到袋中');}
                else{grabbedMarble.state='free';showMsg('已放置 · 拇指+中指蓄力弹射');}
                grabbedMarble.vx=0;grabbedMarble.vy=0;grabbedMarble=null;
            }

            // ── 蓄力瞄准 ──
            if(G.flickArmed&&G.chargeMid&&!chargingMarble){
                let best=null,bd=90;
                for(const m of marbles){if(m.state!=='free')continue;const d=Math.hypot(m.x-G.chargeMid.x,m.y-G.chargeMid.y);if(d<bd){bd=d;best=m;}}
                if(best){best.state='charging';chargingMarble=best;}
            }else if(chargingMarble&&!G.flickArmed&&!G.isCharging){
                chargingMarble.state='free';chargingMarble=null;
            }

            // ── 弹射！ ──
            if(G.flickTrigger&&chargingMarble){
                chargingMarble.vx=G.flickDir.x*G.flickSpeed;
                chargingMarble.vy=G.flickDir.y*G.flickSpeed;
                chargingMarble.state='moving';
                showMsg('💨 弹射！速度:'+Math.round(G.flickSpeed));
                chargingMarble=null;
                G.flickTrigger=false;
            }

            // ── 物理 ──
            const holes=getHoles();
            for(const m of marbles){
                if(m.state==='grabbed'||m.state==='in_bag')continue;
                // 摩擦力（降低让弹珠滚更远）
                const sp=Math.sqrt(m.vx*m.vx+m.vy*m.vy);
                if(sp>1){const f=180,inv=1/sp;if(Math.abs(m.vx)>f*inv*dtC)m.vx-=m.vx*inv*f*dtC;else m.vx=0;if(Math.abs(m.vy)>f*inv*dtC)m.vy-=m.vy*inv*f*dtC;else m.vy=0;}
                else{m.vx=0;m.vy=0;if(m.state==='moving')m.state='free';}
                m.x+=m.vx*dtC;m.y+=m.vy*dtC;
                // 墙壁
                const mg=MARBLE_R+8;
                if(m.x<mg){m.x=mg;m.vx=Math.abs(m.vx)*0.55;}if(m.x>W()-mg){m.x=W()-mg;m.vx=-Math.abs(m.vx)*0.55;}
                if(m.y<mg){m.y=mg;m.vy=Math.abs(m.vy)*0.55;}if(m.y>H()-mg){m.y=H()-mg;m.vy=-Math.abs(m.vy)*0.55;}
                // 弹珠碰撞
                for(const m2 of marbles){
                    if(m2===m||m2.state==='in_bag'||m2.state==='grabbed')continue;
                    const dx=m.x-m2.x,dy=m.y-m2.y,dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<MARBLE_R*2&&dist>0.01){
                        const nx=dx/dist,ny=dy/dist,ol=MARBLE_R*2-dist;
                        m.x+=nx*ol/2;m.y+=ny*ol/2;m2.x-=nx*ol/2;m2.y-=ny*ol/2;
                        const rv=(m.vx-m2.vx)*nx+(m.vy-m2.vy)*ny;if(rv>0){m.vx-=rv*nx;m.vy-=rv*ny;m2.vx+=rv*nx;m2.vy+=rv*ny;}
                        if(m.state!=='moving')m.state='moving';if(m2.state!=='moving')m2.state='moving';
                    }
                }
                // 进洞
                for(const hh of holes){
                    if(Math.hypot(m.x-hh.x,m.y-hh.y)<HOLE_R-3){
                        m.state='in_bag';m.vx=0;m.vy=0;m.x=BAG.x+(Math.random()-0.5)*30;m.y=by+(Math.random()-0.5)*18;
                        score++;scoreEl.textContent='🎯 '+score;showMsg('🎉 进洞！+1分',2000);
                        if(chargingMarble===m)chargingMarble=null;break;
                    }
                }
                // 静止自动回袋
                if(m.state==='free'&&Math.abs(m.vx)<0.5&&Math.abs(m.vy)<0.5){
                    if(Math.hypot(m.x-BAG.x,m.y-by)<BAG_R+MARBLE_R){m.state='in_bag';m.x=BAG.x+(Math.random()-0.5)*18;m.y=by+(Math.random()-0.5)*12;}
                }
            }
            drawGame();
        }

        // ============ 主循环 ============
        let lastT=performance.now(),tick=0;
        function loop(now){
            requestAnimationFrame(loop);
            updateGame((now-lastT)/1000);lastT=now;
            tick++;if(tick%20===0){
                diag(`send:${sendCount} cb:${cbCount} ✋:${G.thumbPos?1:0}\n捏合:${G.isPinching?'✅':'❌'} 蓄力:${G.flickArmed?'⚡':'❌'}\npinch:${G.pinchDist.toFixed(3)} flick:${G.flickDist.toFixed(3)}\n分:${score}`);
            }
        }

        // ============ 启动 ============
        resizeGame();resizeSk();initMarbles();drawGame();startCam();requestAnimationFrame(loop);
        showMsg('👌 拇指+食指取球 · 拇指+中指弹射',3500);
    })();
    </script>
