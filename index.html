<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手势骨骼标注</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #111;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ====== 第 1 层：摄像头画面（最底层） ====== */
        .video-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .video-layer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }

        /* ====== 第 2 层：骨骼标注画布（中间层） ====== */
        .skeleton-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }
        .skeleton-layer canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ====== 第 3 层：UI 控件（最顶层） ====== */
        .ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* 左上角信息面板 */
        #info-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 13px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            line-height: 1.7;
            pointer-events: none;
            min-width: 180px;
        }
        #info-panel .label {
            color: #94a3b8;
        }
        #info-panel .val {
            color: #fff;
            font-weight: 600;
        }
        #info-panel .highlight {
            color: #ffd000;
        }

        /* 底部按钮 */
        #btn-toggle {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: all 0.25s ease;
            pointer-events: all;
        }
        #btn-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
        }
        #btn-toggle:active {
            transform: translateX(-50%) scale(0.95);
        }
        #btn-toggle.on {
            border-color: #22c55e;
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.3);
        }

        /* 关闭状态占位 */
        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            letter-spacing: 0.06em;
            pointer-events: none;
        }
        #placeholder.hidden {
            display: none;
        }

        @media (max-width: 480px) {
            #info-panel {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
                font-size: 11px;
            }
            #btn-toggle {
                bottom: 20px;
                padding: 10px 22px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- 第 1 层：摄像头画面 -->
    <div class="video-layer">
        <video id="video-el" playsinline autoplay muted></video>
    </div>

    <!-- 第 2 层：骨骼标注 -->
    <div class="skeleton-layer">
        <canvas id="sk-canvas"></canvas>
    </div>

    <!-- 第 3 层：UI -->
    <div class="ui-layer">
        <div id="placeholder">📷 点击下方按钮开启摄像头</div>

        <div id="info-panel">
            <div><span class="label">手数</span>　　<span class="val" id="hc">--</span></div>
            <div><span class="label">拇指-食指</span> <span class="highlight" id="pd">--</span></div>
            <div><span class="label">dispersion</span> <span class="val" id="dv">--</span></div>
            <div><span class="label">帧</span>　　　<span class="val" id="fn">0</span></div>
        </div>

        <button id="btn-toggle">📷 开启摄像头</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous">
    </script>

    <script>
        (function() {
            // DOM
            const videoEl = document.getElementById('video-el');
            const skCanvas = document.getElementById('sk-canvas');
            const skCtx = skCanvas.getContext('2d');
            const btnToggle = document.getElementById('btn-toggle');
            const placeholder = document.getElementById('placeholder');

            const hcEl = document.getElementById('hc');
            const pdEl = document.getElementById('pd');
            const dvEl = document.getElementById('dv');
            const fnEl = document.getElementById('fn');

            // 状态
            let cameraEnabled = false;
            let cameraStream = null;
            let handsInstance = null;
            let frameLoopId = null;
            let latestResults = null;
            let frameCount = 0;
            let targetDispersion = 0.0;

            // ==================== 骨骼连线 ====================
            const CONNECTIONS = [
                [0, 1],
                [1, 2],
                [2, 3],
                [3, 4], // 拇指
                [0, 5],
                [5, 6],
                [6, 7],
                [7, 8], // 食指
                [0, 9],
                [9, 10],
                [10, 11],
                [11, 12], // 中指
                [0, 13],
                [13, 14],
                [14, 15],
                [15, 16], // 无名指
                [0, 17],
                [17, 18],
                [18, 19],
                [19, 20], // 小指
                [5, 9],
                [9, 13],
                [13, 17], // 掌心横线
            ];
            const TIPS = new Set([4, 8, 12, 16, 20]);

            // ==================== 画布尺寸同步 ====================
            function syncCanvas() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                if (skCanvas.width !== w || skCanvas.height !== h) {
                    skCanvas.width = w;
                    skCanvas.height = h;
                }
            }
            window.addEventListener('resize', syncCanvas);

            // ==================== 绘制骨骼（画在视频上面） ====================
            function drawSkeleton() {
                syncCanvas();
                skCtx.clearRect(0, 0, skCanvas.width, skCanvas.height);

                const results = latestResults;
                if (!results || !results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                    return;
                }

                const w = skCanvas.width;
                const h = skCanvas.height;
                const landmarksList = results.multiHandLandmarks;

                for (const lm of landmarksList) {
                    // ── 半透明手部区域 ──
                    skCtx.fillStyle = 'rgba(0,0,0,0.25)';
                    skCtx.strokeStyle = 'rgba(255,255,255,0.15)';
                    skCtx.lineWidth = 1;
                    skCtx.beginPath();
                    const hull = [0, 5, 6, 7, 8, 12, 16, 20, 19, 18, 17, 13, 9, 4, 3, 2, 1];
                    for (let i = 0; i < hull.length; i++) {
                        const p = lm[hull[i]];
                        const fn = i === 0 ? 'moveTo' : 'lineTo';
                        skCtx[fn](p.x * w, p.y * h);
                    }
                    skCtx.closePath();
                    skCtx.fill();
                    skCtx.stroke();

                    // ── 骨骼连线 ──
                    skCtx.strokeStyle = 'rgba(100, 210, 255, 0.85)';
                    skCtx.lineWidth = 2.5;
                    skCtx.lineCap = 'round';
                    skCtx.beginPath();
                    for (const [a, b] of CONNECTIONS) {
                        skCtx.moveTo(lm[a].x * w, lm[a].y * h);
                        skCtx.lineTo(lm[b].x * w, lm[b].y * h);
                    }
                    skCtx.stroke();

                    // ── 关节圆点 ──
                    for (let i = 0; i < lm.length; i++) {
                        const p = lm[i];
                        const sx = p.x * w;
                        const sy = p.y * h;
                        const isThumbIndex = (i === 4 || i === 8);
                        const isTip = TIPS.has(i);
                        const r = isThumbIndex ? 7 : isTip ? 4.5 : 3;

                        skCtx.beginPath();
                        skCtx.arc(sx, sy, r, 0, Math.PI * 2);

                        if (isThumbIndex) {
                            // 黄色发光：拇指和食指指尖
                            skCtx.fillStyle = '#ffd000';
                            skCtx.shadowColor = 'rgba(255,208,0,0.95)';
                            skCtx.shadowBlur = 14;
                        } else if (isTip) {
                            skCtx.fillStyle = '#ff6b9d';
                            skCtx.shadowColor = 'rgba(255,107,157,0.7)';
                            skCtx.shadowBlur = 7;
                        } else {
                            skCtx.fillStyle = 'rgba(255,255,255,0.75)';
                            skCtx.shadowBlur = 0;
                        }
                        skCtx.fill();
                        skCtx.shadowBlur = 0;
                    }

                    // ── 拇指-食指距离虚线 ──
                    const thumb = lm[4];
                    const index = lm[8];
                    const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y, thumb.z - index.z);

                    skCtx.strokeStyle = 'rgba(255,208,0,0.85)';
                    skCtx.lineWidth = 2;
                    skCtx.setLineDash([7, 5]);
                    skCtx.beginPath();
                    skCtx.moveTo(thumb.x * w, thumb.y * h);
                    skCtx.lineTo(index.x * w, index.y * h);
                    skCtx.stroke();
                    skCtx.setLineDash([]);

                    // 距离数字
                    const mx = (thumb.x + index.x) / 2 * w;
                    const my = (thumb.y + index.y) / 2 * h;
                    skCtx.fillStyle = '#ffd000';
                    skCtx.font = 'bold 13px "SF Mono","Cascadia Code",Consolas,monospace';
                    skCtx.textAlign = 'center';
                    skCtx.fillText(dist.toFixed(3), mx, my - 16);

                    // 捏合/张开状态提示
                    const label = dist < 0.05 ? '聚集' : dist > 0.18 ? '扩散' : '';
                    if (label) {
                        skCtx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
                        skCtx.fillText(label, mx, my - 34);
                    }
                }
            }

            // ==================== 更新 UI 面板 ====================
            function updateUI() {
                const results = latestResults;
                const hasHands = results?.multiHandLandmarks?.length > 0;
                hcEl.textContent = hasHands ? results.multiHandLandmarks.length : '0';

                if (hasHands && results.multiHandLandmarks[0].length > 8) {
                    const t = results.multiHandLandmarks[0][4];
                    const i = results.multiHandLandmarks[0][8];
                    const d = Math.hypot(t.x - i.x, t.y - i.y, t.z - i.z);
                    pdEl.textContent = d.toFixed(4);
                    dvEl.textContent = targetDispersion.toFixed(3);
                } else {
                    pdEl.textContent = '--';
                    dvEl.textContent = '--';
                }
                fnEl.textContent = frameCount;
            }

            // ==================== MediaPipe ====================
            async function initHands() {
                if (handsInstance) return handsInstance;
                console.log('🔧 初始化 MediaPipe Hands...');

                const Hands = window.Hands;
                handsInstance = new Hands({
                    locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`,
                });
                handsInstance.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.5,
                });

                handsInstance.onResults((results) => {
                    latestResults = results;
                    frameCount++;

                    const lm = results.multiHandLandmarks;
                    if (lm && lm.length > 0) {
                        if (lm.length === 1) {
                            const d = Math.hypot(
                                lm[0][4].x - lm[0][8].x,
                                lm[0][4].y - lm[0][8].y,
                                lm[0][4].z - lm[0][8].z
                            );
                            targetDispersion = Math.max(0, Math.min(1, (d - 0.025) / (0.22 - 0.025)));
                        } else {
                            const c1 = avg(lm[0]),
                                c2 = avg(lm[1]);
                            const d = Math.hypot(c1.x - c2.x, c1.y - c2.y, c1.z - c2.z);
                            targetDispersion = Math.max(0, Math.min(1, (d - 0.08) / (0.55 - 0.08)));
                        }
                    }

                    drawSkeleton();
                    updateUI();
                });

                console.log('⏳ 加载 WASM 模型...');
                await handsInstance.initialize();
                console.log('✅ 模型就绪');
                return handsInstance;
            }

            function avg(lm) {
                let x = 0,
                    y = 0,
                    z = 0;
                for (const p of lm) { x += p.x;
                    y += p.y;
                    z += p.z; }
                const n = lm.length;
                return { x: x / n, y: y / n, z: z / n };
            }

            // ==================== 摄像头 ====================
            async function startCamera() {
                if (cameraEnabled) stopCamera();
                await sleep(300);

                try {
                    console.log('📷 getUserMedia...');
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                        },
                    });
                    console.log('✅ 流获取成功, tracks:', cameraStream.getVideoTracks().length);

                    videoEl.srcObject = cameraStream;
                    await videoEl.play();
                    console.log('✅ video.play() 成功, readyState:', videoEl.readyState, 'videoWidth:', videoEl
                        .videoWidth);

                    // 确保视频有画面
                    if (videoEl.readyState < 2) {
                        console.log('⏳ 等待视频数据...');
                        await new Promise((resolve, reject) => {
                            const t = setTimeout(() => reject(new Error('视频数据超时')), 8000);
                            videoEl.onloadeddata = () => { clearTimeout(t);
                                resolve(); };
                        });
                        console.log('✅ 视频数据就绪');
                    }

                    const hands = await initHands();

                    // RAF 帧循环
                    const processFrame = async () => {
                        if (!cameraEnabled) return;
                        try {
                            if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
                                await hands.send({ image: videoEl });
                            }
                        } catch (e) {
                            console.error('send 异常:', e);
                        }
                        frameLoopId = requestAnimationFrame(processFrame);
                    };
                    processFrame();

                    cameraEnabled = true;
                    placeholder.classList.add('hidden');
                    btnToggle.textContent = '🛑 关闭摄像头';
                    btnToggle.classList.add('on');
                    console.log('✅ 摄像头系统完全就绪');

                } catch (err) {
                    console.error('❌ 启动失败:', err);
                    cameraEnabled = false;
                    cameraStream = null;
                    btnToggle.textContent = '📷 开启摄像头';
                    btnToggle.classList.remove('on');
                    placeholder.classList.remove('hidden');

                    const msgMap = {
                        NotAllowedError: '摄像头权限被拒绝。请在浏览器设置中允许访问摄像头。',
                        NotFoundError: '未检测到摄像头设备。',
                        NotReadableError: '摄像头被其他应用占用。',
                    };
                    alert((msgMap[err.name] || `启动失败`) + `\n\n${err.message}`);
                }
            }

            function stopCamera() {
                console.log('🛑 停止摄像头');
                cameraEnabled = false;
                if (frameLoopId) { cancelAnimationFrame(frameLoopId);
                    frameLoopId = null; }
                if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop());
                    cameraStream = null; }
                videoEl.srcObject = null;
                latestResults = null;
                frameCount = 0;
                targetDispersion = 0.0;

                skCtx.clearRect(0, 0, skCanvas.width, skCanvas.height);
                updateUI();
                btnToggle.textContent = '📷 开启摄像头';
                btnToggle.classList.remove('on');
                placeholder.classList.remove('hidden');
            }

            async function toggleCamera() {
                if (cameraEnabled) {
                    stopCamera();
                } else {
                    btnToggle.disabled = true;
                    btnToggle.textContent = '⏳ 启动中...';
                    try {
                        await startCamera();
                    } finally {
                        btnToggle.disabled = false;
                    }
                }
            }

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            // ==================== 事件 ====================
            btnToggle.addEventListener('click', toggleCamera);
            window.addEventListener('keydown', e => {
                if (e.key.toLowerCase() === 'c') toggleCamera();
            });

            console.log('🦴 就绪 — 点击按钮或按 C 键');
        })();
    </script>
</body>
</html>
