<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手势弹珠游戏</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#1a5c2a;overflow:hidden;
            height:100dvh;width:100vw;
            font-family:'PingFang SC','Microsoft YaHei',sans-serif;
            user-select:none;-webkit-user-select:none;
            -webkit-tap-highlight-color:transparent;
            touch-action:manipulation;
        }
        #cam-video{
            position:fixed;inset:0;width:100%;height:100%;
            object-fit:cover;z-index:1;opacity:0.35;
        }
        #game-canvas{
            position:fixed;inset:0;z-index:2;
            pointer-events:none;
        }
        #sk-canvas{
            position:fixed;inset:0;z-index:50;
            pointer-events:none;
        }
        #score{
            position:fixed;top:12px;right:16px;z-index:40;
            color:#fff;font-size:20px;font-weight:700;
            background:rgba(0,0,0,0.65);
            padding:8px 16px;border-radius:10px;
            pointer-events:none;letter-spacing:0.04em;
        }
        #msg{
            position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
            z-index:40;padding:14px 28px;border-radius:22px;
            background:rgba(0,0,0,0.82);color:#ffd000;
            font-size:15px;pointer-events:none;
            opacity:0;transition:opacity 0.3s;
            letter-spacing:0.03em;text-align:center;
        }
        #msg.show{opacity:1;}
        #diag{
            position:fixed;top:8px;left:8px;z-index:40;
            background:rgba(0,0,0,0.7);color:#0f0;
            font-size:10px;padding:4px 8px;border-radius:5px;
            border:1px solid #333;line-height:1.5;
            pointer-events:none;font-family:monospace;
        }
        .btn-bar{
            position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
            z-index:40;display:flex;gap:10px;
        }
        .btn{
            padding:10px 18px;border-radius:22px;
            border:1px solid rgba(255,255,255,0.25);
            background:rgba(0,0,0,0.65);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            color:#fff;font-size:13px;cursor:pointer;
            font-weight:500;letter-spacing:0.02em;transition:all 0.2s;
        }
        .btn:active{transform:scale(0.93);}
        .btn.on{border-color:#22c55e;box-shadow:0 0 14px rgba(34,197,94,0.35);}
    </style>
</head>
<body>

    <video id="cam-video" playsinline autoplay muted></video>
    <canvas id="game-canvas"></canvas>
    <canvas id="sk-canvas"></canvas>

    <div id="score">🎯 0</div>
    <div id="msg"></div>
    <div id="diag">启动中...</div>

    <div class="btn-bar">
        <button class="btn on" id="btn-front">📱 前置</button>
        <button class="btn" id="btn-back">📷 后置</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

    <script>
    (function(){
        const videoEl  = document.getElementById('cam-video');
        const gameCvs  = document.getElementById('game-canvas');
        const gameCtx  = gameCvs.getContext('2d');
        const skCanvas = document.getElementById('sk-canvas');
        const skCtx    = skCanvas.getContext('2d');
        const scoreEl  = document.getElementById('score');
        const msgEl    = document.getElementById('msg');
        const diagEl   = document.getElementById('diag');
        const btnFront = document.getElementById('btn-front');
        const btnBack  = document.getElementById('btn-back');

        // ===== 状态 =====
        let hands=null, rafId=null, stream=null;
        let sendCount=0, cbCount=0, sending=false;
        let latestLM=null, facingMode='user', handSeen=false;

        let thumbPos=null, indexPos=null, middlePos=null;
        let pinchDist=0, flickDist=0;
        let wasPinching=false, isPinching=false;
        let wasCharging=false, isCharging=false;
        let flickDetected=false, flickDir={x:0,y:0}, flickPower=0;

        const PINCH_THRESH=0.06, CHARGE_THRESH=0.055, FLICK_RELEASE=0.09;
        let score=0;

        const offC=document.createElement('canvas');
        offC.width=640;offC.height=480;
        const offCtx=offC.getContext('2d',{willReadFrequently:true});

        function diag(m){diagEl.textContent=m;}
        function showMsg(t,d=1600){msgEl.textContent=t;msgEl.classList.add('show');clearTimeout(msgEl._t);msgEl._t=setTimeout(()=>msgEl.classList.remove('show'),d);}

        function W(){return window.innerWidth;}
        function H(){return window.innerHeight;}

        // ★ 修复：分开 resize，骨骼画布不碰游戏画布
        function resizeGameCanvas(){
            gameCvs.width=W();gameCvs.height=H();
        }
        function resizeSkCanvas(){
            skCanvas.width=W();skCanvas.height=H();
        }
        function resizeAll(){
            resizeGameCanvas();
            resizeSkCanvas();
        }
        window.addEventListener('resize',resizeAll);

        // ===== 游戏 =====
        const HOLE_R=22, MARBLE_R=14, BAG_R=55;
        const MARBLE_COLORS=['#ff4444','#44aaff','#ffaa00','#aa44ff','#44dd88'];
        function BAG_Y(){return H()-BAG_R-10;}
        function getHoles(){
            const w=W(),h=H(),m=35;
            return [{x:m,y:m},{x:w-m,y:m},{x:m,y:h-m},{x:w-m,y:h-m},{x:m,y:h/2},{x:w-m,y:h/2}];
        }

        class Marble{
            constructor(i){this.id=i;this.x=0;this.y=0;this.vx=0;this.vy=0;this.state='in_bag';this.color=MARBLE_COLORS[i];}
        }
        let marbles=[], grabbedMarble=null, chargingMarble=null;
        const BAG={x:70,r:BAG_R};

        function initMarbles(){
            marbles=[];grabbedMarble=null;chargingMarble=null;score=0;scoreEl.textContent='🎯 0';
            const by=BAG_Y();
            for(let i=0;i<5;i++){const m=new Marble(i);m.x=BAG.x+(Math.random()-0.5)*40;m.y=by+(Math.random()-0.5)*30;marbles.push(m);}
        }

        function drawMarble(x,y,color,r){
            const grad=gameCtx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
            grad.addColorStop(0,'rgba(255,255,255,0.7)');
            grad.addColorStop(0.4,color);
            grad.addColorStop(1,'rgba(0,0,0,0.5)');
            gameCtx.beginPath();gameCtx.arc(x,y,r,0,Math.PI*2);
            gameCtx.fillStyle=grad;gameCtx.fill();
            gameCtx.strokeStyle='rgba(255,255,255,0.3)';gameCtx.lineWidth=1.5;gameCtx.stroke();
        }

        function drawGame(){
            const w=W(),h=H();
            gameCtx.clearRect(0,0,w,h);
            const grad=gameCtx.createRadialGradient(w/2,h/2,50,w/2,h/2,w);
            grad.addColorStop(0,'#1a7a2e');grad.addColorStop(0.5,'#156b25');grad.addColorStop(1,'#0d4f18');
            gameCtx.fillStyle=grad;gameCtx.fillRect(0,0,w,h);
            gameCtx.strokeStyle='#5c3a1e';gameCtx.lineWidth=14;gameCtx.strokeRect(7,7,w-14,h-14);
            gameCtx.strokeStyle='#8b5e3c';gameCtx.lineWidth=4;gameCtx.strokeRect(2,2,w-4,h-4);

            const by=BAG_Y();BAG.y=by;
            gameCtx.beginPath();gameCtx.arc(BAG.x,by,BAG_R,0,Math.PI*2);
            gameCtx.fillStyle='rgba(0,0,0,0.5)';gameCtx.fill();
            gameCtx.strokeStyle='#ffd000';gameCtx.lineWidth=3;gameCtx.setLineDash([6,3]);gameCtx.stroke();gameCtx.setLineDash([]);
            gameCtx.fillStyle='#ffd000';gameCtx.font='bold 11px "PingFang SC"';gameCtx.textAlign='center';
            gameCtx.fillText('弹珠袋',BAG.x,by-38);

            for(const hh of getHoles()){
                gameCtx.beginPath();gameCtx.arc(hh.x,hh.y,HOLE_R+4,0,Math.PI*2);
                gameCtx.fillStyle='rgba(0,0,0,0.7)';gameCtx.fill();
                gameCtx.beginPath();gameCtx.arc(hh.x,hh.y,HOLE_R,0,Math.PI*2);
                const hg=gameCtx.createRadialGradient(hh.x-3,hh.y-3,2,hh.x,hh.y,HOLE_R);
                hg.addColorStop(0,'#111');hg.addColorStop(1,'#000');
                gameCtx.fillStyle=hg;gameCtx.fill();
            }

            for(const m of marbles){
                if(m.state==='grabbed')continue;
                drawMarble(m.x,m.y,m.color,MARBLE_R);
            }

            if(grabbedMarble&&isPinching&&thumbPos&&indexPos){
                const mx=(thumbPos.x+indexPos.x)/2,my=(thumbPos.y+indexPos.y)/2;
                drawMarble(mx,my,grabbedMarble.color,MARBLE_R+2);
                gameCtx.fillStyle='rgba(255,255,100,0.3)';
                gameCtx.beginPath();gameCtx.arc(mx,my,MARBLE_R+8,0,Math.PI*2);gameCtx.fill();
            }

            if(isCharging&&chargingMarble&&thumbPos&&middlePos){
                const mx=chargingMarble.x,my=chargingMarble.y;
                const dx=middlePos.x-thumbPos.x,dy=middlePos.y-thumbPos.y,len=Math.sqrt(dx*dx+dy*dy);
                if(len>0.001){
                    const nx=dx/len,ny=dy/len,trailLen=Math.min(flickDist*800,300);
                    gameCtx.strokeStyle='rgba(255,255,255,0.8)';gameCtx.lineWidth=2;
                    gameCtx.setLineDash([8,6]);gameCtx.beginPath();
                    gameCtx.moveTo(mx,my);gameCtx.lineTo(mx+nx*trailLen,my+ny*trailLen);
                    gameCtx.stroke();gameCtx.setLineDash([]);
                    gameCtx.fillStyle='#fff';gameCtx.beginPath();
                    gameCtx.arc(mx+nx*trailLen,my+ny*trailLen,5,0,Math.PI*2);gameCtx.fill();
                }
            }
        }

        // ===== 骨骼绘制 =====
        const CONNS=[
            [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
        ];

        function fingerOf(i){if(i<=4)return'thumb';if(i<=8)return'index';if(i<=12)return'middle';if(i<=16)return'ring';return'pinky';}
        function fingerHex(f){switch(f){case'thumb':return'#ffd000';case'index':return'#00e5ff';case'middle':return'#ff44aa';default:return'#ffffff';}}

        function drawSkeleton(lmList){
            // ★ 修复：只 resize 骨骼画布，不碰游戏画布
            resizeSkCanvas();
            const w=skCanvas.width,h=skCanvas.height;
            skCtx.clearRect(0,0,w,h);
            if(!lmList||lmList.length===0)return;

            const mirror=facingMode==='user';

            for(const lm of lmList){
                // 连线分组
                const groups={};
                for(const[a,b] of CONNS){
                    const f=fingerOf(a)===fingerOf(b)?fingerOf(a):'palm';
                    if(!groups[f])groups[f]=[];
                    groups[f].push([a,b]);
                }

                for(const[finger,pairs] of Object.entries(groups)){
                    const col=fingerHex(finger);
                    const isKey=finger==='thumb'||finger==='index'||finger==='middle';

                    // 发光大线
                    skCtx.globalAlpha=0.35;
                    skCtx.strokeStyle=col;
                    skCtx.lineWidth=isKey?10:6;skCtx.lineCap='round';skCtx.lineJoin='round';
                    skCtx.beginPath();
                    for(const[a,b] of pairs){
                        skCtx.moveTo(mirror?(1-lm[a].x)*w:lm[a].x*w,lm[a].y*h);
                        skCtx.lineTo(mirror?(1-lm[b].x)*w:lm[b].x*w,lm[b].y*h);
                    }
                    skCtx.stroke();
                    skCtx.globalAlpha=1;

                    // 实线
                    skCtx.strokeStyle=col;
                    skCtx.lineWidth=isKey?4:2.5;
                    skCtx.beginPath();
                    for(const[a,b] of pairs){
                        skCtx.moveTo(mirror?(1-lm[a].x)*w:lm[a].x*w,lm[a].y*h);
                        skCtx.lineTo(mirror?(1-lm[b].x)*w:lm[b].x*w,lm[b].y*h);
                    }
                    skCtx.stroke();
                }

                // 关节点
                for(let i=0;i<lm.length;i++){
                    const p=lm[i];
                    const sx=mirror?(1-p.x)*w:p.x*w,sy=p.y*h;
                    const f=fingerOf(i),col=fingerHex(f);
                    const isTip=(i===4||i===8||i===12||i===16||i===20);
                    const isKey=(i===4||i===8||i===12);
                    const r=isKey?10:isTip?7:4;

                    // 光晕
                    skCtx.globalAlpha=0.3;
                    skCtx.beginPath();skCtx.arc(sx,sy,r+6,0,Math.PI*2);
                    skCtx.fillStyle=col;skCtx.fill();
                    skCtx.globalAlpha=0.55;
                    skCtx.beginPath();skCtx.arc(sx,sy,r+2,0,Math.PI*2);
                    skCtx.fillStyle=col;skCtx.fill();
                    skCtx.globalAlpha=1;
                    // 实体
                    skCtx.beginPath();skCtx.arc(sx,sy,r,0,Math.PI*2);
                    skCtx.fillStyle=col;skCtx.fill();
                    // 白边
                    skCtx.beginPath();skCtx.arc(sx,sy,r,0,Math.PI*2);
                    skCtx.strokeStyle='rgba(255,255,255,0.6)';skCtx.lineWidth=1.2;skCtx.stroke();
                }

                // 拇指-食指虚线
                if(lm.length>8){
                    const t=lm[4],idx=lm[8];
                    const tx=mirror?(1-t.x)*w:t.x*w,ty=t.y*h;
                    const ix=mirror?(1-idx.x)*w:idx.x*w,iy=idx.y*h;
                    const isPinch=pinchDist<PINCH_THRESH;
                    skCtx.strokeStyle=isPinch?'rgba(255,208,0,0.95)':'rgba(255,255,255,0.45)';
                    skCtx.lineWidth=isPinch?5:2;
                    skCtx.setLineDash([6,5]);skCtx.beginPath();
                    skCtx.moveTo(tx,ty);skCtx.lineTo(ix,iy);skCtx.stroke();skCtx.setLineDash([]);

                    if(isPinch){
                        const mx=(tx+ix)/2,my=(ty+iy)/2;
                        skCtx.beginPath();skCtx.arc(mx,my,12,0,Math.PI*2);
                        skCtx.fillStyle='rgba(255,208,0,0.7)';
                        skCtx.shadowColor='rgba(255,208,0,0.9)';skCtx.shadowBlur=18;
                        skCtx.fill();skCtx.shadowBlur=0;
                    }
                }

                // 拇指-中指虚线
                if(lm.length>12){
                    const t=lm[4],mid=lm[12];
                    const tx=mirror?(1-t.x)*w:t.x*w,ty=t.y*h;
                    const mx=mirror?(1-mid.x)*w:mid.x*w,my=mid.y*h;
                    const isCharge=flickDist<CHARGE_THRESH;
                    skCtx.strokeStyle=isCharge?'rgba(255,68,170,0.95)':'rgba(255,255,255,0.3)';
                    skCtx.lineWidth=isCharge?5:1.5;
                    skCtx.setLineDash([4,6]);skCtx.beginPath();
                    skCtx.moveTo(tx,ty);skCtx.lineTo(mx,my);skCtx.stroke();skCtx.setLineDash([]);

                    if(isCharge){
                        const cmx=(tx+mx)/2,cmy=(ty+my)/2;
                        skCtx.beginPath();skCtx.arc(cmx,cmy,9,0,Math.PI*2);
                        skCtx.fillStyle='rgba(255,68,170,0.7)';
                        skCtx.shadowColor='rgba(255,68,170,0.9)';skCtx.shadowBlur=16;
                        skCtx.fill();skCtx.shadowBlur=0;
                    }
                }
            }
        }

        // ===== MediaPipe =====
        async function initHands(){
            if(hands)return hands;
            const H=window.Hands;
            if(!H){diag('❌ window.Hands 不存在');return null;}
            diag('创建 Hands 实例...');
            hands=new H({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
            hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.5,minTrackingConfidence:0.3});
            hands.onResults(r=>{
                cbCount++;
                const lm=r.multiHandLandmarks;
                if(lm&&lm.length>0){
                    handSeen=true;latestLM=lm;
                    const mirror=facingMode==='user';
                    const w=W(),h=H();
                    const t=lm[0][4],idx=lm[0][8],mid=lm[0][12];
                    thumbPos={x:mirror?(1-t.x)*w:t.x*w,y:t.y*h};
                    indexPos={x:mirror?(1-idx.x)*w:idx.x*w,y:idx.y*h};
                    middlePos={x:mirror?(1-mid.x)*w:mid.x*w,y:mid.y*h};
                    pinchDist=Math.hypot(t.x-idx.x,t.y-idx.y,t.z-idx.z);
                    flickDist=Math.hypot(t.x-mid.x,t.y-mid.y,t.z-mid.z);
                    wasPinching=isPinching;isPinching=(pinchDist<PINCH_THRESH);
                    wasCharging=isCharging;isCharging=(flickDist<CHARGE_THRESH);
                    flickDetected=false;
                    if(wasCharging&&flickDist>FLICK_RELEASE){
                        flickDetected=true;
                        const dx=middlePos.x-thumbPos.x,dy=middlePos.y-thumbPos.y,len=Math.sqrt(dx*dx+dy*dy);
                        if(len>0.001){flickDir={x:dx/len,y:dy/len};}
                        flickPower=Math.min((flickDist-CHARGE_THRESH)/0.03*2.5,1200);
                    }
                    drawSkeleton(lm);
                }else{
                    handSeen=false;latestLM=null;
                    thumbPos=indexPos=middlePos=null;
                    wasPinching=isPinching;isPinching=false;
                    wasCharging=isCharging;isCharging=false;
                    drawSkeleton(null);
                }
            });
            diag('加载 WASM...');
            await hands.initialize();
            diag('✅ 模型就绪');
            return hands;
        }

        // ===== 游戏逻辑 =====
        function updateGame(dt){
            const dtC=Math.min(dt,0.05),by=BAG_Y();BAG.y=by;

            if(isPinching&&!wasPinching&&thumbPos&&indexPos){
                const mx=(thumbPos.x+indexPos.x)/2,my=(thumbPos.y+indexPos.y)/2;
                const bdx=mx-BAG.x,bdy=my-by,bdist=Math.sqrt(bdx*bdx+bdy*bdy);
                if(bdist<BAG_R+20){
                    let best=null,bestDist=60;
                    for(const m of marbles){if(m.state!=='in_bag')continue;const d=Math.hypot(m.x-mx,m.y-my);if(d<bestDist){bestDist=d;best=m;}}
                    if(best){best.state='grabbed';best.vx=0;best.vy=0;grabbedMarble=best;showMsg('👌 已取出弹珠！');}
                }
            }
            if(grabbedMarble&&isPinching&&thumbPos&&indexPos){
                grabbedMarble.x=(thumbPos.x+indexPos.x)/2;grabbedMarble.y=(thumbPos.y+indexPos.y)/2;
            }
            if(grabbedMarble&&!isPinching&&wasPinching){
                const dx=grabbedMarble.x-BAG.x,dy=grabbedMarble.y-by;
                if(Math.sqrt(dx*dx+dy*dy)<BAG_R){grabbedMarble.state='in_bag';showMsg('弹珠回到袋中');}
                else{grabbedMarble.state='free';showMsg('已放置 · 拇指+中指弹射');}
                grabbedMarble.vx=0;grabbedMarble.vy=0;grabbedMarble=null;
            }
            if(isCharging&&thumbPos&&middlePos&&!chargingMarble){
                const mx=(thumbPos.x+middlePos.x)/2,my=(thumbPos.y+middlePos.y)/2;
                let best=null,bestDist=80;
                for(const m of marbles){if(m.state!=='free')continue;const d=Math.hypot(m.x-mx,m.y-my);if(d<bestDist){bestDist=d;best=m;}}
                if(best){best.state='charging';chargingMarble=best;}
            }else if(chargingMarble&&!isCharging){chargingMarble.state='free';chargingMarble=null;}
            if(flickDetected&&chargingMarble){
                chargingMarble.vx=flickDir.x*flickPower;chargingMarble.vy=flickDir.y*flickPower;
                chargingMarble.state='moving';showMsg('💨 弹射！');chargingMarble=null;
            }

            const holes=getHoles();
            for(const m of marbles){
                if(m.state==='grabbed'||m.state==='in_bag')continue;
                const speed=Math.sqrt(m.vx*m.vx+m.vy*m.vy);
                if(speed>0.5){const fric=280,invS=1/speed;if(Math.abs(m.vx)>fric*invS*dtC)m.vx-=m.vx*invS*fric*dtC;else m.vx=0;if(Math.abs(m.vy)>fric*invS*dtC)m.vy-=m.vy*invS*fric*dtC;else m.vy=0;}
                else{m.vx=0;m.vy=0;if(m.state==='moving')m.state='free';}
                m.x+=m.vx*dtC;m.y+=m.vy*dtC;
                const mg=MARBLE_R+10;
                if(m.x<mg){m.x=mg;m.vx=Math.abs(m.vx)*0.6;}if(m.x>W()-mg){m.x=W()-mg;m.vx=-Math.abs(m.vx)*0.6;}
                if(m.y<mg){m.y=mg;m.vy=Math.abs(m.vy)*0.6;}if(m.y>H()-mg){m.y=H()-mg;m.vy=-Math.abs(m.vy)*0.6;}
                for(const m2 of marbles){
                    if(m2===m||m2.state==='in_bag'||m2.state==='grabbed')continue;
                    const dx=m.x-m2.x,dy=m.y-m2.y,dist=Math.sqrt(dx*dx+dy*dy);
                    if(dist<MARBLE_R*2&&dist>0.01){
                        const nx=dx/dist,ny=dy/dist,overlap=MARBLE_R*2-dist;
                        m.x+=nx*overlap/2;m.y+=ny*overlap/2;m2.x-=nx*overlap/2;m2.y-=ny*overlap/2;
                        const rv=(m.vx-m2.vx)*nx+(m.vy-m2.vy)*ny;if(rv>0){m.vx-=rv*nx;m.vy-=rv*ny;m2.vx+=rv*nx;m2.vy+=rv*ny;}
                        if(m.state!=='moving')m.state='moving';if(m2.state!=='moving')m2.state='moving';
                    }
                }
                for(const hh of holes){
                    if(Math.hypot(m.x-hh.x,m.y-hh.y)<HOLE_R-4){
                        m.state='in_bag';m.vx=0;m.vy=0;m.x=BAG.x+(Math.random()-0.5)*30;m.y=by+(Math.random()-0.5)*20;
                        score++;scoreEl.textContent='🎯 '+score;showMsg('🎉 进洞！+1分',2000);
                        if(chargingMarble===m)chargingMarble=null;break;
                    }
                }
                if(m.state==='free'&&Math.abs(m.vx)<1&&Math.abs(m.vy)<1){
                    if(Math.hypot(m.x-BAG.x,m.y-by)<BAG_R+MARBLE_R){m.state='in_bag';m.x=BAG.x+(Math.random()-0.5)*20;m.y=by+(Math.random()-0.5)*15;}
                }
            }
            drawGame();
        }

        // ===== 摄像头 =====
        async function startCam(){
            if(stream){stopCam();await sleep(300);}
            try{
                stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:640,height:480}});
                videoEl.srcObject=stream;
                videoEl.style.transform=facingMode==='user'?'scaleX(-1)':'none';
                await videoEl.play();
                if(videoEl.readyState<2)await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('视频超时')),8000);videoEl.onloadeddata=()=>{clearTimeout(t);res();};});
                const h=await initHands();if(!h)return;
                async function frame(){rafId=requestAnimationFrame(frame);if(sending)return;sending=true;try{if(videoEl.readyState>=2&&videoEl.videoWidth>0){offCtx.drawImage(videoEl,0,0,640,480);await h.send({image:offC});sendCount++;}}catch(e){}sending=false;}
                frame();
                btnFront.className='btn'+(facingMode==='user'?' on':'');btnBack.className='btn'+(facingMode==='environment'?' on':'');
            }catch(e){diag('❌ '+e.message);}
        }
        function stopCam(){
            if(rafId){cancelAnimationFrame(rafId);rafId=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
            videoEl.srcObject=null;handSeen=false;
            thumbPos=indexPos=middlePos=null;isPinching=isCharging=false;
            if(grabbedMarble){grabbedMarble.state='in_bag';grabbedMarble=null;}
            if(chargingMarble){chargingMarble.state='free';chargingMarble=null;}
            drawSkeleton(null);
        }
        async function switchCam(mode){if(facingMode===mode)return;facingMode=mode;stopCam();await sleep(300);await startCam();}
        function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
        btnFront.addEventListener('click',()=>switchCam('user'));
        btnBack.addEventListener('click',()=>switchCam('environment'));

        // ===== 主循环 =====
        let lastTime=performance.now();
        function loop(now){
            requestAnimationFrame(loop);
            const dt=(now-lastTime)/1000;lastTime=now;
            updateGame(dt);
            const hasHand=latestLM&&latestLM.length>0;
            diag(`send:${sendCount} cb:${cbCount} ✋:${hasHand?latestLM.length:0} pinch:${pinchDist.toFixed(3)} flick:${flickDist.toFixed(3)} 分:${score}`);
        }

        // ===== 启动 =====
        resizeAll();
        initMarbles();
        drawGame();
        startCam();
        requestAnimationFrame(loop);
        window.addEventListener('resize',()=>{resizeAll();drawGame();});
        showMsg('👌 拇指+食指取球 · 拇指+中指弹射',3500);
    })();
    </script>
</body>
</html>
