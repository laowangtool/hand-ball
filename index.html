<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手势骨骼标注</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ── 第 1 层：摄像头视频 ── */
        #video-el {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        /* 前置镜像，后置不镜像 — JS 控制 */
        #video-el.mirrored {
            transform: scaleX(-1);
        }

        /* ── 第 2 层：骨骼标注画布 ── */
        #sk-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* ── 诊断面板 ── */
        #diag {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 20;
            background: rgba(0,0,0,0.75);
            color: #0f0;
            font-size: 11px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #333;
            line-height: 1.6;
            pointer-events: none;
            font-family: 'SF Mono','Cascadia Code',Consolas,monospace;
            max-width: 300px;
            white-space: pre-wrap;
        }

        /* ── 底部按钮组 ── */
        .btn-row {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.94); }
        .btn.highlight {
            border-color: #f0a500;
            color: #f0a500;
        }
        .btn.front-active {
            border-color: #6366f1;
            box-shadow: 0 0 16px rgba(99,102,241,0.4);
        }
        .btn.back-active {
            border-color: #22c55e;
            box-shadow: 0 0 16px rgba(34,197,94,0.4);
        }

        @media (max-width: 480px) {
            .btn { padding: 10px 16px; font-size: 13px; }
            .btn-row { gap: 6px; bottom: 18px; }
            #diag { font-size: 9px; padding: 6px 8px; }
        }
    </style>
</head>
<body>

    <video id="video-el" playsinline autoplay muted></video>
    <canvas id="sk-canvas"></canvas>

    <div id="diag">启动中...</div>

    <div class="btn-row">
        <button class="btn front-active" id="btn-front">📱 前置</button>
        <button class="btn" id="btn-back">📷 后置</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
            crossorigin="anonymous"></script>

    <script>
    (function() {
        const videoEl  = document.getElementById('video-el');
        const skCanvas = document.getElementById('sk-canvas');
        const skCtx    = skCanvas.getContext('2d');
        const diagEl   = document.getElementById('diag');
        const btnFront = document.getElementById('btn-front');
        const btnBack  = document.getElementById('btn-back');

        // ============ 全局状态 ============
        let hands        = null;
        let rafId        = null;
        let currentStream= null;
        let results      = null;
        let cbCount      = 0;
        let sendCount    = 0;
        let facingMode   = 'user';        // 'user' 前置 / 'environment' 后置
        let isMirrored   = true;          // 前置=true（视频和骨骼都镜像），后置=false
        let sendingLock  = false;

        // 离屏 canvas：视频帧 → MediaPipe（修复 iOS Safari）
        const offCanvas = document.createElement('canvas');
        offCanvas.width  = 640;
        offCanvas.height = 480;
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        function diag(msg) { diagEl.textContent = msg; console.log(msg); }

        // ============ 画布 ============
        function resize() {
            skCanvas.width  = window.innerWidth;
            skCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ============ 骨骼连线 ============
        const CONNS = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],
            [0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20],
            [5,9],[9,13],[13,17]
        ];

        function drawSkeleton(lmList) {
            skCtx.clearRect(0, 0, skCanvas.width, skCanvas.height);
            if (!lmList || lmList.length === 0) return;

            const W = skCanvas.width;
            const H = skCanvas.height;

            for (const lm of lmList) {
                // ── 连线 ──
                skCtx.strokeStyle = '#4cf';
                skCtx.lineWidth = 2.5;
                skCtx.lineCap = 'round';
                skCtx.beginPath();
                for (const [a,b] of CONNS) {
                    // ★ 核心：前置摄像头 x 坐标翻转，使骨骼与镜像视频对齐
                    const ax = isMirrored ? (1 - lm[a].x) * W : lm[a].x * W;
                    const ay = lm[a].y * H;
                    const bx = isMirrored ? (1 - lm[b].x) * W : lm[b].x * W;
                    const by = lm[b].y * H;
                    skCtx.moveTo(ax, ay);
                    skCtx.lineTo(bx, by);
                }
                skCtx.stroke();

                // ── 关节点 ──
                for (let i = 0; i < lm.length; i++) {
                    const sx = isMirrored ? (1 - lm[i].x) * W : lm[i].x * W;
                    const sy = lm[i].y * H;
                    const isKey = (i === 4 || i === 8);
                    const isTip = (i === 12 || i === 16 || i === 20);
                    const r = isKey ? 6 : isTip ? 4 : 2.5;

                    skCtx.beginPath();
                    skCtx.arc(sx, sy, r, 0, Math.PI * 2);

                    if (isKey) {
                        skCtx.fillStyle = '#ffd000';
                        skCtx.shadowColor = 'rgba(255,208,0,0.9)';
                        skCtx.shadowBlur = 8;
                    } else if (isTip) {
                        skCtx.fillStyle = '#ff6b9d';
                    } else {
                        skCtx.fillStyle = '#fff';
                    }
                    skCtx.fill();
                    skCtx.shadowBlur = 0;
                }
            }
        }

        // ============ MediaPipe ============
        async function initHands() {
            if (hands) return hands;
            diag('加载 MediaPipe...');

            const H = window.Hands;
            if (!H) throw new Error('window.Hands 不存在');

            hands = new H({
                locateFile: (f) =>
                    `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`,
            });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.3,
            });

            hands.onResults((r) => {
                results = r;
                cbCount++;
                const lm = r.multiHandLandmarks;
                drawSkeleton(lm && lm.length > 0 ? lm : null);
            });

            diag('加载 WASM 模型...');
            await hands.initialize();
            diag('模型就绪 ✓');
            return hands;
        }

        // ============ 摄像头启动 ============
        async function startCamera(mode) {
            // 停止旧流
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            videoEl.srcObject = null;
            results = null;
            cbCount = 0;
            sendCount = 0;

            facingMode = mode;
            isMirrored = (mode === 'user');

            // 视频镜像
            if (isMirrored) {
                videoEl.classList.add('mirrored');
            } else {
                videoEl.classList.remove('mirrored');
            }

            // 按钮状态
            btnFront.className = 'btn' + (mode === 'user' ? ' front-active' : '');
            btnBack.className  = 'btn' + (mode === 'environment' ? ' back-active' : '');

            try {
                diag(`启动 ${mode==='user'?'前置':'后置'}摄像头...`);
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: mode, width: 640, height: 480 }
                });
                currentStream = stream;
                videoEl.srcObject = stream;
                await videoEl.play();

                if (videoEl.readyState < 2) {
                    await new Promise((res, rej) => {
                        const t = setTimeout(() => rej(new Error('超时')), 8000);
                        videoEl.onloadeddata = () => { clearTimeout(t); res(); };
                    });
                }

                diag(`${videoEl.videoWidth}x${videoEl.videoHeight} | ${isMirrored?'镜像':'原始'}`);

                await initHands();

                // 帧循环
                function frame() {
                    if (sendingLock) { rafId = requestAnimationFrame(frame); return; }
                    sendingLock = true;
                    if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
                        offCtx.drawImage(videoEl, 0, 0, 640, 480);
                        hands.send({ image: offCanvas })
                            .then(() => { sendCount++; sendingLock = false; })
                            .catch(() => { sendingLock = false; });
                    } else {
                        sendingLock = false;
                    }
                    rafId = requestAnimationFrame(frame);
                }
                frame();

            } catch(e) {
                diag(`❌ ${e.message}`);
                console.error(e);
            }
        }

        // ============ 按钮事件 ============
        btnFront.addEventListener('click', () => {
            if (facingMode === 'user') return;
            btnFront.disabled = btnBack.disabled = true;
            startCamera('user').finally(() => {
                btnFront.disabled = btnBack.disabled = false;
            });
        });

        btnBack.addEventListener('click', () => {
            if (facingMode === 'environment') return;
            btnFront.disabled = btnBack.disabled = true;
            startCamera('environment').finally(() => {
                btnFront.disabled = btnBack.disabled = false;
            });
        });

        // ============ 诊断定时器 ============
        setInterval(() => {
            const lm = results?.multiHandLandmarks;
            const hc = lm ? lm.length : 0;
            let distStr = '';
            if (lm && lm.length > 0 && lm[0].length > 8) {
                const d = Math.hypot(
                    lm[0][4].x - lm[0][8].x,
                    lm[0][4].y - lm[0][8].y,
                    lm[0][4].z - lm[0][8].z
                );
                distStr = ` 距:${d.toFixed(3)}`;
            }
            diag(
                `${facingMode==='user'?'📱前置(镜像)':'📷后置(原始)'}\n` +
                `send:${sendCount} cb:${cbCount} ✋:${hc}${distStr}`
            );
        }, 800);

        // ============ 启动：默认前置 ============
        startCamera('user');
    })();
    </script>
</body>
</html>
