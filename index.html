<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>粒子跟随手指</title>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#000;overflow:hidden;height:100dvh;width:100vw;font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

        /* 第 1 层：半透明摄像头 */
        #video-layer{position:fixed;inset:0;z-index:1;opacity:0.45;}
        #video-layer video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1);}

        /* 第 2 层：Three.js 粒子 */
        #three-canvas{position:fixed;inset:0;z-index:2;pointer-events:none;width:100%;height:100%;}

        /* 第 3 层：骨骼标注 */
        #sk-canvas{position:fixed;inset:0;z-index:3;pointer-events:none;width:100%;height:100%;}

        #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;padding:7px 16px;border-radius:16px;background:rgba(10,10,24,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.08);color:#e2e8f0;font-size:11px;transition:opacity 0.3s;opacity:0;pointer-events:none;text-align:center;}
        #toast.show{opacity:1;}
        #mode-tag{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:20;padding:4px 12px;border-radius:10px;background:rgba(129,140,248,0.18);color:#a5b4fc;font-size:10px;pointer-events:none;opacity:0;transition:opacity 0.35s;}
        #mode-tag.show{opacity:1;}

        .ui-panel{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:5px;padding:5px 8px;background:rgba(10,10,24,0.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.07);border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,0.5);}
        @media(min-width:640px){.ui-panel{bottom:22px;gap:7px;padding:7px 12px;border-radius:18px;}}

        .btn{display:flex;align-items:center;justify-content:center;gap:3px;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.03);color:#e2e8f0;font-size:11px;font-weight:500;cursor:pointer;transition:all 0.2s;white-space:nowrap;-webkit-tap-highlight-color:transparent;min-height:34px;}
        .btn:hover{background:rgba(255,255,255,0.08);}
        .btn:active{transform:scale(0.93);}
        .btn.active{background:#818cf8;border-color:#818cf8;color:#fff;box-shadow:0 0 14px rgba(129,140,248,0.35);}
        .btn svg{width:14px;height:14px;flex-shrink:0;}
        @media(min-width:640px){.btn{padding:8px 13px;font-size:12px;gap:4px;border-radius:11px;}.btn svg{width:16px;height:16px;}}

        .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;transition:all 0.3s;background:#ef4444;}
        .dot.on{background:#22c55e;box-shadow:0 0 7px #22c55e;}
        .dot.auto{background:#f59e0b;box-shadow:0 0 5px #f59e0b;}

        #image-upload{display:none;}
        #particle-count{position:fixed;top:12px;right:14px;z-index:20;color:#94a3b8;font-size:9px;letter-spacing:0.06em;pointer-events:none;opacity:0.5;font-variant-numeric:tabular-nums;}
    </style>
</head>
<body>

    <div id="video-layer">
        <video id="cam-video" playsinline autoplay muted></video>
    </div>
    <canvas id="three-canvas"></canvas>
    <canvas id="sk-canvas"></canvas>

    <div id="toast"></div>
    <div id="mode-tag"></div>
    <div id="particle-count">18,000</div>

    <div class="ui-panel">
        <button class="btn" id="btn-upload" style="background:rgba(129,140,248,0.1);border-color:rgba(129,140,248,0.25);color:#a5b4fc;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>图片</span>
        </button>
        <button class="btn" id="btn-camera"><span class="dot" id="dot"></span><span>手势</span></button>
        <button class="btn" id="btn-flip">🔄</button>
        <button class="btn" id="btn-fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
        </button>
        <button class="btn" id="btn-reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 019.95 9"/></svg>
        </button>
    </div>

    <input type="file" id="image-upload" accept="image/*">

    <script type="module">
        import * as THREE from 'three';

        // ===== DOM =====
        const threeCanvas = document.getElementById('three-canvas');
        const camVideo    = document.getElementById('cam-video');
        const skCanvas    = document.getElementById('sk-canvas');
        const skCtx       = skCanvas.getContext('2d');
        const toastEl     = document.getElementById('toast');
        const modeTag     = document.getElementById('mode-tag');
        const pCountEl    = document.getElementById('particle-count');
        const dotEl       = document.getElementById('dot');
        const btnCamera   = document.getElementById('btn-camera');
        const btnFlip     = document.getElementById('btn-flip');
        const btnUpload   = document.getElementById('btn-upload');
        const btnFS       = document.getElementById('btn-fullscreen');
        const btnReset    = document.getElementById('btn-reset');
        const fileInput   = document.getElementById('image-upload');

        // ===== 状态 =====
        const N = 18000;
        let cameraOn = false, stream = null, handsInst = null, rafId = null;
        let results = null, handSeen = false, sendCount = 0, cbCount = 0, sending = false;
        let facingMode = 'user', isMirrored = true, hasImage = false;
        let attractors = [];

        const offCanvas = document.createElement('canvas');
        offCanvas.width = 640; offCanvas.height = 480;
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        function toast(msg,d=1800){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),d);}
        function showMode(msg){modeTag.textContent=msg;modeTag.classList.add('show');clearTimeout(modeTag._t);modeTag._t=setTimeout(()=>modeTag.classList.remove('show'),1600);}

        // ===== THREE.JS =====
        const scene = new THREE.Scene();
        const aspect = () => window.innerWidth / window.innerHeight;
        const camera = new THREE.PerspectiveCamera(60, aspect(), 0.1, 20);
        camera.position.set(0, 0, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
        renderer.setClearColor(0x000000, 0);

        // ===== 着色器 =====
        const vertShader = /*glsl*/`
            attribute vec3 color;attribute float size;
            varying vec3 vColor;varying float vAlpha;
            uniform float uPixelRatio,uPointSize;
            void main(){
                vec4 mv=modelViewMatrix*vec4(position,1.0);
                gl_Position=projectionMatrix*mv;
                float sa=clamp(4.5/-mv.z,0.5,2.0);
                gl_PointSize=uPointSize*uPixelRatio*size*sa;
                gl_PointSize=clamp(gl_PointSize,0.2,22.0);
                vColor=color;vAlpha=1.0;
            }`;
        const fragShader = /*glsl*/`
            varying vec3 vColor;varying float vAlpha;
            void main(){
                float d=length(gl_PointCoord-0.5)*2.0;
                float core=exp(-d*d*3.5),mid=exp(-d*d*9.0),edge=exp(-d*d*18.0);
                float alpha=core*0.5+mid*0.38+edge*0.12;
                alpha=smoothstep(0.02,1.0,alpha);
                if(alpha<0.012)discard;
                gl_FragColor=vec4(vColor+core*0.12,alpha*vAlpha);
            }`;

        // ===== 粒子数据 =====
        let homePos = new Float32Array(N*3), curPos = new Float32Array(N*3);
        let colArr = new Float32Array(N*3), sizeArr = new Float32Array(N), velArr = new Float32Array(N*3);

        function randomHome(){
            for(let i=0;i<N;i++){
                homePos[i*3]=(Math.random()-0.5)*5.5;
                homePos[i*3+1]=(Math.random()-0.5)*5.5/aspect();
                homePos[i*3+2]=(Math.random()-0.5)*1.2;
                curPos[i*3]=homePos[i*3];curPos[i*3+1]=homePos[i*3+1];curPos[i*3+2]=homePos[i*3+2];
                velArr[i*3]=velArr[i*3+1]=velArr[i*3+2]=0;
                const c=new THREE.Color().setHSL(0.56+Math.random()*0.2,0.5+Math.random()*0.4,0.35+Math.random()*0.45);
                colArr[i*3]=c.r;colArr[i*3+1]=c.g;colArr[i*3+2]=c.b;
                sizeArr[i]=0.2+Math.random()*0.55;
            }
        }
        randomHome();

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position',new THREE.BufferAttribute(curPos,3));
        geom.setAttribute('color',new THREE.BufferAttribute(colArr,3));
        geom.setAttribute('size',new THREE.BufferAttribute(sizeArr,1));
        geom.setDrawRange(0,N);

        const mat = new THREE.ShaderMaterial({
            vertexShader:vertShader,fragmentShader:fragShader,
            uniforms:{uPixelRatio:{value:Math.min(window.devicePixelRatio,2.5)},uPointSize:{value:12.0}},
            transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
        });
        const points = new THREE.Points(geom,mat);scene.add(points);

        // 背景星
        const sg=new THREE.BufferGeometry();const sp=new Float32Array(800*3);
        for(let i=0;i<800;i++){sp[i*3]=(Math.random()-0.5)*10;sp[i*3+1]=(Math.random()-0.5)*10/aspect();sp[i*3+2]=(Math.random()-0.5)*3;}
        sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
        const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0x555588,size:0.008,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0.4}));
        scene.add(stars);

        // ===== 粒子物理 =====
        function updateParticles(delta){
            const dt=Math.min(delta,0.05);
            const mappedA=attractors.map(a=>({x:(a.x-0.5)*5.5,y:(0.5-a.y)*5.5/aspect(),z:(a.z||0.5)*2-1}));
            const AR=2.0,AS=6.0,HS=2.5,DAMP=0.88;
            for(let i=0;i<N;i++){
                let vx=velArr[i*3],vy=velArr[i*3+1],vz=velArr[i*3+2];
                if(attractors.length>0&&handSeen){
                    let minD=Infinity,nearest=mappedA[0];
                    for(const at of mappedA){const dx=curPos[i*3]-at.x,dy=curPos[i*3+1]-at.y,dz=curPos[i*3+2]-at.z,d2=dx*dx+dy*dy+dz*dz;if(d2<minD){minD=d2;nearest=at;}}
                    const dist=Math.sqrt(minD);
                    if(dist<AR){const f=AS*(1-dist/AR),dx=nearest.x-curPos[i*3],dy=nearest.y-curPos[i*3+1],dz=nearest.z-curPos[i*3+2],invD=1/Math.max(dist,0.001);vx+=dx*invD*f*dt;vy+=dy*invD*f*dt;vz+=dz*invD*f*dt;}
                }
                vx+=(homePos[i*3]-curPos[i*3])*HS*dt;vy+=(homePos[i*3+1]-curPos[i*3+1])*HS*dt;vz+=(homePos[i*3+2]-curPos[i*3+2])*HS*dt;
                vx*=DAMP;vy*=DAMP;vz*=DAMP;
                curPos[i*3]+=vx*dt;curPos[i*3+1]+=vy*dt;curPos[i*3+2]+=vz*dt;
                velArr[i*3]=vx;velArr[i*3+1]=vy;velArr[i*3+2]=vz;
            }
            geom.attributes.position.needsUpdate=true;
        }

        // ===== 图片→粒子 =====
        function processImage(file){
            const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>convertImg(img);img.src=e.target.result;};r.readAsDataURL(file);
        }
        function convertImg(img){
            const maxD=180;let w=img.width,h=img.height;
            if(w>maxD||h>maxD){const r=Math.min(maxD/w,maxD/h);w=Math.floor(w*r);h=Math.floor(h*r);}
            const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
            cx.drawImage(img,0,0,w,h);const d=cx.getImageData(0,0,w,h).data;const valid=[];
            for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(d[i+3]>18)valid.push({x,y,r:d[i],g:d[i+1],b:d[i+2],a:d[i+3]});}
            if(!valid.length){toast('⚠️ 无有效像素');return;}
            let s=valid;
            if(valid.length>N){s=[];const step=valid.length/N;for(let i=0;i<N;i++)s.push(valid[Math.floor(i*step)]);}
            else if(valid.length<N){s=[];const reps=Math.ceil(N/valid.length);for(let r=0;r<reps;r++){for(const p of valid){s.push(p);if(s.length>=N)break;}if(s.length>=N)break;}}
            hasImage=true;const sc=4.5/Math.max(w,h),ox=-w*sc/2,oy=h*sc/2;
            for(let i=0;i<N;i++){
                const p=s[i];
                homePos[i*3]=p.x*sc+ox;homePos[i*3+1]=-(p.y*sc-oy);homePos[i*3+2]=(Math.random()-0.5)*0.8;
                curPos[i*3]=homePos[i*3];curPos[i*3+1]=homePos[i*3+1];curPos[i*3+2]=homePos[i*3+2];
                velArr[i*3]=velArr[i*3+1]=velArr[i*3+2]=0;
                colArr[i*3]=p.r/255;colArr[i*3+1]=p.g/255;colArr[i*3+2]=p.b/255;
                sizeArr[i]=0.15+(p.a/255)*0.5;
            }
            geom.attributes.position.needsUpdate=true;geom.attributes.color.needsUpdate=true;geom.attributes.size.needsUpdate=true;
            pCountEl.textContent=N.toLocaleString();toast('✅ 图片粒子就绪');
        }
        function resetParticles(){
            hasImage=false;randomHome();
            geom.attributes.position.needsUpdate=true;geom.attributes.color.needsUpdate=true;geom.attributes.size.needsUpdate=true;
            pCountEl.textContent=N.toLocaleString();toast('🔄 已重置');
        }

        // ===== ★★★ 骨骼绘制（修复版：加粗加亮 + 显式尺寸初始化）★★★ =====
        const CONNS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];

        function initSkCanvas(){
            skCanvas.width=window.innerWidth;
            skCanvas.height=window.innerHeight;
        }
        // 页面加载时立刻初始化
        initSkCanvas();
        window.addEventListener('resize',initSkCanvas);

        function drawSkeleton(lmList){
            // 确保尺寸正确
            if(skCanvas.width!==window.innerWidth||skCanvas.height!==window.innerHeight){
                initSkCanvas();
            }

            const W=skCanvas.width,H=skCanvas.height;
            skCtx.clearRect(0,0,W,H);

            if(!lmList||lmList.length===0){
                // 没检测到手时画一个提示
                skCtx.fillStyle='rgba(255,255,255,0.35)';
                skCtx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
                skCtx.textAlign='center';
                skCtx.fillText('等待检测手势...',W/2,H/2-20);
                return;
            }

            for(const lm of lmList){
                // ── 1. 半透明手掌区域（让骨骼更显眼）──
                skCtx.fillStyle='rgba(0,0,0,0.35)';
                skCtx.beginPath();
                const hull=[0,5,6,7,8,12,16,20,19,18,17,13,9,4,3,2,1,0];
                for(let i=0;i<hull.length;i++){
                    const p=lm[hull[i]];
                    const sx=isMirrored?(1-p.x)*W:p.x*W;
                    const sy=p.y*H;
                    if(i===0)skCtx.moveTo(sx,sy);else skCtx.lineTo(sx,sy);
                }
                skCtx.closePath();skCtx.fill();

                // ── 2. 粗骨架连线（白色半透明底层 + 亮色上层，双层描边）──
                // 底层：粗白线
                skCtx.strokeStyle='rgba(255,255,255,0.3)';
                skCtx.lineWidth=6;skCtx.lineCap='round';skCtx.lineJoin='round';
                skCtx.beginPath();
                for(const[a,b]of CONNS){
                    skCtx.moveTo(isMirrored?(1-lm[a].x)*W:lm[a].x*W,lm[a].y*H);
                    skCtx.lineTo(isMirrored?(1-lm[b].x)*W:lm[b].x*W,lm[b].y*H);
                }
                skCtx.stroke();

                // 上层：亮蓝线
                skCtx.strokeStyle='rgba(80,200,255,0.9)';
                skCtx.lineWidth=3;
                skCtx.beginPath();
                for(const[a,b]of CONNS){
                    skCtx.moveTo(isMirrored?(1-lm[a].x)*W:lm[a].x*W,lm[a].y*H);
                    skCtx.lineTo(isMirrored?(1-lm[b].x)*W:lm[b].x*W,lm[b].y*H);
                }
                skCtx.stroke();

                // ── 3. 关节点（大号带发光）──
                for(let i=0;i<lm.length;i++){
                    const p=lm[i];
                    const sx=isMirrored?(1-p.x)*W:p.x*W;
                    const sy=p.y*H;
                    const isIdx=(i===8);       // 食指（主要吸引点）
                    const isThumb=(i===4);      // 拇指
                    const isTip=(i===12||i===16||i===20);
                    const r=isIdx?8:isThumb?6:isTip?5:3.5;

                    // 外发光光晕
                    skCtx.beginPath();skCtx.arc(sx,sy,r+3,0,Math.PI*2);
                    if(isIdx){skCtx.fillStyle='rgba(255,255,0,0.3)';skCtx.fill();}
                    else if(isThumb||isTip){skCtx.fillStyle='rgba(255,255,255,0.2)';skCtx.fill();}

                    // 实体圆点
                    skCtx.beginPath();skCtx.arc(sx,sy,r,0,Math.PI*2);
                    if(isIdx){
                        skCtx.fillStyle='#ff0';
                        skCtx.shadowColor='rgba(255,255,0,1)';
                        skCtx.shadowBlur=16;
                    }else if(isThumb){
                        skCtx.fillStyle='#f80';
                        skCtx.shadowColor='rgba(255,136,0,0.8)';
                        skCtx.shadowBlur=10;
                    }else if(isTip){
                        skCtx.fillStyle='#f6a';
                        skCtx.shadowColor='rgba(255,107,157,0.7)';
                        skCtx.shadowBlur=8;
                    }else{
                        skCtx.fillStyle='#fff';
                        skCtx.shadowBlur=0;
                    }
                    skCtx.fill();
                    skCtx.shadowBlur=0;

                    // 食指标签
                    if(isIdx){
                        skCtx.fillStyle='#ff0';
                        skCtx.font='bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
                        skCtx.textAlign='center';
                        skCtx.fillText('👆 吸引点',sx,sy-16);
                    }
                }

                // ── 4. 拇指-食指虚线 ──
                const t=lm[4],idx=lm[8];
                const tx=isMirrored?(1-t.x)*W:t.x*W,ty=t.y*H;
                const ix=isMirrored?(1-idx.x)*W:idx.x*W,iy=idx.y*H;
                skCtx.strokeStyle='rgba(255,255,0,0.7)';
                skCtx.lineWidth=2;skCtx.setLineDash([6,4]);
                skCtx.beginPath();skCtx.moveTo(tx,ty);skCtx.lineTo(ix,iy);skCtx.stroke();
                skCtx.setLineDash([]);
            }
        }

        // ===== MediaPipe =====
        async function initHands(){
            if(handsInst)return handsInst;
            const H=window.Hands;
            handsInst=new H({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
            handsInst.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.5,minTrackingConfidence:0.3});
            handsInst.onResults(r=>{
                results=r;cbCount++;
                const lm=r.multiHandLandmarks;
                if(lm&&lm.length>0){
                    handSeen=true;
                    drawSkeleton(lm);
                    attractors=[];
                    for(const hand of lm){
                        attractors.push({x:isMirrored?1-hand[8].x:hand[8].x,y:hand[8].y,z:hand[8].z});
                        attractors.push({x:isMirrored?1-hand[12].x:hand[12].x,y:hand[12].y,z:hand[12].z});
                    }
                }else{
                    handSeen=false;attractors=[];
                    drawSkeleton(null); // 显示"等待检测"
                }
            });
            await handsInst.initialize();return handsInst;
        }

        // ===== 摄像头 =====
        async function startCam(){
            if(cameraOn)stopCam();await sleep(300);
            try{
                stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:640,height:480}});
                camVideo.srcObject=stream;await camVideo.play();
                if(camVideo.readyState<2)await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('超时')),8000);camVideo.onloadeddata=()=>{clearTimeout(t);res();};});
                await initHands();
                const process=async()=>{if(!cameraOn)return;if(!sending&&camVideo.readyState>=2&&camVideo.videoWidth>0){sending=true;offCtx.drawImage(camVideo,0,0,640,480);await handsInst.send({image:offCanvas}).catch(()=>{});sendCount++;sending=false;}rafId=requestAnimationFrame(process);};
                process();
                cameraOn=true;dotEl.className='dot on';btnCamera.classList.add('active');
                document.getElementById('video-layer').style.display='block';
                showMode('👆 手指吸引粒子');
            }catch(e){cameraOn=false;dotEl.className='dot off';btnCamera.classList.remove('active');document.getElementById('video-layer').style.display='none';toast(`❌ ${e.message}`,3000);}
        }
        function stopCam(){
            cameraOn=false;if(rafId){cancelAnimationFrame(rafId);rafId=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
            camVideo.srcObject=null;results=null;handSeen=false;attractors=[];
            skCtx.clearRect(0,0,skCanvas.width,skCanvas.height);
            dotEl.className='dot off';btnCamera.classList.remove('active');
            document.getElementById('video-layer').style.display='none';
        }
        async function toggleCam(){if(cameraOn)stopCam();else{btnCamera.disabled=true;try{await startCam();}finally{btnCamera.disabled=false;}}}
        async function flipCam(){
            facingMode=facingMode==='user'?'environment':'user';isMirrored=facingMode==='user';
            document.querySelector('#video-layer video').style.transform=isMirrored?'scaleX(-1)':'none';
            if(cameraOn){stopCam();await sleep(400);btnCamera.disabled=true;try{await startCam();}finally{btnCamera.disabled=false;}}
            toast(facingMode==='user'?'📱 前置':'📷 后置');
        }
        function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
        function toggleFS(){if(!document.fullscreenElement)document.body.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

        // ===== 动画 =====
        const clock=new THREE.Clock();let autoBreath=0;
        function animate(){
            requestAnimationFrame(animate);
            const delta=Math.min(clock.getDelta(),0.1);
            updateParticles(delta);
            if(!handSeen&&!cameraOn){dotEl.className='dot auto';autoBreath+=delta*0.5;attractors=[{x:0.5+Math.sin(autoBreath)*1.5/5.5,y:0.5-Math.cos(autoBreath*1.3)*1.2*aspect()/5.5,z:0.5}];}
            else if(!handSeen&&cameraOn){dotEl.className='dot on';}
            points.rotation.y+=delta*0.08;stars.rotation.y-=delta*0.04;
            renderer.render(scene,camera);
        }

        // ===== 事件 =====
        btnUpload.addEventListener('click',()=>fileInput.click());
        fileInput.addEventListener('change',e=>{if(e.target.files[0])processImage(e.target.files[0]);fileInput.value='';});
        btnCamera.addEventListener('click',toggleCam);btnFlip.addEventListener('click',flipCam);
        btnFS.addEventListener('click',toggleFS);btnReset.addEventListener('click',resetParticles);
        window.addEventListener('resize',()=>{camera.aspect=aspect();camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);mat.uniforms.uPixelRatio.value=Math.min(window.devicePixelRatio,2.5);if(!hasImage)for(let i=0;i<N;i++)homePos[i*3+1]=(Math.random()-0.5)*5.5/aspect();initSkCanvas();});
        window.addEventListener('keydown',e=>{switch(e.key.toLowerCase()){case'c':toggleCam();break;case'f':toggleFS();break;case'r':resetParticles();break;case'u':fileInput.click();break;case'v':flipCam();break;}});
        document.addEventListener('dragover',e=>e.preventDefault());
        document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer?.files?.[0];if(f?.type?.startsWith('image/'))processImage(f);});

        // ===== 启动 =====
        document.getElementById('video-layer').style.display='none';
        pCountEl.textContent=N.toLocaleString();
        // 初始画骨骼占位
        drawSkeleton(null);
        animate();
        console.log('✨ 就绪');
    </script>
</body>
</html>
