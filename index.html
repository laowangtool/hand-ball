<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 粒子 × 手势控制</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #04040c;
            --panel: rgba(10,10,24,0.9);
            --accent: #818cf8;
            --border: rgba(255,255,255,0.06);
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            height: 100dvh; width: 100vw;
            font-family: 'Inter','PingFang SC','Microsoft YaHei',sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #three-canvas { position: fixed; inset: 0; z-index: 1; }

        /* 摄像头小窗 */
        #cam-pip {
            position: fixed;
            bottom: 96px; right: 10px;
            width: 110px; height: 146px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,0.15);
            z-index: 10;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.55);
            background: #000;
            display: none;
        }
        #cam-pip video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #cam-pip canvas {
            position: absolute; inset: 0;
            pointer-events: none;
        }
        @media (min-width: 640px) {
            #cam-pip { width: 140px; height: 186px; bottom: 106px; right: 18px; border-radius: 14px; }
        }

        /* Toast */
        #toast {
            position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
            z-index: 100; padding: 7px 16px;
            border-radius: 16px;
            background: var(--panel);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            color: var(--text); font-size: 11px;
            transition: opacity 0.3s; opacity: 0;
            pointer-events: none; text-align: center;
        }
        #toast.show { opacity: 1; }

        /* 粒子数 */
        #particle-count {
            position: fixed; top: 48px; right: 14px;
            z-index: 8; color: var(--muted);
            font-size: 9px; letter-spacing: 0.06em;
            pointer-events: none; opacity: 0.55;
            font-variant-numeric: tabular-nums;
        }
        @media (min-width: 640px) {
            #particle-count { top: 52px; right: 18px; font-size: 10px; }
        }

        /* 模式标签 */
        #mode-tag {
            position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
            z-index: 10; padding: 4px 12px;
            border-radius: 10px;
            background: rgba(129,140,248,0.18);
            color: #a5b4fc; font-size: 10px; letter-spacing: 0.04em;
            pointer-events: none; opacity: 0; transition: opacity 0.35s;
        }
        #mode-tag.show { opacity: 1; }

        /* 底部面板 */
        .ui-panel {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: flex; gap: 5px;
            padding: 5px 8px;
            background: var(--panel);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 6px 22px rgba(0,0,0,0.5);
        }
        @media (min-width: 640px) {
            .ui-panel { bottom: 22px; gap: 7px; padding: 7px 12px; border-radius: 18px; }
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 3px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--text);
            font-size: 11px; font-weight: 500; cursor: pointer;
            transition: all 0.2s; white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            min-height: 34px; letter-spacing: 0.01em;
        }
        .btn:hover { background: rgba(255,255,255,0.07); }
        .btn:active { transform: scale(0.93); }
        .btn.active { background: var(--accent); border-color: var(--accent); color: #fff;
            box-shadow: 0 0 14px rgba(129,140,248,0.35); }
        .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
        @media (min-width: 640px) {
            .btn { padding: 8px 13px; font-size: 12px; gap: 4px; border-radius: 11px; }
            .btn svg { width: 16px; height: 16px; }
        }

        .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; transition: all 0.3s; background: #ef4444; }
        .dot.on { background: #22c55e; box-shadow: 0 0 7px #22c55e; }
        .dot.auto { background: #f59e0b; box-shadow: 0 0 5px #f59e0b; }

        #image-upload { display: none; }
    </style>
</head>
<body>

    <canvas id="three-canvas"></canvas>

    <div id="cam-pip">
        <video id="cam-video" playsinline autoplay muted></video>
        <canvas id="pip-canvas" width="140" height="186"></canvas>
    </div>

    <div id="toast"></div>
    <div id="mode-tag"></div>
    <div id="particle-count">25,000</div>

    <div class="ui-panel">
        <button class="btn" id="btn-upload" style="background:rgba(129,140,248,0.1);border-color:rgba(129,140,248,0.25);color:#a5b4fc;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
            </svg>
            <span>图片</span>
        </button>
        <button class="btn" id="btn-camera">
            <span class="dot" id="dot"></span>
            <span>手势</span>
        </button>
        <button class="btn" id="btn-mode">
            <span>🎯</span>
        </button>
        <button class="btn" id="btn-fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
            </svg>
        </button>
        <button class="btn" id="btn-reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 019.95 9"/>
            </svg>
        </button>
    </div>

    <input type="file" id="image-upload" accept="image/*">

    <script type="module">
        import * as THREE from 'three';

        // ============ DOM ============
        const threeCanvas = document.getElementById('three-canvas');
        const camVideo   = document.getElementById('cam-video');
        const pipCanvas  = document.getElementById('pip-canvas');
        const pipCtx     = pipCanvas.getContext('2d');
        const toastEl    = document.getElementById('toast');
        const modeTag    = document.getElementById('mode-tag');
        const pCountEl   = document.getElementById('particle-count');
        const dotEl      = document.getElementById('dot');
        const camPip     = document.getElementById('cam-pip');
        const btnCamera  = document.getElementById('btn-camera');
        const btnMode    = document.getElementById('btn-mode');
        const btnUpload  = document.getElementById('btn-upload');
        const btnFS      = document.getElementById('btn-fullscreen');
        const btnReset   = document.getElementById('btn-reset');
        const fileInput  = document.getElementById('image-upload');

        // ============ 状态 ============
        const MAX_P = 25000;
        let cameraOn    = false;
        let stream      = null;
        let handsInst   = null;
        let rafId       = null;
        let results     = null;
        let dispersion  = 0.5;
        let targetDisp  = 0.5;
        let handSeen    = false;
        let cbCount     = 0;
        let sendCount   = 0;
        let sending     = false;
        let gestureMode = 0;
        let handPos2D   = { x:0.5, y:0.5 };
        let particleCount = MAX_P;

        const offCanvas = document.createElement('canvas');
        offCanvas.width = 640; offCanvas.height = 480;
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        function toast(msg, dur=1800) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._t);
            toastEl._t = setTimeout(() => toastEl.classList.remove('show'), dur);
        }
        function showMode(msg) {
            modeTag.textContent = msg;
            modeTag.classList.add('show');
            clearTimeout(modeTag._t);
            modeTag._t = setTimeout(() => modeTag.classList.remove('show'), 1600);
        }

        // ============ THREE.JS ============
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x04040c, 0.0012);
        scene.background = new THREE.Color(0x04040c);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 30);
        camera.position.set(0, 0.3, 5.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;

        // ============ 细腻着色器 ============
        const vertShader = /* glsl */ `
            attribute vec3 randomPosition;
            attribute vec3 color;
            attribute float size;
            varying vec3 vColor;
            varying float vAlpha;
            varying float vDepth;
            uniform float uDispersion;
            uniform float uTime;
            uniform float uPointSize;
            uniform float uPixelRatio;

            void main() {
                vec3 pos = mix(position, randomPosition, uDispersion);
                float wave = sin(uTime*2.2 + position.x*4.8)*cos(uTime*1.6 + position.y*3.9)*0.018;
                wave += sin(uTime*3.1 + position.z*5.2)*0.012;
                pos += wave * (1.0 - uDispersion*0.5);

                vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                float dist = length(mv.xyz);
                float sa = clamp(4.0/-mv.z, 0.5, 2.2);
                gl_Position = projectionMatrix * mv;
                gl_PointSize = uPointSize * uPixelRatio * size * sa;
                gl_PointSize = clamp(gl_PointSize, 0.3, 28.0);
                vColor = color;
                vAlpha = 1.0 - uDispersion*0.2;
                vDepth = -mv.z;
            }
        `;

        const fragShader = /* glsl */ `
            varying vec3 vColor;
            varying float vAlpha;
            varying float vDepth;
            void main() {
                float d = length(gl_PointCoord - 0.5) * 2.0;
                // 更柔和的边缘过渡
                float core = exp(-d*d*3.5);
                float mid  = exp(-d*d*8.0);
                float edge = exp(-d*d*16.0);
                float alpha = core*0.55 + mid*0.35 + edge*0.1;
                alpha = smoothstep(0.03, 1.0, alpha);
                if (alpha < 0.015) discard;
                // 中心微微暖色
                vec3 col = vColor + core*0.15;
                // 远处粒子略微偏蓝（大气散射感）
                float fog = clamp(vDepth/12.0, 0.0, 0.3);
                col = mix(col, col*vec3(0.7,0.75,1.0), fog);
                gl_FragColor = vec4(col, alpha*vAlpha);
            }
        `;

        // ============ 粒子几何体 ============
        const geom = new THREE.BufferGeometry();
        let tpos, rpos, cols, siz;

        function genSphere(n) {
            tpos = new Float32Array(n*3);
            rpos = new Float32Array(n*3);
            cols = new Float32Array(n*3);
            siz  = new Float32Array(n);
            const R = 1.8, SR = 3.8;

            for (let i=0; i<n; i++) {
                // 用 Fibonacci + 随机微扰 实现更均匀的球面分布
                const phi   = Math.acos(1 - 2*(i+0.5)/n);
                const theta = Math.PI * (1+Math.sqrt(5)) * i;
                // 微扰避免完美规律排列
                const jitter = 0.03;
                const px = Math.sin(phi)*Math.cos(theta) + (Math.random()-0.5)*jitter;
                const py = Math.cos(phi) + (Math.random()-0.5)*jitter;
                const pz = Math.sin(phi)*Math.sin(theta) + (Math.random()-0.5)*jitter;
                const len = Math.sqrt(px*px+py*py+pz*pz);
                tpos[i*3]   = px/len*R;
                tpos[i*3+1] = py/len*R;
                tpos[i*3+2] = pz/len*R;

                const tr = Math.random()*Math.PI*2;
                const pr = Math.acos(2*Math.random()-1);
                const rr = SR*(0.55+Math.random()*0.45);
                rpos[i*3]   = Math.sin(pr)*Math.cos(tr)*rr;
                rpos[i*3+1] = Math.sin(pr)*Math.sin(tr)*rr;
                rpos[i*3+2] = Math.cos(pr)*rr;

                // 色相范围更窄，色彩更统一精致
                const hue = 0.56 + Math.random()*0.18;
                const sat = 0.55 + Math.random()*0.35;
                const lum = 0.4 + Math.random()*0.4;
                const c = new THREE.Color().setHSL(hue, sat, lum);
                cols[i*3]=c.r; cols[i*3+1]=c.g; cols[i*3+2]=c.b;

                // 更小更均匀的粒子尺寸
                siz[i] = 0.25 + Math.random()*0.75;
            }
        }

        function updateGeom() {
            for (const k in geom.attributes) geom.deleteAttribute(k);
            geom.setAttribute('position',       new THREE.BufferAttribute(tpos,3));
            geom.setAttribute('randomPosition', new THREE.BufferAttribute(rpos,3));
            geom.setAttribute('color',          new THREE.BufferAttribute(cols,3));
            geom.setAttribute('size',           new THREE.BufferAttribute(siz,1));
            geom.setDrawRange(0, tpos.length/3);
        }

        genSphere(MAX_P); updateGeom();

        const mat = new THREE.ShaderMaterial({
            vertexShader: vertShader,
            fragmentShader: fragShader,
            uniforms: {
                uDispersion: { value: 0.5 },
                uTime: { value: 0 },
                uPointSize: { value: 16.0 },
                uPixelRatio: { value: Math.min(window.devicePixelRatio, 2.5) },
            },
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        });

        const points = new THREE.Points(geom, mat);
        scene.add(points);

        // 浓郁背景星场
        const sg = new THREE.BufferGeometry();
        const sp = new Float32Array(1200*3);
        for (let i=0; i<1200; i++) {
            sp[i*3]=(Math.random()-0.5)*16;
            sp[i*3+1]=(Math.random()-0.5)*16;
            sp[i*3+2]=(Math.random()-0.5)*16;
        }
        sg.setAttribute('position', new THREE.BufferAttribute(sp,3));
        const stars = new THREE.Points(sg, new THREE.PointsMaterial({
            color: 0x555588, size: 0.012, transparent: true,
            depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.5,
        }));
        scene.add(stars);

        // ============ 手指拖尾粒子 ============
        const trailGroup = new THREE.Group();
        scene.add(trailGroup);
        const trailParticles = [];
        const MAX_TRAIL = 300;

        const trailGeo = new THREE.SphereGeometry(0.025, 5, 5);
        function spawnTrail(x, y) {
            const px = (x-0.5)*4.5;
            const py = (0.5-y)*3.5;
            const pz = 1.8;
            const trailMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(Math.random()*0.12+0.56, 0.75, 0.55),
                transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending,
            });
            const dot = new THREE.Mesh(trailGeo, trailMat);
            dot.position.set(px, py, pz);
            dot.userData = { life: 2.0, vx:(Math.random()-0.5)*0.6, vy:(Math.random()-0.5)*0.6, vz:-0.2-Math.random()*1.8 };
            trailGroup.add(dot);
            trailParticles.push(dot);
            if (trailParticles.length > MAX_TRAIL) {
                const old = trailParticles.shift();
                trailGroup.remove(old);
                old.material.dispose();
            }
        }

        function updateTrails(delta) {
            for (let i=trailParticles.length-1; i>=0; i--) {
                const p = trailParticles[i];
                p.userData.life -= delta;
                if (p.userData.life <= 0) {
                    trailGroup.remove(p);
                    p.material.dispose();
                    trailParticles.splice(i,1);
                } else {
                    p.position.x += p.userData.vx*delta;
                    p.position.y += p.userData.vy*delta;
                    p.position.z += p.userData.vz*delta;
                    const ratio = p.userData.life/2.0;
                    p.material.opacity = ratio;
                    p.scale.setScalar(0.4 + ratio*0.6);
                }
            }
        }

        // ============ 图片→粒子 ============
        function processImage(file) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => convertImg(img);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function convertImg(img) {
            const maxD = 200;
            let w=img.width, h=img.height;
            if (w>maxD||h>maxD) { const r=Math.min(maxD/w,maxD/h); w=Math.floor(w*r); h=Math.floor(h*r); }
            const cv=document.createElement('canvas');
            cv.width=w; cv.height=h;
            const cx=cv.getContext('2d');
            cx.drawImage(img,0,0,w,h);
            const d=cx.getImageData(0,0,w,h).data;
            const valid=[];
            for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
                const i=(y*w+x)*4;
                if (d[i+3]>18) valid.push({x,y,r:d[i],g:d[i+1],b:d[i+2],a:d[i+3]});
            }
            if (!valid.length) { toast('⚠️ 无有效像素，请用透明底PNG'); return; }

            let s=valid;
            if (valid.length>MAX_P) { s=[]; const step=valid.length/MAX_P; for (let i=0;i<MAX_P;i++) s.push(valid[Math.floor(i*step)]); }
            else if (valid.length<MAX_P) { s=[]; const reps=Math.ceil(MAX_P/valid.length); for (let r=0;r<reps;r++) { for(const p of valid){s.push(p);if(s.length>=MAX_P)break;} if(s.length>=MAX_P)break; } }

            particleCount=s.length;
            tpos=new Float32Array(s.length*3); rpos=new Float32Array(s.length*3); cols=new Float32Array(s.length*3); siz=new Float32Array(s.length);
            const sc=3.0/Math.max(w,h), ox=-w*sc/2, oy=h*sc/2, sr=3.8;
            for (let i=0;i<s.length;i++) {
                const p=s[i];
                tpos[i*3]=p.x*sc+ox; tpos[i*3+1]=-(p.y*sc-oy); tpos[i*3+2]=(Math.random()-0.5)*0.12;
                const tr=Math.random()*Math.PI*2, pr=Math.acos(2*Math.random()-1), rr=sr*(0.55+Math.random()*0.45);
                rpos[i*3]=Math.sin(pr)*Math.cos(tr)*rr; rpos[i*3+1]=Math.sin(pr)*Math.sin(tr)*rr; rpos[i*3+2]=Math.cos(pr)*rr;
                cols[i*3]=p.r/255; cols[i*3+1]=p.g/255; cols[i*3+2]=p.b/255;
                siz[i]=0.2+(p.a/255)*0.8;
            }
            updateGeom();
            targetDisp=0; dispersion=0;
            pCountEl.textContent = particleCount.toLocaleString();
            toast('✅ 图片已加载');
        }

        function resetSphere() {
            genSphere(MAX_P); updateGeom();
            particleCount=MAX_P; targetDisp=0.5;
            pCountEl.textContent = MAX_P.toLocaleString();
            toast('🔄 已恢复球体');
        }

        // ============ 骨骼绘制 ============
        const CONNS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];

        function drawPipSkeleton(lmList) {
            const pw = camPip.clientWidth, ph = camPip.clientHeight;
            pipCanvas.width = pw; pipCanvas.height = ph;
            pipCtx.clearRect(0,0,pw,ph);
            if (!lmList||lmList.length===0) return;
            for (const lm of lmList) {
                pipCtx.strokeStyle='#4cf'; pipCtx.lineWidth=1.3;
                pipCtx.beginPath();
                for (const [a,b] of CONNS) {
                    pipCtx.moveTo((1-lm[a].x)*pw, lm[a].y*ph);
                    pipCtx.lineTo((1-lm[b].x)*pw, lm[b].y*ph);
                }
                pipCtx.stroke();
                for (let i=0;i<lm.length;i++) {
                    const sx=(1-lm[i].x)*pw, sy=lm[i].y*ph;
                    const r=(i===4||i===8)?3.5:(i===12||i===16||i===20)?2.5:1.5;
                    pipCtx.beginPath(); pipCtx.arc(sx,sy,r,0,Math.PI*2);
                    pipCtx.fillStyle=(i===4||i===8)?'#ff0':'#fff'; pipCtx.fill();
                }
            }
        }

        // ============ MediaPipe ============
        async function initHands() {
            if (handsInst) return handsInst;
            const H = window.Hands;
            handsInst = new H({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
            handsInst.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.5, minTrackingConfidence:0.3 });
            handsInst.onResults(r => {
                results = r; cbCount++;
                const lm = r.multiHandLandmarks;
                if (lm && lm.length>0) {
                    handSeen = true;
                    drawPipSkeleton(lm);

                    if (gestureMode===0) {
                        if (lm.length===1) {
                            const d = Math.hypot(lm[0][4].x-lm[0][8].x, lm[0][4].y-lm[0][8].y, lm[0][4].z-lm[0][8].z);
                            targetDisp = Math.max(0, Math.min(1, (d-0.025)/(0.22-0.025)));
                        } else {
                            const c1=avg(lm[0]), c2=avg(lm[1]);
                            const d=Math.hypot(c1.x-c2.x,c1.y-c2.y,c1.z-c2.z);
                            targetDisp = Math.max(0, Math.min(1, (d-0.08)/(0.55-0.08)));
                        }
                    } else if (gestureMode===1) {
                        const c = avg(lm[0]);
                        handPos2D = { x:c.x, y:c.y };
                    } else if (gestureMode===2) {
                        const idx = lm[0][8];
                        handPos2D = { x:idx.x, y:idx.y };
                        spawnTrail(idx.x, idx.y);
                        const d = Math.hypot(lm[0][4].x-lm[0][8].x, lm[0][4].y-lm[0][8].y, lm[0][4].z-lm[0][8].z);
                        targetDisp = Math.max(0, Math.min(1, (d-0.025)/(0.22-0.025)));
                    }
                } else {
                    handSeen = false;
                    pipCtx.clearRect(0,0,pipCanvas.width,pipCanvas.height);
                }
            });
            await handsInst.initialize();
            return handsInst;
        }

        function avg(lm) { let x=0,y=0,z=0; for(const p of lm){x+=p.x;y+=p.y;z+=p.z;} const n=lm.length; return {x:x/n,y:y/n,z:z/n}; }

        // ============ 摄像头 ============
        async function startCam() {
            if (cameraOn) stopCam();
            await sleep(300);
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:640, height:480 } });
                camVideo.srcObject = stream;
                await camVideo.play();
                if (camVideo.readyState<2) await new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error('超时')),8000); camVideo.onloadeddata=()=>{clearTimeout(t);res();}; });
                await initHands();

                const process = async () => {
                    if (!cameraOn) return;
                    if (!sending && camVideo.readyState>=2 && camVideo.videoWidth>0) {
                        sending = true;
                        offCtx.drawImage(camVideo,0,0,640,480);
                        await handsInst.send({ image: offCanvas }).catch(()=>{});
                        sendCount++;
                        sending = false;
                    }
                    rafId = requestAnimationFrame(process);
                };
                process();

                cameraOn = true;
                dotEl.className = 'dot on';
                btnCamera.classList.add('active');
                camPip.style.display = 'block';
                toast('👌 手势识别已激活');
            } catch(e) {
                cameraOn = false;
                dotEl.className = 'dot off';
                btnCamera.classList.remove('active');
                camPip.style.display = 'none';
                toast(`❌ ${e.message}`, 3000);
            }
        }

        function stopCam() {
            cameraOn = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
            if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
            camVideo.srcObject = null;
            results = null; handSeen = false;
            pipCtx.clearRect(0,0,pipCanvas.width,pipCanvas.height);
            dotEl.className = 'dot off';
            btnCamera.classList.remove('active');
            camPip.style.display = 'none';
        }

        async function toggleCam() {
            if (cameraOn) stopCam();
            else { btnCamera.disabled=true; try{await startCam();}finally{btnCamera.disabled=false;} }
        }

        function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }

        // ============ 模式 ============
        const modeNames = ['🎯 捏合控制粒子聚散', '🖐️ 手掌旋转粒子球', '👆 手指拖尾光点'];
        const modeIcons = ['🎯','🖐️','👆'];
        function cycleMode() {
            gestureMode = (gestureMode+1)%3;
            btnMode.querySelector('span').textContent = modeIcons[gestureMode];
            showMode(modeNames[gestureMode]);
        }

        // ============ 全屏 ============
        function toggleFS() {
            if (!document.fullscreenElement) document.body.requestFullscreen().catch(()=>{});
            else document.exitFullscreen();
        }

        // ============ 动画 ============
        const clock = new THREE.Clock();
        let autoBreath = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const t = performance.now()*0.001;

            if (!handSeen && !cameraOn) {
                autoBreath += delta*0.65;
                targetDisp = Math.sin(autoBreath)*0.5+0.5;
                dotEl.className = 'dot auto';
            } else if (!handSeen && cameraOn) {
                targetDisp = Math.max(0, targetDisp - delta*0.7);
                dotEl.className = 'dot on';
            }

            dispersion += (targetDisp - dispersion)*5.0*delta;
            mat.uniforms.uDispersion.value = dispersion;
            mat.uniforms.uTime.value = t;

            if (gestureMode===1 && handSeen && cameraOn) {
                const tx = (handPos2D.x-0.5)*3;
                const ty = (handPos2D.y-0.5)*2;
                points.rotation.y += (tx-points.rotation.y)*2.5*delta;
                points.rotation.x += (ty-points.rotation.x)*2.5*delta;
            } else {
                const rs = 0.12 + dispersion*0.28;
                points.rotation.y += rs*delta;
                points.rotation.x += rs*0.3*delta;
            }
            stars.rotation.y -= 0.05*delta;
            updateTrails(delta);

            camera.position.y = 0.3 + Math.sin(t*0.35)*0.1;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }

        // ============ 事件 ============
        btnUpload.addEventListener('click', ()=>fileInput.click());
        fileInput.addEventListener('change', e=>{ if(e.target.files[0]) processImage(e.target.files[0]); fileInput.value=''; });
        btnCamera.addEventListener('click', toggleCam);
        btnMode.addEventListener('click', cycleMode);
        btnFS.addEventListener('click', toggleFS);
        btnReset.addEventListener('click', resetSphere);
        window.addEventListener('resize', ()=>{
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            mat.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2.5);
        });
        window.addEventListener('keydown', e=>{
            switch(e.key.toLowerCase()) {
                case 'c': toggleCam(); break;
                case 'm': cycleMode(); break;
                case 'f': toggleFS(); break;
                case 'r': resetSphere(); break;
                case 'u': fileInput.click(); break;
            }
        });
        document.addEventListener('dragover', e=>e.preventDefault());
        document.addEventListener('drop', e=>{ e.preventDefault(); const f=e.dataTransfer?.files?.[0]; if(f?.type?.startsWith('image/')) processImage(f); });

        // ============ 启动 ============
        pCountEl.textContent = MAX_P.toLocaleString();
        animate();

        console.log('✨ 3D 粒子 × 手势控制 已就绪');
        console.log('   📷 C → 摄像头 | 🔄 M → 模式 | 🖼️ U → 图片 | 🔲 F → 全屏');
    </script>
</body>
</html>
